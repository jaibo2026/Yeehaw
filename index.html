<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6A3415">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Herria">
<title>Herria</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#FFFFFF; --surface:#FFF6EE; --surface2:#FFFFFF; --line:#F1DED2;
  --text:#2A0E0F; --soft:#4E2E27; --muted:#8C6A5D;
  --accent:#FF3347; --gold:#FFD23F; --teal:#FFD23F; --ink:#1A0608;
  --grad:linear-gradient(120deg,#FFD23F 0%,#FF7A1A 50%,#E8172E 100%);
  --ring:repeating-conic-gradient(from 0deg,#FFD23F 0deg 12deg,#E8172E 12deg 24deg);
  --glow:0 8px 22px rgba(255,90,26,.32);
  --stitch:1.5px dashed rgba(232,120,26,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Work Sans',system-ui,sans-serif;font-size:15px}
body{background:var(--bg)}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;transition:transform .12s ease}
button:active{transform:scale(.94)}
a{color:var(--accent)}
img,video{display:block;max-width:100%}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.logo{font-family:Rye,serif;font-size:30px;letter-spacing:.5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 12px rgba(255,122,26,.45))}
.topbar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.9);border-bottom:var(--stitch);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;padding:0}
.iconbtn.plain{border:none;background:none}
main{flex:1;padding-bottom:calc(104px + env(safe-area-inset-bottom))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 14px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
.nav-in{pointer-events:auto;max-width:492px;margin:0 auto;display:flex;justify-content:space-around;align-items:center;padding:6px 8px;border-radius:28px;background:rgba(255,255,255,.94);backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);border:1px solid var(--line);box-shadow:0 8px 28px rgba(120,40,20,.16)}
.nav button{border:none;background:none;width:58px;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.nav button.on{color:var(--text)}
.nav button.on svg{stroke:url(#g);filter:drop-shadow(0 0 8px rgba(255,122,26,.7))}
.nav button.on::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.nav .plus{width:60px;height:46px;border-radius:16px;background:var(--grad);color:var(--ink);box-shadow:var(--glow);outline:var(--stitch);outline-color:rgba(26,6,8,.45);outline-offset:-5px}
.stories{display:flex;gap:14px;overflow-x:auto;padding:10px 16px 16px;scrollbar-width:none}
.stories::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.story{border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;flex-shrink:0}
.story span{font-size:12px;font-weight:500;color:var(--soft);max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{position:relative;width:70px;height:70px;border-radius:50%;padding:3px;background:var(--line)}
.ring.new{background:none}
.ring.new::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--ring);animation:spin 4s linear infinite;box-shadow:0 0 16px rgba(255,122,26,.45)}
.ring>div{position:relative;width:100%;height:100%;border-radius:50%;border:3px solid var(--bg);overflow:hidden}
.avatar{border-radius:50%;background:var(--grad);color:var(--ink);font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 16px;scrollbar-width:none}
.chip{flex-shrink:0;height:38px;padding:0 18px;border-radius:19px;border:1px solid var(--line);background:var(--surface);color:var(--soft);font-weight:600;font-size:14px}
.chip.on{background:var(--grad);border-color:transparent;color:var(--ink);box-shadow:0 4px 16px rgba(255,122,26,.35)}
.post{margin:0 10px 22px;border-radius:24px;background:#FFFFFF;border:1px solid var(--line);overflow:hidden;box-shadow:0 6px 22px rgba(120,40,20,.10)}
.post-head{display:flex;align-items:center;gap:10px;padding:12px 12px 10px;border-bottom:var(--stitch);margin:0 8px 0}
.post-head .who{flex:1;min-width:0;border:none;background:none;padding:0;text-align:left;display:flex;flex-direction:column}
.post-head b{font-size:15px}
.post-head small{color:var(--muted);font-size:13px}
.tag{font-size:12px;font-weight:700;color:var(--ink);background:var(--grad);padding:5px 11px;border-radius:12px}
.media{position:relative;background:#000;width:100%;aspect-ratio:4/5;overflow:hidden;user-select:none;-webkit-user-select:none}
.media img,.media video{width:100%;height:100%;object-fit:cover}
.burst{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0}
.burst.go{animation:burst .9s ease-out}
.burst b{font-family:Rye,serif;font-size:42px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 14px rgba(0,0,0,.7))}
@keyframes burst{0%{opacity:0;transform:scale(.4) rotate(-8deg)}20%{opacity:1;transform:scale(1.2) rotate(4deg)}40%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:scale(1.05) translateY(-18px)}}
.actions{display:flex;align-items:center;padding:6px 6px 0}
.actions .count{margin-left:auto;padding-right:10px;font-weight:700;font-size:14px}
.liked{color:var(--accent)}
.liked svg{fill:var(--accent);filter:drop-shadow(0 0 8px rgba(232,23,46,.8))}
.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{50%{transform:scale(1.4)}}
.caption{margin:2px 16px 0;font-size:14px;line-height:1.45;color:var(--soft);white-space:pre-wrap;word-wrap:break-word}
.caption b{color:var(--text)}
.meta{margin:6px 16px 14px;color:var(--muted);font-size:13px}
.linkbtn{border:none;background:none;padding:0;color:var(--muted);font-size:13px}
.shop{margin:12px 12px 4px;padding:12px;border-radius:18px;background:linear-gradient(135deg,rgba(255,122,26,.12),rgba(255,210,63,.12));border:var(--stitch)}
.shop h4{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.shop h4 small{font-weight:400;color:var(--muted);font-size:11px}
.shop-items{display:flex;gap:8px;overflow-x:auto}
.shop-item{flex-shrink:0;min-width:110px;padding:12px;border-radius:14px;background:#FFFFFF;border:1px solid var(--line);text-decoration:none;color:var(--text);display:flex;flex-direction:column;gap:4px}
.shop-item span{color:#D0451B;font-size:13px;font-weight:700}
.empty{text-align:center;padding:60px 30px;color:var(--muted);line-height:1.5}
.empty .logo{display:block;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:0 4px}
.tile{position:relative;aspect-ratio:3/4;background:var(--surface);border:none;padding:0;overflow:hidden;border-radius:10px}
.tile img,.tile video{width:100%;height:100%;object-fit:cover}
.tile .play{position:absolute;top:6px;right:6px;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))}
.page{padding-left:16px;padding-right:16px}
.page form{padding-bottom:24px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--soft)}
.input{width:100%;min-height:50px;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
.input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(255,122,26,.25)}
textarea.input{min-height:90px;resize:vertical}
.btn{width:100%;height:52px;border-radius:26px;border:none;background:var(--grad);color:var(--ink);font-weight:700;font-size:16px;box-shadow:var(--glow)}
.btn:disabled{opacity:.55}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--text);box-shadow:none}
.btn.small{width:auto;height:42px;padding:0 20px;font-size:14px}
.err{color:#C2183A;font-size:14px;margin:0 0 12px;min-height:1px}
.ok{color:#1E8A4C;font-size:14px;margin:0 0 12px}
.picker{width:100%;aspect-ratio:4/5;border-radius:22px;border:2px dashed rgba(255,210,63,.55);background:linear-gradient(135deg,rgba(255,122,26,.08),rgba(255,210,63,.1));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);overflow:hidden;padding:0;margin-bottom:14px}
.picker img,.picker video{width:100%;height:100%;object-fit:cover}
.auth{flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 22px calc(30px + env(safe-area-inset-bottom));position:relative;isolation:isolate}
.auth::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 30% at 20% 20%,rgba(255,122,26,.35),transparent 70%),radial-gradient(40% 30% at 80% 30%,rgba(255,210,63,.3),transparent 70%),radial-gradient(45% 35% at 50% 85%,rgba(232,23,46,.22),transparent 70%);filter:blur(30px);animation:float 12s ease-in-out infinite alternate}
@keyframes float{to{transform:translate(4%,-3%) rotate(8deg)}}
.auth .logo{font-size:60px;text-align:center}
.auth form{padding:20px 18px;border-radius:24px;background:rgba(255,255,255,.85);border:var(--stitch);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.auth p.lead{text-align:center;color:var(--soft);margin:6px 0 30px}
.switch{text-align:center;margin-top:18px;color:var(--muted);font-size:14px}
.switch button{border:none;background:none;color:#D0451B;font-weight:700;padding:8px}
.prof-head{display:flex;align-items:center;gap:18px;padding:6px 16px 14px}
.prof-head .ring{background:var(--ring)}
.stats{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));text-align:center;gap:8px}
.stats>div{padding:10px 4px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.stats b{display:block;font-size:20px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats span{font-size:12px;color:var(--muted)}
.prof-info{padding:0 16px 14px}
.prof-info b{font-size:18px}
.prof-info div{color:var(--muted);font-size:14px;margin-top:2px}
.prof-btns{display:flex;gap:8px;padding:0 16px 16px}
.prof-btns .btn{height:42px;font-size:14px}
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(40,10,5,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:85vh;max-height:85dvh;background:var(--surface2);border-radius:26px 26px 0 0;border:1px solid var(--line);display:flex;flex-direction:column;animation:up .25s cubic-bezier(.2,1,.3,1)}
.sheet .post{margin:0 0 10px;box-shadow:none}
@keyframes up{from{transform:translateY(60px);opacity:.3}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 6px 18px;border-bottom:1px solid var(--line)}
.sheet-head b{font-size:16px}
.sheet-body{overflow-y:auto;padding:12px 16px;flex:1}
.sheet-foot{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.cmt{display:flex;gap:10px;margin-bottom:14px}
.cmt p{margin:0;font-size:14px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;color:var(--soft)}
.cmt p b{color:var(--text)}
.cmt small{color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--grad);color:var(--ink);padding:11px 20px;border-radius:22px;font-weight:700;font-size:14px;z-index:30;max-width:90vw;text-align:center;box-shadow:var(--glow);animation:up .25s ease-out}
.spinner{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--teal);border-right-color:var(--gold);animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.row{display:flex;gap:8px}
.row .input{flex:1;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- Sundowns ---- */
.sd-add{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;background:var(--grad);color:var(--ink);border:3px solid var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;line-height:1}
.ring.seen{background:#E6D2C7}
.ring.blank{background:none;border:2px dashed rgba(255,210,63,.55);padding:1px}
.story .sd-add{max-width:none;overflow:visible;color:var(--ink);width:28px;height:28px;font-size:18px;z-index:2}
.sd-new>div{display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#FFFDF8,#F3E6CC)}
.story .sd-plus{font-size:34px;font-weight:300;color:#6A3415;line-height:1;max-width:none!important;overflow:visible!important}
.sd-new{border-color:#CFAE73!important}
.kinds svg{width:20px;height:20px}
.sd-viewer{color:#fff;position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;animation:up .2s ease-out}
.sd-in{position:relative;flex:1;max-width:520px;width:100%;margin:0 auto;display:flex;align-items:center;justify-content:center;overflow:hidden}
.sd-in img,.sd-in video{width:100%;height:100%;object-fit:contain}
.sd-top{position:absolute;left:0;right:0;top:0;z-index:3;padding:calc(10px + env(safe-area-inset-top)) 10px 18px;background:linear-gradient(rgba(0,0,0,.65),transparent)}
.sd-bars{display:flex;gap:4px;margin-bottom:10px}
.sd-bar{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.sd-bar i{display:block;height:100%;width:0;background:var(--grad)}
.sd-head{display:flex;align-items:center;gap:10px}
.sd-head b{font-size:15px}
.sd-head small{color:rgba(255,255,255,.75);font-size:13px}
.sd-head .sp{flex:1}
.sd-zone{position:absolute;top:80px;bottom:90px;z-index:2;border:none;background:none;padding:0}
.sd-zone.prev{left:0;width:33%}
.sd-zone.next{right:0;width:67%}
.sd-cap{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:24px 18px calc(22px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.7));font-size:15px;line-height:1.4;text-align:center;white-space:pre-wrap;word-wrap:break-word}
.sd-label{display:inline-flex;align-items:center;gap:6px;font-family:Rye,serif;font-size:13px;color:var(--gold)}

.sd-viewer .sd-top,.sd-viewer .sd-cap{transition:opacity .2s}
.sd-viewer.is-held .sd-top,.sd-viewer.is-held .sd-cap{opacity:0}
.sd-paused{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;display:none;align-items:center;gap:8px;padding:10px 16px;border-radius:22px;background:rgba(0,0,0,.55);color:#fff;font-weight:700;font-size:14px;pointer-events:none}
.sd-paused svg{width:18px;height:18px}
.sd-zone{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
/* ---- Rides ---- */
.rides{color:#fff;position:fixed;top:0;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;overflow-y:auto;scroll-snap-type:y mandatory;background:#000;scrollbar-width:none;z-index:1}
.rides::-webkit-scrollbar{display:none}
.rides-top{color:#fff;position:fixed;top:0;left:0;right:0;max-width:520px;margin:0 auto;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:linear-gradient(rgba(0,0,0,.55),transparent);pointer-events:none}
.rides-top>*{pointer-events:auto}
.ride{position:relative;height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#000}
.ride video{width:100%;height:100%;object-fit:cover}
.ride .burst{z-index:2}
.ride-info{position:absolute;left:0;right:76px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:3;padding:0 14px;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.ride-info .who{display:flex;align-items:center;gap:10px;border:none;background:none;padding:0;margin-bottom:8px;text-align:left}
.ride-info .who b{font-size:16px}
.ride-info p{margin:0 0 8px;font-size:14px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.ride::after{content:"";position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.65));pointer-events:none;z-index:1}
.ride-side{position:absolute;right:6px;bottom:calc(100px + env(safe-area-inset-bottom));z-index:3;display:flex;flex-direction:column;align-items:center;gap:6px}
.ride-side .iconbtn{width:52px;height:52px;border-radius:26px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15);color:#fff}
.ride-side span{font-size:12px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.8);margin-bottom:6px}
.ride-paused{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;pointer-events:none}
.ride-paused span{width:76px;height:76px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;color:#fff}
.kinds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:4px;border-radius:20px;background:var(--surface);border:1px solid var(--line);margin-bottom:14px}
.kinds button{height:44px;border:none;border-radius:16px;background:none;color:var(--soft);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.kinds button.on{background:var(--grad);color:var(--ink);box-shadow:var(--glow)}
.hint{font-size:13px;color:var(--muted);margin:-6px 0 14px;line-height:1.4}

/* ---- Animales ---- */
.animal-pic{background:linear-gradient(135deg,#FFE7B8,#FFD0B0);color:#B5401A}
.animal-pic>span{display:flex;align-items:center;justify-content:center;width:55%;height:55%}
.animal-pic>span svg{width:100%;height:100%}
.animal-tag{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 5px;border-radius:17px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:13px}
.ride .animal-tag{background:rgba(0,0,0,.4);border-color:rgba(255,255,255,.25);color:#fff}
.herd{padding:0 0 16px}
.herd h3{display:flex;align-items:center;gap:8px;margin:0 16px 10px;font-size:15px}
.herd h3 svg{width:18px;height:18px;color:#D0451B}
.herd-row{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none}
.herd-row::-webkit-scrollbar{display:none}
.herd-card{flex-shrink:0;width:96px;padding:12px 6px;border-radius:18px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 14px rgba(120,40,20,.07)}
.herd-card b{font-size:13px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.herd-card small{font-size:11px;color:var(--muted)}
.herd-card.add{border:1.5px dashed rgba(232,120,26,.55);background:var(--surface);box-shadow:none}
.herd-plus{width:64px;height:64px;border-radius:50%;background:var(--grad);color:var(--ink);font-size:32px;font-weight:700;display:flex;align-items:center;justify-content:center}
.animal-hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 20px 16px}
.animal-ring{padding:5px;border-radius:50%;background:var(--ring);box-shadow:var(--glow);margin-bottom:12px}
.animal-ring .avatar{border:4px solid #fff}
.animal-hero h1{margin:0;font-family:Rye,serif;font-weight:400;font-size:32px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.animal-meta{color:var(--muted);font-size:14px;margin-top:4px}
.animal-owner{display:inline-flex;align-items:center;gap:8px;margin-top:10px;border:none;background:none;color:var(--soft);font-size:14px;padding:4px}
.animal-bio{margin:10px 0 0;font-size:14px;line-height:1.45;color:var(--soft);max-width:420px;white-space:pre-wrap}

/* ---- Menú y reglas ---- */
.menu{padding:8px 10px calc(14px + env(safe-area-inset-bottom))}
.menu-item{width:100%;min-height:52px;display:flex;align-items:center;gap:12px;padding:0 12px;border:none;border-radius:14px;background:none;color:var(--text);font-size:15px;font-weight:600;text-align:left}
.menu-item:active{background:var(--surface)}
.menu-item.danger{color:#C2183A}
.rules{font-size:14px;line-height:1.5;color:var(--soft);padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.rules p{margin:0 0 14px}
.rules-sec h4{margin:16px 0 6px;font-size:15px;color:var(--text)}
.rules-sec ul{margin:0;padding-left:20px}
.rules-sec li{margin-bottom:6px}

/* ---- Bienvenida ---- */
.welcome-card{margin:0 10px 16px;padding:16px;border-radius:24px;background:linear-gradient(135deg,rgba(255,210,63,.16),rgba(255,122,26,.12) 50%,rgba(232,23,46,.1));border:var(--stitch)}
.wc-head{display:flex;align-items:flex-start;justify-content:space-between}
.wc-kicker{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.wc-lead{margin:6px 0 12px;font-size:14px;color:var(--soft)}
.wc-tips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wc-tip{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.wc-tip b{display:block;font-size:14px}
.wc-tip small{display:block;font-size:12px;line-height:1.35;color:var(--muted);margin-top:2px}
.wc-ico{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:var(--grad);color:var(--ink);display:flex;align-items:center;justify-content:center}
.wc-ico svg{width:18px;height:18px}
.welcome{flex:1;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));position:relative;isolation:isolate}
.welcome::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 30% at 20% 15%,rgba(255,210,63,.28),transparent 70%),radial-gradient(40% 30% at 85% 30%,rgba(255,122,26,.22),transparent 70%),radial-gradient(45% 35% at 50% 90%,rgba(232,23,46,.14),transparent 70%);filter:blur(30px)}
.wl-top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.wl-dots{display:flex;gap:6px}
.wl-dots span{width:26px;height:6px;border-radius:3px;background:var(--line)}
.wl-dots span.on{background:var(--grad)}
.wl-body{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;max-width:420px;width:100%;margin:0 auto}
.wl-title{margin:0 0 8px;font-family:Rye,serif;font-weight:400;font-size:30px;line-height:1.15;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.wl-sub{margin:0 0 24px;color:var(--soft);font-size:15px;line-height:1.45}
.wl-avatar{display:flex;justify-content:center;margin-bottom:12px}
.wl-avatar .avatar{border:4px solid #fff;box-shadow:var(--glow)}
.wl-hat{display:flex;justify-content:center;margin-bottom:18px}
.wl-hat svg{width:140px;height:92px}

.liked .horse,.ride .liked .horse{filter:drop-shadow(0 2px 4px rgba(90,44,16,.45))}
.rear .horse,.burst.go .horse{animation:rear .9s cubic-bezier(.3,1.25,.5,1) both}
@keyframes rear{0%{transform:rotate(0) scale(1)}30%{transform:rotate(-16deg) translateY(-3px) scale(1.18)}55%{transform:rotate(6deg) scale(1.05)}75%{transform:rotate(-4deg)}100%{transform:rotate(0) scale(1)}}
.burst-horse .horse{width:150px;height:150px;filter:drop-shadow(0 0 2px #FBF0D8) drop-shadow(0 0 2px #FBF0D8) drop-shadow(0 4px 14px rgba(0,0,0,.55))}
.wc-ico .horse{width:24px;height:24px;filter:none}
/* ---------- Mensajes ---------- */
.dm-btn{position:relative;color:var(--text)}
.dm-badge{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#E8172E;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.inbox-row{width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:none;text-align:left}
.inbox-row:active{background:var(--surface)}
.inbox-row .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.inbox-row .who b{font-size:15px}
.inbox-row .who span{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inbox-row.unread .who span{color:var(--text);font-weight:600}
.inbox-row small{color:var(--muted);font-size:12px;flex-shrink:0}
.inbox-dot{width:10px;height:10px;border-radius:50%;background:var(--grad);box-shadow:0 0 8px rgba(255,122,26,.6);flex-shrink:0}
.dm-empty{text-align:center;padding:50px 30px;color:var(--muted);line-height:1.5}
.dm-empty b{display:block;color:var(--text);font-size:17px;margin:10px 0 4px}
.chat-head{gap:6px;justify-content:flex-start}
.chat-head .who{display:flex;align-items:center;gap:10px;border:none;background:none;padding:0;font-weight:700;font-size:16px;min-width:0}
.chat{flex:1;display:flex;flex-direction:column;gap:4px;padding:14px 12px calc(86px + env(safe-area-inset-bottom))}
.msg{max-width:78%;padding:9px 14px;border-radius:20px;font-size:15px;line-height:1.38;white-space:pre-wrap;word-wrap:break-word}
.msg.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--grad);color:var(--ink);border-bottom-right-radius:6px}
.msg.pending{opacity:.6}
.msg-time{align-self:center;color:var(--muted);font-size:12px;margin:10px 0 4px}
.msg-seen{align-self:flex-end;color:var(--muted);font-size:12px;margin:2px 4px 0}
.composer{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.96);border-top:var(--stitch);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.composer form{max-width:520px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.composer textarea{flex:1;min-height:46px;max-height:130px;resize:none;border-radius:23px;padding:12px 16px;line-height:1.3}
.composer .send{width:46px;height:46px;border-radius:23px;border:none;background:var(--grad);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:var(--glow);flex-shrink:0}
.composer .send:disabled{opacity:.5}
.song-chip{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:5px 12px 5px 5px;border-radius:22px;border:1px solid #D6BC93;background:linear-gradient(180deg,#FFFDF8,#F3E6CC);color:#3B2314;font-size:13px;font-weight:600;text-align:left;box-shadow:0 2px 6px rgba(90,45,15,.12)}
.song-chip img,.song-chip .song-sp{width:30px;height:30px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#6A3415;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;animation:spin 6s linear infinite}
.song-chip .song-sp{background:#1DB954}
.song-chip .song-note{font-size:13px}
.song-chip .song-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.song-chip.dark{background:rgba(20,8,2,.55);border-color:rgba(247,226,186,.45);color:#FBF0D8;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-shadow:none}
.song-prev{margin-top:4px}
.song-picked{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.song-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.song-row{display:flex;align-items:center;gap:10px;padding:6px;border-radius:14px;background:#FFFDF8;border:1px solid #E2CFAF;cursor:pointer}
.song-row:active{background:#F3E6CC}
.song-row img{width:46px;height:46px;border-radius:8px;object-fit:cover;flex-shrink:0;background:#E2CFAF}
.song-row .who{flex:1;min-width:0;display:flex;flex-direction:column}
.song-row .who b,.song-row .who small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song-row .who small{color:var(--muted)}
.song-play{width:38px;height:38px;border-radius:19px;border:1px solid #CFAE73;background:linear-gradient(135deg,#FBF0D8,#EBD3A6);color:#3B2314;font-size:14px;flex-shrink:0}
.song-play.playing{background:#6A3415;color:#FBF0D8}
.song-chip .song-eq{display:none;align-items:flex-end;gap:2px;height:14px}
.song-chip .song-eq i{display:block;width:3px;height:40%;background:currentColor;border-radius:2px}
.song-chip.playing .song-eq{display:inline-flex}
.song-chip .song-pl{font-size:11px;opacity:.8}
.song-chip.playing .song-pl{display:none}
.song-chip.playing .song-eq i{animation:eq .9s ease-in-out infinite}
.song-chip.playing .song-eq i:nth-child(2){animation-delay:.2s}.song-chip.playing .song-eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:30%}50%{height:100%}}
.song-chip:not(.playing) img{animation-play-state:paused}
.song-chip .song-sp.am{background:linear-gradient(135deg,#FA5C6E,#D21E3C)}
.song-body{padding:12px 12px 20px}
.song-frame{width:100%;aspect-ratio:16/9;border:0;border-radius:14px;background:#000;display:block}
.song-frame.sp{aspect-ratio:auto;height:152px;background:transparent}
.join{text-align:center;padding:10px 20px 22px}
.join .join-ico{display:flex;justify-content:center;color:var(--text)}
.join b{display:block;font-size:18px;margin:8px 0 6px}
.join p{color:var(--muted);margin:0 0 16px;line-height:1.45}
.composer .attach{width:46px;height:46px;border-radius:23px;border:1px solid var(--line);background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.composer .attach svg{width:24px;height:24px}
.msg.hasmedia{padding:4px;overflow:hidden;max-width:72%}
.msg.hasmedia img,.msg.hasmedia video{display:block;width:100%;height:auto;max-height:340px;object-fit:cover;border-radius:16px;background:#000}
.msg.hasmedia img{cursor:zoom-in}
.msg.hasmedia p{margin:6px 10px 4px}
.msg-media-ph{width:200px;height:150px;border-radius:16px;background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.msg-up{display:block;font-size:12px;margin:4px 10px 2px;opacity:.8}
.mv{position:fixed;inset:0;z-index:40;background:rgba(10,4,4,.94);display:flex;align-items:center;justify-content:center;padding:20px}
.mv img,.mv video{max-width:100%;max-height:100%;border-radius:10px}
.mv-x{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;color:#fff}
@media (prefers-reduced-motion:reduce){*:not(.horse){animation:none!important;transition:none!important}}

:root{--text:#3B2314;--soft:#5A3A24;--muted:#8A6A4E;--ink:#2B160A;--accent:#C9362A;--line:#D6BC93}

.topbar .logo{background:linear-gradient(180deg,#FFE3A3,#F2B24C);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.topbar b,.topbar .iconbtn.plain{color:#F7E6C4}
.topbar .iconbtn{background:rgba(247,230,196,.15);border-color:rgba(247,230,196,.4);color:#F7E6C4}
.logo{background:linear-gradient(180deg,#B5652E,#6A3415);-webkit-background-clip:text;background-clip:text;color:transparent;filter:none}
.post,.welcome-card,.sheet,.auth form{background:#FFFDF8;border:1px solid #E2CFAF;box-shadow:0 4px 14px rgba(90,45,15,.12)}
.post-head{background:linear-gradient(180deg,#F3E3C6,#EAD3AC);margin:0;border-bottom:1.5px dashed rgba(139,74,34,.35)}
.btn{background:linear-gradient(180deg,#A0582A,#7A3E1C);color:#FFF4DE;box-shadow:0 3px 0 #4E2410;outline:1.5px dashed rgba(255,244,222,.45);outline-offset:-6px}
.btn.ghost{background:#FFFDF8;color:var(--text);border:1.5px solid #A0582A;outline:none;box-shadow:none}
.chip{background:#FFFDF8;border-color:#E2CFAF}
.chip.on{background:linear-gradient(180deg,#A0582A,#7A3E1C);color:#FFF4DE;box-shadow:none}
.tag{background:linear-gradient(120deg,#F6C445 0%,#EE8A2A 45%,#C9362A 100%);color:#2B160A}

.nav button{color:rgba(247,230,196,.7)}
.nav button.on{color:#FFE3A3}
.nav .plus{background:linear-gradient(120deg,#F6C445 0%,#EE8A2A 45%,#C9362A 100%);color:#2B160A}
.auth::before{background:radial-gradient(60% 40% at 50% 0%,rgba(238,138,42,.45),transparent 70%);animation:none}

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'icon') el.innerHTML = ICONS[v]; // solo íconos propios, nunca texto de usuarios
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k in el && typeof v !== 'string') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

  if (!file.type.startsWith('image/') || file.type === 'image/gif') return file;

    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);

    return blob || file;
  } catch (_) { return file; }
}

function parseSong(raw) {

  if (id && /^[A-Za-z0-9_-]{6,20}$/.test(id)) return { type: 'yt', id, url: 'https://www.youtube.com/watch?v=' + id };
  if (host === 'music.apple.com') return { type: 'am', id: u.searchParams.get('i') || u.pathname, url: u.href };
  if (host === 'open.spotify.com') { const m = u.pathname.match(/\/track\/([A-Za-z0-9]{10,30})/); if (m) return { type: 'sp', id: m[1], url: 'https://open.spotify.com/track/' + m[1] }; }

function likeControls(p, short) {
  const myId = state.me.id;
  let liked = (p.likes || []).some(l => l.user_id === myId);
  let likeCount = (p.likes || []).length;
  const countEl = h('span', { class: short ? '' : 'count' });
  const likeBtn = h('button', { class: 'iconbtn' + (short ? '' : ' plain'), 'aria-label': 'Dar ajúa', icon: 'horse' });
  const paint = () => {
    likeBtn.classList.toggle('liked', liked);
    likeBtn.setAttribute('aria-pressed', String(liked));
    countEl.textContent = short ? likeCount.toLocaleString('es-MX') : `${likeCount.toLocaleString('es-MX')} ${likeCount === 1 ? 'ajúa' : 'ajúas'}`;
  };
  let busy = false;
  const rear = () => { likeBtn.classList.remove('rear'); void likeBtn.offsetWidth; likeBtn.classList.add('rear'); try { navigator.vibrate && navigator.vibrate(25); } catch (_) {} };
  likeBtn.addEventListener('animationend', (e) => { if (e.animationName === 'rear') likeBtn.classList.remove('rear'); });
  const setLike = async (want) => {
    if (needLogin('Crea tu cuenta para dar ajúa')) return;
    if (busy) return;
    if (want === liked) { if (want) rear(); return; }
    busy = true; liked = want; likeCount += want ? 1 : -1; paint();
    likeBtn.classList.remove('rear'); if (want) rear();
    const res = want ? await sb.from('likes').insert({ post_id: p.id, user_id: myId })
                     : await sb.from('likes').delete().eq('post_id', p.id).eq('user_id', myId);
    if (res.error) { liked = !want; likeCount += want ? -1 : 1; paint(); toast('No se pudo guardar, intenta de nuevo'); }
    busy = false;
  };
  likeBtn.addEventListener('click', () => setLike(!liked));
  paint();
  return { likeBtn, countEl, setLike };
}
function burstEl() { return h('div', { class: 'burst', 'aria-hidden': 'true' }, h('span', { class: 'burst-horse', icon: 'horse' }), h('b', {}, '¡AJÚA!')); }
function fireBurst(b) { b.classList.remove('go'); void b.offsetWidth; b.classList.add('go'); }
async function sharePost(p) {
  const data = { title: 'Herria', text: (p.caption || 'Mira esto en Herria') + '\n', url: location.href };
  try { if (navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(location.href); toast('Enlace copiado'); } } catch (_) {}
}
async function deletePost(p) {
  if (!confirm('¿Borrar esta publicación?')) return false;
  const { error } = await sb.from('posts').delete().eq('id', p.id);
  if (error) { toast('No se pudo borrar'); return false; }
  const path = p.media_url.split('/media/')[1];
  if (path) sb.storage.from('media').remove([decodeURIComponent(path)]);
  toast('Borrado');
  return true;
}

function postCard(p) {
  const prof = p.profiles || {};
  const myId = state.me.id;
  const commentCount = (p.comments && p.comments[0] && p.comments[0].count) || 0;
  const { likeBtn, countEl, setLike } = likeControls(p, false);
  const burst = burstEl();
  const mediaEl = p.media_type === 'video'
    ? h('video', { src: p.media_url, controls: true, playsInline: true, preload: 'metadata' })

  if (p.media_type !== 'video') {

  const links = (Array.isArray(p.shop_links) ? p.shop_links : []).filter(l => l && safeUrl(l.url));

        h('b', {}, l.name || 'Ver producto'), h('span', {}, 'Ver en tienda'))))),

  );
  return card;

function setFlag(name) { try { localStorage.setItem(flagKey(name), '1'); } catch (_) {} }

async function renderWelcome() {
  const step = state.welcomeStep || 0;
  const steps = HAS_ANIMALS ? 3 : 2;
  const next = () => { state.welcomeStep = step + 1; if (state.welcomeStep >= steps) { state.welcomeStep = steps - 1; } render(); };
  const dots = h('div', { class: 'wl-dots', 'aria-label': `Paso ${step + 1} de ${steps}` }, ...Array.from({ length: steps }, (_, i) => h('span', { class: i <= step ? 'on' : '' })));
  const skip = h('button', { class: 'linkbtn', style: 'font-size:14px;padding:10px', onclick: finishWelcome }, 'Saltar');
  const page = h('div', { class: 'welcome' }, h('div', { class: 'wl-top' }, dots, skip));
  $app.append(page);
  const err = h('p', { class: 'err', role: 'alert' });

  // Paso 1: foto y rancho
  if (step === 0) {
    let photo = null;
    const prev = h('div', { class: 'wl-avatar' }, avatar(state.me, 120));
    const fileIn = h('input', { type: 'file', accept: 'image/*', class: 'sr', id: 'wl_av' });
    fileIn.addEventListener('change', () => {
      photo = fileIn.files[0]; if (!photo) return;
      prev.replaceChildren(h('div', { class: 'avatar', style: 'width:120px;height:120px' }, h('img', { src: URL.createObjectURL(photo), alt: 'Tu foto' })));
    });
    const rancho = h('input', { class: 'input', id: 'wl_r', maxlength: '60', placeholder: 'ej. Rancho El Mezquite, León' });
    const save = h('button', { class: 'btn', type: 'submit' }, 'Siguiente');
    page.append(h('form', { class: 'wl-body', onsubmit: async (e) => {
      e.preventDefault(); err.textContent = ''; save.disabled = true;
      try {
        const patch = {};
        if (rancho.value.trim()) patch.rancho = rancho.value.trim();
        if (photo) {
          const blob = await compressImage(photo, 480);
          const path = `${state.me.id}/avatar-${Date.now()}.jpg`;
          const up = await sb.storage.from('media').upload(path, blob, { contentType: 'image/jpeg' });
          if (up.error) throw up.error;
          patch.avatar_url = sb.storage.from('media').getPublicUrl(path).data.publicUrl;
        }
        if (Object.keys(patch).length) {
          const { error } = await sb.from('profiles').update(patch).eq('id', state.me.id);
          if (error) throw error;
          await loadMe();
        }
        next();
      } catch (ex) { err.textContent = friendlyError(ex); save.disabled = false; }
    } },
      h('h1', { class: 'wl-title' }, `¡Bienvenido, ${(state.me.full_name || state.me.username || '').split(' ')[0]}!`),
      h('p', { class: 'wl-sub' }, 'Ponle cara a tu perfil para que la raza te reconozca.'),
      prev, fileIn,
      h('label', { for: 'wl_av', class: 'btn ghost small', style: 'display:inline-flex;align-items:center;cursor:pointer;margin:0 auto 22px' }, 'Elegir foto'),
      h('div', { class: 'field', style: 'text-align:left' }, h('label', { for: 'wl_r' }, '¿De qué rancho o pueblo eres?'), rancho),
      err, save));
    return;
  }

  // Paso 2: su animal (si la base de datos ya tiene animales)
  if (step === 1 && HAS_ANIMALS) {
    let photo = null, species = 'Caballo';
    const prev = h('div', { class: 'wl-avatar' }, animalPic(null, 120));
    const fileIn = h('input', { type: 'file', accept: 'image/*', class: 'sr', id: 'wl_an' });
    fileIn.addEventListener('change', () => {
      photo = fileIn.files[0]; if (!photo) return;
      prev.replaceChildren(h('div', { class: 'avatar animal-pic', style: 'width:120px;height:120px' }, h('img', { src: URL.createObjectURL(photo), alt: '' })));
    });
    const name = h('input', { class: 'input', id: 'wl_n', maxlength: '40', placeholder: 'ej. Lucero' });
    const chips = h('div', { class: 'chips', style: 'padding:0 0 14px;flex-wrap:wrap;justify-content:center' });
    const paint = () => chips.replaceChildren(...SPECIES.map(sp => h('button', { type: 'button', class: 'chip' + (sp === species ? ' on' : ''), onclick: () => { species = sp; paint(); } }, sp)));
    paint();
    const save = h('button', { class: 'btn', type: 'submit' }, 'Crear su perfil');
    page.append(h('form', { class: 'wl-body', onsubmit: async (e) => {
      e.preventDefault(); err.textContent = '';
      if (!name.value.trim()) return (err.textContent = 'Ponle su nombre, o toca "Ahorita no".');
      save.disabled = true;
      try {
        const row = { owner_id: state.me.id, name: name.value.trim(), species };
        if (photo) {
          const blob = await compressImage(photo, 900);
          const path = `${state.me.id}/animal-${Date.now()}.jpg`;
          const up = await sb.storage.from('media').upload(path, blob, { contentType: 'image/jpeg' });
          if (up.error) throw up.error;
          row.photo_url = sb.storage.from('media').getPublicUrl(path).data.publicUrl;
        }
        const { error } = await sb.from('animals').insert(row);
        if (error) throw error;
        toast(`¡${row.name} ya tiene su perfil!`);
        next();
      } catch (ex) { err.textContent = friendlyError(ex); save.disabled = false; }
    } },
      h('h1', { class: 'wl-title' }, 'Preséntanos a tu animal'),
      h('p', { class: 'wl-sub' }, 'Tu caballo, tu vaca o tu perro también tienen perfil en Herria. La gente los puede seguir.'),
      prev, fileIn,
      h('label', { for: 'wl_an', class: 'btn ghost small', style: 'display:inline-flex;align-items:center;cursor:pointer;margin:0 auto 22px' }, 'Elegir foto'),
      h('div', { class: 'field', style: 'text-align:left' }, h('label', { for: 'wl_n' }, '¿Cómo se llama?'), name),
      chips, err, save,
      h('button', { type: 'button', class: 'linkbtn', style: 'margin-top:14px;font-size:14px;padding:8px', onclick: next }, 'Ahorita no')));
    return;
  }

  // Último paso: primera publicación
  page.append(h('div', { class: 'wl-body' },
    h('div', { class: 'wl-hat', icon: 'hat' }),
    h('h1', { class: 'wl-title' }, '¡Ya eres parte de la raza!'),
    h('p', { class: 'wl-sub' }, 'Sube tu primera foto y preséntate. Te dejamos el texto listo, solo cámbialo si quieres.'),
    h('button', { class: 'btn', onclick: () => { setFlag('welcomed'); state.uploadKind = 'post'; state.presetCaption = presentText(); go('upload'); } }, 'Subir mi primera foto'),
    h('button', { class: 'linkbtn', style: 'margin-top:16px;font-size:14px;padding:8px', onclick: finishWelcome }, 'Primero quiero ver qué hay')));

// ---------- Reportar, bloquear, borrar ----------
const REPORT_REASONS = ['Contenido sexual o desnudos', 'Violencia o maltrato animal', 'Acoso o insultos', 'Spam, estafa o venta ilegal', 'Algo más'];
function postMenu(p, onGone) {
  if (needLogin('Crea tu cuenta para reportar o bloquear')) return;
  const mine = p.user_id === state.me.id;
  const who = (p.profiles && p.profiles.username) || 'esta persona';
  const body = h('div', { class: 'sheet-body menu' });
  let close;
  const item = (icon, label, fn, danger) => h('button', { class: 'menu-item' + (danger ? ' danger' : ''), onclick: fn }, h('span', { icon }), label);
  if (mine) {
    body.append(item('trash', 'Borrar publicación', async () => { close(); if (await deletePost(p)) onGone && onGone(); }, true));
  } else {
    body.append(
      item('flag', 'Reportar publicación', () => { close(); reportPost(p, onGone); }, true),
      item('block', `Bloquear a @${who}`, async () => { close(); if (await blockUser(p.user_id, who)) onGone && onGone(); }, true));
  }
  body.append(item('close', 'Cancelar', () => close()));
  close = openSheet('Opciones', body);
}
function reportPost(p, onGone) {
  const body = h('div', { class: 'sheet-body menu' }, h('p', { class: 'hint', style: 'margin:0 0 10px' }, '¿Por qué la reportas? Nadie más sabrá que fuiste tú.'));
  let close;

// ---------- Sundowns (desaparecen en 24 horas) ----------
function openSundowns(groups, gi, onClose) {
  if (!groups.length) return;
  const IMG_MS = 5000;
  let ii = 0, video = null, raf = 0, elapsed = 0, lastT = 0, paused = false, userPaused = false, safety = null, fill = null, isImg = false;
  let holdTimer = null, held = false, suppressClick = false;
  const bars = h('div', { class: 'sd-bars' });
  const head = h('div', { class: 'sd-head' });
  const stage = h('div', { style: 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center' });
  const cap = h('div', { class: 'sd-cap' });
  const pausedBadge = h('div', { class: 'sd-paused', 'aria-hidden': 'true' }, h('span', { icon: 'pause' }), 'En pausa');
  const zone = (cls, label, fn) => {
    const z = h('button', { class: 'sd-zone ' + cls, 'aria-label': label });
    z.addEventListener('pointerdown', () => { clearTimeout(holdTimer); held = false; holdTimer = setTimeout(() => { held = true; setPaused(true, 'hold'); }, 220); });
    const release = () => { clearTimeout(holdTimer); if (held) { suppressClick = true; held = false; if (!userPaused) setPaused(false, 'hold'); } };
    z.addEventListener('pointerup', release); z.addEventListener('pointercancel', release); z.addEventListener('pointerleave', release);
    z.addEventListener('contextmenu', (e) => e.preventDefault());
    z.addEventListener('click', () => { if (suppressClick) { suppressClick = false; return; } fn(); });
    return z;
  };
  const inner = h('div', { class: 'sd-in' }, stage,
    h('div', { class: 'sd-top' }, bars, head),
    zone('prev', 'Anterior', () => prev()),
    zone('next', 'Siguiente', () => next()),
    pausedBadge, cap);
  const viewer = h('div', { class: 'sd-viewer', role: 'dialog', 'aria-label': 'Sundowns' }, inner);
  let pauseBtn = null;
  function paintPause() {
    if (pauseBtn) { pauseBtn.innerHTML = ICONS[paused ? 'resume' : 'pause']; pauseBtn.setAttribute('aria-label', paused ? 'Continuar' : 'Pausar'); }
    viewer.classList.toggle('is-paused', paused);
    viewer.classList.toggle('is-held', paused && !userPaused);
    pausedBadge.style.display = userPaused ? 'flex' : 'none';
  }
  function setPaused(p, why) {
    if (why === 'button') userPaused = p;
    paused = p || userPaused;
    if (video) { if (paused) video.pause(); else video.play().catch(() => {}); }
    if (SONG.audio) { if (paused) SONG.audio.pause(); else SONG.audio.play().catch(() => {}); }
    lastT = performance.now();
    paintPause();
  }
  function tick(t) {
    if (!isImg) return;
    if (!paused) { elapsed += t - lastT; }
    lastT = t;
    if (fill) fill.style.width = Math.min(100, elapsed / IMG_MS * 100) + '%';
    if (elapsed >= IMG_MS) return next();
    raf = requestAnimationFrame(tick);
  }
  const stop = () => { cancelAnimationFrame(raf); clearTimeout(safety); if (video) { video.pause(); video = null; } };
  const close = () => { stop(); stopSong(); viewer.remove(); document.removeEventListener('keydown', onKey); if (onClose) onClose(); };
  const onKey = (e) => { if (e.key === 'Escape') close(); if (e.key === 'ArrowRight') next(); if (e.key === 'ArrowLeft') prev(); if (e.key === ' ') { e.preventDefault(); setPaused(!userPaused, 'button'); } };
  document.addEventListener('keydown', onKey);
  function show() {
    stop();
    elapsed = 0; userPaused = false; paused = false;
    const g = groups[gi]; const it = g.items[ii];
    markSeen(it.id);
    bars.replaceChildren(...g.items.map((_, k) => h('div', { class: 'sd-bar' }, h('i', { style: `width:${k < ii ? 100 : 0}%` }))));
    fill = bars.children[ii].firstChild;
    pauseBtn = h('button', { class: 'iconbtn plain', style: 'color:#fff', 'aria-label': 'Pausar', icon: 'pause', onclick: () => setPaused(!userPaused, 'button') });
    head.replaceChildren(...[avatar(g.user, 36),
      h('div', {}, h('b', {}, g.user.username || ''), h('br'), h('small', {}, timeAgo(it.created_at))),
      h('div', { class: 'sp' }),
      pauseBtn,
      it.user_id === state.me.id && h('button', { class: 'iconbtn plain', style: 'color:#fff', 'aria-label': 'Agregar otro sundown', icon: 'plus', onclick: () => { close(); state.uploadKind = 'sundown'; go('upload'); } }),
      it.user_id === state.me.id && h('button', { class: 'iconbtn plain', style: 'color:#fff', 'aria-label': 'Borrar sundown', icon: 'trash', onclick: async () => {
        setPaused(true, 'button');
        if (await deletePost(it)) { g.items.splice(ii, 1); if (!g.items.length) { groups.splice(gi, 1); if (!groups.length) return close(); gi = Math.min(gi, groups.length - 1); ii = 0; } else ii = Math.min(ii, g.items.length - 1); show(); }
      } }),
      it.user_id !== state.me.id && h('button', { class: 'iconbtn plain', style: 'color:#fff', 'aria-label': 'Más opciones', icon: 'more', onclick: () => { setPaused(true, 'button'); postMenu(it, () => close()); } }),
      h('button', { class: 'iconbtn plain', style: 'color:#fff', 'aria-label': 'Cerrar', icon: 'close', onclick: close })].filter(Boolean));
    cap.replaceChildren(...[it.caption ? h('div', {}, it.caption) : null,
      it.song_url ? h('div', { style: 'margin-top:' + (it.caption ? '10px' : '0') }, songChip(it.song_url, it.song_title, { dark: true, preview: it.song_preview, art: it.song_art, before: () => { if (!it.song_preview) setPaused(true, 'button'); } })) : null].filter(Boolean));
    cap.style.display = (it.caption || it.song_url) ? 'block' : 'none';
    if (it.song_preview) { playSong(it.song_preview, cap.querySelector('.song-chip')); if (paused && SONG.audio) SONG.audio.pause(); } else stopSong();
    paintPause();
    if (it.media_type === 'video') {
      isImg = false;
      video = h('video', { src: it.media_url, playsInline: true, autoplay: true });
      video.addEventListener('timeupdate', () => { if (video && video.duration && fill) fill.style.width = (video.currentTime / video.duration * 100) + '%'; });
      video.addEventListener('ended', () => next());
      video.addEventListener('error', () => { safety = setTimeout(next, 3000); });
      video.play().catch(() => { if (video) { video.muted = true; video.play().catch(() => {}); } });
      stage.replaceChildren(video);
    } else {
      isImg = true;
      stage.replaceChildren(h('img', { src: it.media_url, alt: it.caption || 'Sundown de ' + (g.user.username || '') }));
      lastT = performance.now();
      raf = requestAnimationFrame(tick);
    }
  }
  function next() { const g = groups[gi]; if (ii < g.items.length - 1) ii++; else if (gi < groups.length - 1) { gi++; ii = 0; } else return close(); show(); }
  function prev() { if (ii > 0) ii--; else if (gi > 0) { gi--; ii = groups[gi].items.length - 1; } show(); }
  document.body.append(viewer);
  show();
}

  let rides = [];
  try { rides = await fetchPosts({ kinds: ['ride'] }); } catch (e) { return wrap.replaceChildren(h('div', { class: 'empty', style: 'margin-top:35vh' }, friendlyError(e))); }
  if (!HAS_KIND) return wrap.replaceChildren(h('div', { class: 'empty', style: 'margin-top:30vh' }, 'Los Rides todavía no están activados en la base de datos. Corre el SQL de actualización en Supabase.'));
  if (!rides.length) return wrap.replaceChildren(h('div', { class: 'empty', style: 'margin-top:30vh' },

  const cards = rides.map(rideCard);
  wrap.replaceChildren(...cards.map(c => c.el));
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      const c = cards.find(x => x.el === en.target); if (!c) return;
      if (en.isIntersecting && en.intersectionRatio > 0.6) c.play(); else c.pause();
    });
  }, { root: wrap, threshold: [0, 0.6, 1] });
  cards.forEach(c => io.observe(c.el));
}

  });

    e.preventDefault(); save.disabled = true; err.textContent = '';

      if (newAvatar) {

async function refreshUnread(badge) {

async function openChatWith(prof) {

  go('chat');
}
function shortTime(iso) {
  const d = new Date(iso), now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('es-MX', { hour: 'numeric', minute: '2-digit' });
  return timeAgo(iso).replace('hace ', '');
}

      const b = state.blocked || new Set();
      found.replaceChildren(...(data || []).filter(p => !b.has(p.id)).map(p => h('button', { class: 'inbox-row', onclick: () => openChatWith(p) },
        avatar(p, 48), h('div', { class: 'who' }, h('b', {}, p.username), h('span', {}, [p.full_name, p.rancho].filter(Boolean).join(' · ') || 'Escribirle')))));
      if (data && !data.length) found.append(h('p', { style: 'color:var(--muted);padding:0 16px' }, 'No encontramos a nadie con ese nombre.'));
    }, 300);
  });

  const { data: convs, error } = await sb.from('conversations')
    .select(`id,user_a,user_b,last_message_at,a:profiles!user_a(${PROF_MINI}),b:profiles!user_b(${PROF_MINI})`)
    .order('last_message_at', { ascending: false }).limit(60);
  if (error) {
    HAS_DM = !/conversations|relation|schema/i.test(error.message || '') ? HAS_DM : false;
    return list.replaceChildren(h('div', { class: 'empty' }, HAS_DM ? friendlyError(error) : 'Los mensajes todavía no están activados.'));
  }
  const ids = (convs || []).map(c => c.id);
  let msgs = [];
  if (ids.length) {
    const r = await sb.from('messages').select('id,conversation_id,sender_id,body,media_type,created_at,read_at').in('conversation_id', ids).order('created_at', { ascending: false }).limit(400);
    msgs = r.data || [];
  }
  const last = new Map(), unread = new Map();
  for (const m of msgs) {
    if (!last.has(m.conversation_id)) last.set(m.conversation_id, m);
    if (!m.read_at && m.sender_id !== state.me.id) unread.set(m.conversation_id, (unread.get(m.conversation_id) || 0) + 1);
  }
  const blocked = state.blocked || new Set();
  const rows = (convs || []).filter(c => last.has(c.id)).map(c => {
    const other = c.user_a === state.me.id ? c.b : c.a;
    return { c, other, m: last.get(c.id), n: unread.get(c.id) || 0 };
  }).filter(r => r.other && !blocked.has(r.other.id));
  if (!rows.length) return list.replaceChildren(h('div', { class: 'dm-empty' }, h('div', { icon: 'shotsbig' }),
    h('b', {}, '¡Salud! Aquí van tus mensajes'), 'Busca a alguien arriba o entra a su perfil y toca "Mensaje".'));
  list.replaceChildren(...rows.map(({ c, other, m, n }) => h('button', { class: 'inbox-row' + (n ? ' unread' : ''), onclick: () => { state.chat = { id: c.id, other }; go('chat'); } },
    avatar(other, 52),
    h('div', { class: 'who' }, h('b', {}, other.username), h('span', {}, (m.sender_id === state.me.id ? 'Tú: ' : '') + (m.body || (m.media_type === 'video' ? '🎥 Video' : '📷 Foto')))),
    h('small', {}, shortTime(m.created_at)), n ? h('span', { class: 'inbox-dot', 'aria-label': n + ' sin leer' }) : null)));
}
const DM_SIGNED = new Map(); // ruta -> { url, exp }
async function signDm(paths) {
  const now = Date.now();
  const need = [...new Set(paths)].filter(p => { const c = DM_SIGNED.get(p); return !c || c.exp < now + 60e3; });
  if (!need.length) return;
  try {
    const { data } = await sb.storage.from('dm').createSignedUrls(need, 3600);
    (data || []).forEach(d => { if (d && d.signedUrl) DM_SIGNED.set(d.path || need[data.indexOf(d)], { url: d.signedUrl, exp: now + 3500e3 }); });
  } catch (_) {}
}
function openMediaViewer(src, type) {
  const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  const media = type === 'video' ? h('video', { src, controls: true, autoplay: true, playsinline: true }) : h('img', { src, alt: 'Foto del mensaje' });
  const bg = h('div', { class: 'mv', role: 'dialog', 'aria-label': type === 'video' ? 'Video' : 'Foto', onclick: (e) => { if (e.target === bg) close(); } },
    h('button', { class: 'iconbtn plain mv-x', 'aria-label': 'Cerrar', icon: 'close', onclick: close }), media);
  document.addEventListener('keydown', onKey);
  document.body.append(bg);
}
async function renderChat() {
  const chat = state.chat;
  if (!chat) return go('inbox');
  const other = chat.other || {};
  $app.append(h('header', { class: 'topbar chat-head' },
    h('button', { class: 'iconbtn plain', 'aria-label': 'Regresar', icon: 'back', onclick: () => go('inbox') }),
    h('button', { class: 'who', onclick: () => go('profile', { profileId: other.id }) }, avatar(other, 36), h('span', {}, other.username || ''))));
  const box = h('main', { class: 'chat' }, h('div', { class: 'spinner' }));
  const input = h('textarea', { class: 'input', rows: 1, maxlength: '2000', placeholder: 'Escribe un mensaje…', 'aria-label': 'Mensaje' });
  const send = h('button', { class: 'send', type: 'submit', 'aria-label': 'Enviar', icon: 'send', disabled: true });
  const picker = h('input', { type: 'file', accept: 'image/*,video/*', hidden: true });
  const attach = h('button', { class: 'attach', type: 'button', 'aria-label': 'Mandar foto o video', icon: 'camera', onclick: () => picker.click() });
  const form = h('form', { onsubmit: (e) => { e.preventDefault(); submit(); } }, attach, picker, input, send);
  $app.append(box, h('div', { class: 'composer' }, form));
  const blockedNow = state.blocked && state.blocked.has(other.id);
  if (blockedNow) { input.disabled = true; attach.disabled = true; input.placeholder = 'Bloqueaste a esta persona'; }

  const grow = () => { input.style.height = 'auto'; input.style.height = Math.min(130, input.scrollHeight) + 'px'; send.disabled = !input.value.trim() || blockedNow; };
  input.addEventListener('input', grow);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); submit(); } });
  picker.addEventListener('change', () => { const f = picker.files && picker.files[0]; picker.value = ''; if (f) sendMedia(f); });

  let msgs = [], alive = true, lastCount = -1;
  const seen = new Set();
  const nodes = new Map(); // id -> elemento (para que los videos no se reinicien)
  function bubble(m) {
    const key = m.id + (m.pending ? 'p' : '');
    if (nodes.has(key)) return nodes.get(key);
    const mine = m.sender_id === state.me.id;
    let el;
    if (m.media_path || m.localUrl) {
      const src = m.localUrl || (DM_SIGNED.get(m.media_path) || {}).url;
      const media = !src ? h('div', { class: 'msg-media-ph' }, 'Cargando…')
        : m.media_type === 'video' ? h('video', { src, controls: true, playsinline: true, preload: 'metadata' })
        : h('img', { src, alt: 'Foto', loading: 'lazy', onclick: () => openMediaViewer(src, 'image') });
      el = h('div', { class: 'msg hasmedia ' + (mine ? 'me' : 'them') + (m.pending ? ' pending' : '') }, media, m.body ? h('p', {}, m.body) : null,
        m.pending ? h('span', { class: 'msg-up' }, 'Enviando…') : null);
      if (!src) return el; // sin enlace todavía: no guardar, se vuelve a intentar
    } else {
      el = h('div', { class: 'msg ' + (mine ? 'me' : 'them') + (m.pending ? ' pending' : '') }, m.body);
    }
    nodes.set(key, el);
    return el;
  }
  function paint() {
    const kids = []; let prev = null;
    for (const m of msgs) {
      if (!prev || new Date(m.created_at) - new Date(prev.created_at) > 15 * 60e3) kids.push(h('div', { class: 'msg-time' }, shortTime(m.created_at)));
      kids.push(bubble(m));
      prev = m;
    }
    const lastMine = [...msgs].reverse().find(m => m.sender_id === state.me.id && !m.pending);
    if (lastMine && msgs[msgs.length - 1] === lastMine && lastMine.read_at) kids.push(h('div', { class: 'msg-seen' }, 'Visto'));
    if (!msgs.length) kids.push(h('div', { class: 'dm-empty' }, h('div', { icon: 'shotsbig' }), h('b', {}, '¡Salud!'), `Mándale el primer mensaje a @${other.username || ''}.`));
    box.replaceChildren(...kids);
    if (msgs.length !== lastCount) { lastCount = msgs.length; window.scrollTo(0, document.body.scrollHeight); }
  }
  const COLS = 'id,sender_id,body,media_path,media_type,created_at,read_at';
  async function load() {
    const { data, error } = await sb.from('messages').select(COLS).eq('conversation_id', chat.id).order('created_at', { ascending: true }).limit(300);
    if (!alive) return;
    if (error) return box.replaceChildren(h('div', { class: 'empty' }, friendlyError(error)));
    await signDm((data || []).filter(m => m.media_path).map(m => m.media_path));
    if (!alive) return;
    const pend = msgs.filter(m => m.pending);
    msgs = (data || []).concat(pend);
    msgs.forEach(m => seen.add(m.id));
    paint();
    if (msgs.some(m => m.sender_id !== state.me.id && !m.read_at)) sb.rpc('mark_read', { conv: chat.id }).then(() => {}, () => {});
  }
  function failMsg(error) {
    const m = (error && error.message) || '';
    if (/row-level|policy/i.test(m)) return 'No puedes mandarle mensajes a esta persona';
    if (/bucket|not found/i.test(m)) return 'Falta activar las fotos de mensajes en Supabase';
    if (/size|large|exceed/i.test(m)) return 'El archivo es muy pesado (máx. 50 MB)';
    return 'No se pudo enviar';
  }
  async function submit() {
    const text = input.value.trim();
    if (!text || blockedNow) return;
    input.value = ''; grow();
    const tmp = { id: 'tmp' + Date.now(), sender_id: state.me.id, body: text, created_at: new Date().toISOString(), pending: true };
    msgs.push(tmp); paint();
    const { data, error } = await sb.from('messages').insert({ conversation_id: chat.id, sender_id: state.me.id, body: text }).select(COLS).single();
    msgs = msgs.filter(m => m !== tmp);
    if (error) { input.value = text; grow(); paint(); return toast(failMsg(error)); }
    if (data && !seen.has(data.id)) { seen.add(data.id); msgs.push(data); }
    paint();
  }
  async function sendMedia(file) {
    if (blockedNow) return;
    const isVideo = (file.type || '').startsWith('video/');
    if (!isVideo && !(file.type || '').startsWith('image/')) return toast('Solo se pueden mandar fotos o videos');
    if (file.size > 50 * 1024 * 1024) return toast('El video es muy pesado (máx. 50 MB)');
    const blob = isVideo ? file : await compressImage(file, 1600);
    const localUrl = URL.createObjectURL(blob);
    const tmp = { id: 'tmp' + Date.now(), sender_id: state.me.id, media_type: isVideo ? 'video' : 'image', localUrl, created_at: new Date().toISOString(), pending: true };
    msgs.push(tmp); paint();
    const ext = isVideo ? ((file.name.split('.').pop() || 'mp4').toLowerCase().replace(/[^a-z0-9]/g, '') || 'mp4') : 'jpg';
    const path = `${chat.id}/${state.me.id}-${Date.now()}.${ext}`;
    const up = await sb.storage.from('dm').upload(path, blob, { contentType: isVideo ? (file.type || 'video/mp4') : 'image/jpeg', upsert: false });
    let data = null, error = up.error;
    if (!error) {
      const r = await sb.from('messages').insert({ conversation_id: chat.id, sender_id: state.me.id, media_path: path, media_type: tmp.media_type }).select(COLS).single();
      data = r.data; error = r.error;
    }
    msgs = msgs.filter(m => m !== tmp);
    if (error) { paint(); URL.revokeObjectURL(localUrl); return toast(failMsg(error)); }
    if (data) { DM_SIGNED.set(path, { url: localUrl, exp: Date.now() + 3500e3 }); if (!seen.has(data.id)) { seen.add(data.id); msgs.push(data); } }
    paint();
  }
  let channel = null;
  try {
    if (sb.channel) channel = sb.channel('dm-' + chat.id).on('postgres_changes', { event: '*', schema: 'public', table: 'messages', filter: 'conversation_id=eq.' + chat.id }, () => load()).subscribe();
  } catch (_) { channel = null; }
  const poll = setInterval(() => { if (!document.hidden) load(); }, channel ? 15000 : 4000);
  state.cleanup = () => { alive = false; clearInterval(poll); if (channel) try { sb.removeChannel(channel); } catch (_) {} };
  await load();
  input.focus({ preventScroll: true });
}

// ---------- arranque ----------
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
let started = false;
// Botón "atrás" del teléfono: cierra lo que esté abierto, regresa al inicio, y en el inicio actualiza.
function armBack() { try { history.pushState({ yh: 1 }, ''); } catch (_) {} }
setInterval(() => { const b = document.querySelector('.dm-badge'); if (b && !document.hidden) refreshUnread(b); }, 30000);
armBack();
window.addEventListener('popstate', () => {
  armBack();
  const viewerClose = document.querySelector('.sd-viewer [aria-label="Cerrar"]');
  if (viewerClose) return viewerClose.click();
  const sheets = document.querySelectorAll('.sheet-bg');
  if (sheets.length) { const c = sheets[sheets.length - 1].querySelector('.sheet-head [aria-label="Cerrar"]'); return c ? c.click() : sheets[sheets.length - 1].remove(); }
  if (state.view === 'auth') return go('feed');
  if (!state.me || state.view === 'welcome') return;
  if (state.view === 'chat') return go('inbox');
  if (state.view !== 'feed') return go('feed');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
  toast('Actualizado');
});
sb.auth.onAuthStateChange((_event, session) => {
  const changed = !started || (session && session.user.id) !== (state.session && state.session.user.id);
  started = true;
  state.session = session;
  if (!changed) return;
  state.me = session ? null : GUEST; state.blocked = new Set(); state.view = 'feed'; render();
  if (session) setTimeout(async () => { await loadMe(); if (needsWelcome()) { state.view = 'welcome'; state.welcomeStep = 0; } render(); }, 0);
});
</script>
