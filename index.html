// Lista de rides tipo reels: se reproduce el que está en pantalla, se precargan los 2 que siguen
// y, al ir llegando al final, se cargan más solitos.
function ridesScroller(wrap, first, loadMore, o = {}) {
  const cards = [];
  let busy = false, done = !o.keepGoing && first.length < RIDE_PAGE, last = first.length ? first[first.length - 1].created_at : null;
  const seen = new Set();
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      const i = cards.findIndex(x => x.el === en.target); if (i < 0) return;
      if (en.isIntersecting && en.intersectionRatio > 0.6) {
        cards[i].play();

        if (!SAVER.on) cards.slice(i + 1, i + 3).forEach((c, k) => c.warm(k === 0 ? 'auto' : 'metadata'));
        if (i >= cards.length - 3) more();

    });
  }, { root: wrap, threshold: [0, 0.6, 1] });
  const add = (list) => list.forEach(p => {
    if (seen.has(p.id)) return; seen.add(p.id);
    const c = rideCard(p, cards.length < 2 && !SAVER.on ? 'metadata' : 'none');
    cards.push(c); wrap.append(c.el); io.observe(c.el);

    if (busy || done || !loadMore) return; busy = true;
    try { const list = await loadMore(last); add(list); if (list.length) last = list[list.length - 1].created_at; if (list.length < RIDE_PAGE) done = true; }
    catch (_) {} finally { busy = false; }
  }
  wrap.replaceChildren(); add(first);
  if (o.keepGoing) more();

async function newHighlight(preselect) {

// Cambiar foto de perfil o portada directo desde el perfil (como Facebook)
function pickImage(onFile) {
  const inp = h('input', { type: 'file', accept: 'image/*', hidden: true });
  inp.addEventListener('change', () => { const f = inp.files && inp.files[0]; inp.remove(); if (f) onFile(f); });
  document.body.append(inp); inp.click();
}
async function savePhoto(kind, file) {
  const isCover = kind === 'cover';
  toast(isCover ? 'Subiendo portada…' : 'Subiendo foto de perfil…');
  try {
    const blob = await compressImage(file, isCover ? 1600 : 640);
    const path = `${state.me.id}/${isCover ? 'portada' : 'avatar'}-${Date.now()}.jpg`;
    const up = await sb.storage.from('media').upload(path, blob, { contentType: 'image/jpeg', cacheControl: '31536000' });
    if (up.error) throw up.error;
    const url = sb.storage.from('media').getPublicUrl(path).data.publicUrl;
    const { error } = await sb.from('profiles').update(isCover ? { cover_url: url } : { avatar_url: url }).eq('id', state.me.id);
    if (error) throw (/cover_url|column|schema/i.test(error.message || '') ? new Error('Falta activar la foto de portada en Supabase') : error);
    // También sale como publicación para que la gente reaccione y comente
    sb.from('posts').insert({ user_id: state.me.id, media_url: url, media_type: 'image', caption: isCover ? '🌄 Actualizó su foto de portada' : '📷 Actualizó su foto de perfil', category: null, shop_links: [] }).then(() => {}, () => {});
    await loadMe(); toast(isCover ? '¡Portada actualizada!' : '¡Foto de perfil actualizada!'); SFX.play('ajua'); render();
  } catch (ex) { toast(friendlyError(ex)); }
}
async function removeCover() {
  const { error } = await sb.from('profiles').update({ cover_url: null }).eq('id', state.me.id);

    uname ? sb.from('comments').select('id,body,created_at,user_id,post_id,' + NOTIF_PROF + ',' + POSTJ).ilike('body', '%@' + esc(uname) + '%').neq('user_id', me).order('created_at', { ascending: false }).limit(30).then(r => r, () => ({ data: [] })) : Promise.resolve({ data: [] }),

// ---------- Avisos en el teléfono (push) ----------
const PUSH_FN = 'https://olflxehmwfxvsnzoqzrm.supabase.co/functions/v1/push-mensaje';
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const pushState = () => !pushSupported() ? 'no' : Notification.permission; // 'default' | 'granted' | 'denied' | 'no'
function b64ToBytes(b64) { const p = '='.repeat((4 - b64.length % 4) % 4); const raw = atob((b64 + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(raw, c => c.charCodeAt(0)); }
async function enablePush(quiet) {
  if (!pushSupported() || isGuest()) { if (!quiet) toast('Este teléfono no permite avisos'); return false; }
  try {
    if (Notification.permission !== 'granted') {
      if (quiet) return false;
      if (Notification.permission === 'denied') { permHelp('push', () => enablePush()); return false; }
      const r = await Notification.requestPermission();
      if (r !== 'granted') { if (r === 'denied') permHelp('push', () => enablePush()); else toast('No se activaron los avisos'); return false; }
    }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      const { publicKey } = await fetch(PUSH_FN).then(r => r.json());
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(publicKey) });
    }
    const j = sub.toJSON();
    const { error } = await sb.from('push_subscriptions').upsert({ endpoint: j.endpoint, user_id: state.me.id, p256dh: j.keys.p256dh, auth: j.keys.auth }, { onConflict: 'endpoint' });
    if (error) throw error;
    if (!quiet) { toast('¡Listo! Te avisaremos de tus mensajes 🔔'); SFX.play('msg'); }
    return true;
  } catch (e) { if (!quiet) toast('No se pudieron activar los avisos'); return false; }
}
async function disablePush() {
  try { const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription();
    if (sub) { await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); } } catch (_) {}
  toast('Avisos apagados en este teléfono');
}
async function pushOnHere() { try { if (pushState() !== 'granted') return false; const reg = await navigator.serviceWorker.ready; return !!(await reg.pushManager.getSubscription()); } catch (_) { return false; } }
// Tarjetita para invitar a activar los avisos (en Mensajes)

    h('div', { class: 'push-btns' },

  return card;
}

// Sonido de mensaje nuevo (campana de rancho). No suena dos veces seguidas por el mismo aviso.
let LAST_UNREAD = null, LAST_DING = 0, INBOX_CH = null;
function msgDing() { const now = Date.now(); if (now - LAST_DING < 2500) return; LAST_DING = now; SFX.play('msg'); }
// Escucha en vivo los mensajes que te llegan (en cualquier pantalla de la app)
function listenInbox() {
  if (INBOX_CH || !sb.channel || isGuest() || !HAS_DM) return;
  try {
    INBOX_CH = sb.channel('inbox-' + state.me.id).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (pl) => {
      const m = pl.new || {}; if (!state.me || m.sender_id === state.me.id) return;
      msgDing(); LAST_UNREAD = (LAST_UNREAD || 0) + 1;
      const b = document.querySelector('.msg-count'); if (b) refreshUnread(b);
      const inThisChat = state.view === 'chat' && state.chat && state.chat.id === m.conversation_id;
      if (MINI && MINI.conv === m.conversation_id) { MINI.add(m); return; }
      if (!inThisChat && state.view !== 'inbox') addHead(m.sender_id, m.body ? String(m.body).replace(/#[pleu]=[\w-]+/g, '').trim() : msgLabel(m));
    }).subscribe();
  } catch (_) { INBOX_CH = null; }
}

  if (m[1] === 'e') { state.feriaTab = 'eventos'; if (state.view !== 'feria') go('feria'); return openEventById(id); }
  openPostById(id);
}
window.addEventListener('hashchange', openDeepLink);
</script>
