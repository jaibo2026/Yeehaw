async function renderRides() {
  const wrap = h('div', { class: 'rides' }, h('div', { class: 'spinner', style: 'margin-top:45vh' }));
  $app.append(h('div', { class: 'rides-top' }, h('div', { class: 'logo', style: 'font-size:26px' }, 'Rides'),
    h('button', { class: 'iconbtn', style: 'color:#fff;background:rgba(0,0,0,.35)', 'aria-label': 'Subir un ride', icon: 'plus', onclick: () => { state.uploadKind = 'ride'; go('upload'); } })), wrap);
  let rides = [];
  try { rides = await fetchPosts({ kinds: ['ride'] }); } catch (e) { return wrap.replaceChildren(h('div', { class: 'empty', style: 'margin-top:35vh' }, friendlyError(e))); }
  if (!HAS_KIND) return wrap.replaceChildren(h('div', { class: 'empty', style: 'margin-top:30vh' }, 'Los Rides todavía no están activados en la base de datos. Corre el SQL de actualización en Supabase.'));
  if (!rides.length) return wrap.replaceChildren(h('div', { class: 'empty', style: 'margin-top:30vh' },
    h('span', { class: 'logo', style: 'font-size:34px' }, 'Rides'), 'Videos cortos y verticales del rancho. ¡Sube el primero!',
    h('div', { style: 'margin-top:18px' }, h('button', { class: 'btn small', onclick: () => { state.uploadKind = 'ride'; go('upload'); } }, 'Subir mi ride'))));
  const cards = rides.map(rideCard);
  wrap.replaceChildren(...cards.map(c => c.el));
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      const c = cards.find(x => x.el === en.target); if (!c) return;
      if (en.isIntersecting && en.intersectionRatio > 0.6) c.play(); else c.pause();
    });
  }, { root: wrap, threshold: [0, 0.6, 1] });
  cards.forEach(c => io.observe(c.el));
}

function editAnimal(a) {
  const isNew = !a;
  let photo = null;
  let species = (a && a.species) || 'Caballo';
  const prev = h('div', {}, animalPic(a, 84));
  const fileIn = h('input', { type: 'file', accept: 'image/*', class: 'sr', id: 'anp' });
  fileIn.addEventListener('change', () => {
    photo = fileIn.files[0]; if (!photo) return;
    prev.replaceChildren(h('div', { class: 'avatar animal-pic', style: 'width:84px;height:84px' }, h('img', { src: URL.createObjectURL(photo), alt: '' })));
  });
  const name = h('input', { class: 'input', id: 'an_n', value: (a && a.name) || '', maxlength: '40', required: true, placeholder: 'ej. Lucero' });
  const breed = h('input', { class: 'input', id: 'an_b', value: (a && a.breed) || '', maxlength: '40', placeholder: 'ej. Cuarto de milla, Holstein' });
  const year = h('input', { class: 'input', id: 'an_y', type: 'number', inputmode: 'numeric', min: '1980', max: String(new Date().getFullYear()), value: (a && a.birth_year) || '', placeholder: 'ej. 2019' });
  const bio = h('textarea', { class: 'input', id: 'an_d', maxlength: '300', placeholder: 'Lo que lo hace especial: su carácter, sus premios, su historia…' });
  bio.value = (a && a.bio) || '';
  const spChips = h('div', { class: 'chips', style: 'padding:0 0 14px;flex-wrap:wrap' });
  const paintSp = () => spChips.replaceChildren(...SPECIES.map(sp => h('button', { type: 'button', class: 'chip' + (sp === species ? ' on' : ''), onclick: () => { species = sp; paintSp(); } }, sp)));
  paintSp();
  const err = h('p', { class: 'err', role: 'alert' });
  const save = h('button', { class: 'btn', type: 'submit' }, isNew ? 'Agregar animal' : 'Guardar');
  let close;
  const body = h('form', { class: 'sheet-body', onsubmit: async (e) => {
    e.preventDefault(); err.textContent = '';
    if (!name.value.trim()) return (err.textContent = 'Ponle un nombre.');
    save.disabled = true;
    try {
      const y = parseInt(year.value, 10);
      const row = { name: name.value.trim(), species, breed: breed.value.trim() || null, birth_year: y >= 1980 && y <= new Date().getFullYear() ? y : null, bio: bio.value.trim() || null };
      if (photo) {
        const blob = await compressImage(photo, 900);
        const path = `${state.me.id}/animal-${Date.now()}.jpg`;
        const up = await sb.storage.from('media').upload(path, blob, { contentType: 'image/jpeg' });
        if (up.error) throw up.error;
        row.photo_url = sb.storage.from('media').getPublicUrl(path).data.publicUrl;
      }
      let res;
      if (isNew) res = await sb.from('animals').insert({ ...row, owner_id: state.me.id }).select('id').single();
      else res = await sb.from('animals').update(row).eq('id', a.id).select('id').single();
      if (res.error) throw res.error;
      close(); toast(isNew ? `¡${row.name} ya tiene su perfil!` : 'Guardado');
      go('animal', { animalId: res.data.id });
    } catch (ex) { err.textContent = friendlyError(ex); save.disabled = false; }
  } },
    h('div', { style: 'display:flex;align-items:center;gap:16px;margin-bottom:18px' }, prev,
      fileIn, h('label', { for: 'anp', class: 'btn ghost small', style: 'display:inline-flex;align-items:center;cursor:pointer' }, a && a.photo_url ? 'Cambiar foto' : 'Poner foto')),
    h('div', { class: 'field' }, h('label', { for: 'an_n' }, 'Nombre'), name),
    h('div', { class: 'field' }, h('label', {}, '¿Qué es?')), spChips,
    h('div', { class: 'field' }, h('label', { for: 'an_b' }, 'Raza (opcional)'), breed),
    h('div', { class: 'field' }, h('label', { for: 'an_y' }, 'Año en que nació (opcional)'), year),
    h('div', { class: 'field' }, h('label', { for: 'an_d' }, 'Descripción (opcional)'), bio),
    err, save,
    !isNew && h('button', { type: 'button', class: 'btn ghost', style: 'margin-top:10px;color:#C2183A', onclick: async () => {
      if (!confirm(`¿Borrar el perfil de ${a.name}? Sus fotos se quedan en tus publicaciones.`)) return;

    } }, 'Borrar perfil'));

function editProfile(prof) {

const LCAT_EMO = Object.fromEntries(LCATS);

const EKIND_EMO = Object.fromEntries(EKINDS);
const LIST_SEL = 'id,user_id,title,category,price,location,description,photos,status,featured_until,created_at,profiles!user_id(id,username,full_name,avatar_url,ubicacion)';
const EVT_SEL = 'id,user_id,title,kind,starts_at,place,city,description,photo_url,featured_until,created_at,profiles!user_id(id,username,full_name,avatar_url),event_going(user_id)';

const isFeat = (x) => !!(x && x.featured_until && new Date(x.featured_until) > new Date());
const feriaMissing = (e) => /listings|events|event_going|relation|schema/i.test((e && e.message) || '');
const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const MES3 = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
function dayLabel(d) {
  const t = new Date(); t.setHours(0, 0, 0, 0); const x = new Date(d); x.setHours(0, 0, 0, 0);
  const diff = Math.round((x - t) / 864e5);
  if (diff === 0) return 'Hoy'; if (diff === 1) return 'Mañana';
  return `${DIAS[x.getDay()]} ${x.getDate()} de ${MESES[x.getMonth()]}`;
}
const hourLabel = (d) => new Date(d).toLocaleTimeString('es-MX', { hour: 'numeric', minute: '2-digit' });
async function fetchListings({ cat, q, userId, limit = 80 } = {}) {
  if (!HAS_FERIA) return [];
  let qq = sb.from('listings').select(LIST_SEL).order('created_at', { ascending: false }).limit(limit);
  if (cat) qq = qq.eq('category', cat);
  if (userId) qq = qq.eq('user_id', userId);
  if (q) qq = qq.ilike('title', `%${q.replace(/[%,()]/g, '')}%`);
  const { data, error } = await qq;
  if (error) { if (feriaMissing(error)) HAS_FERIA = false; return []; }
  const b = state.blocked || new Set(), weekAgo = Date.now() - 7 * 864e5;
  return (data || []).filter(l => !b.has(l.user_id) && (l.status !== 'vendido' || new Date(l.created_at) > weekAgo))
    .sort((a, c) => (isFeat(c) - isFeat(a)) || ((a.status === 'vendido') - (c.status === 'vendido')));
}
async function fetchEvents({ limit = 60 } = {}) {
  if (!HAS_FERIA) return [];
  const { data, error } = await sb.from('events').select(EVT_SEL).gte('starts_at', new Date(Date.now() - 6 * 36e5).toISOString()).order('starts_at', { ascending: true }).limit(limit);
  if (error) { if (feriaMissing(error)) HAS_FERIA = false; return []; }
  const b = state.blocked || new Set();
  return (data || []).filter(e => !b.has(e.user_id));
}

// ---------- Avisos en el teléfono (push) ----------
const PUSH_FN = 'https://olflxehmwfxvsnzoqzrm.supabase.co/functions/v1/push-mensaje';
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const pushState = () => !pushSupported() ? 'no' : Notification.permission; // 'default' | 'granted' | 'denied' | 'no'
function b64ToBytes(b64) { const p = '='.repeat((4 - b64.length % 4) % 4); const raw = atob((b64 + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(raw, c => c.charCodeAt(0)); }
async function enablePush(quiet) {
  if (!pushSupported() || isGuest()) { if (!quiet) toast('Este teléfono no permite avisos'); return false; }
  try {
    if (Notification.permission !== 'granted') {
      if (quiet) return false;
      const r = await Notification.requestPermission();
      if (r !== 'granted') { toast(r === 'denied' ? 'Bloqueaste los avisos. Actívalos en los ajustes del navegador.' : 'No se activaron los avisos'); return false; }
    }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      const { publicKey } = await fetch(PUSH_FN).then(r => r.json());
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(publicKey) });
    }
    const j = sub.toJSON();
    const { error } = await sb.from('push_subscriptions').upsert({ endpoint: j.endpoint, user_id: state.me.id, p256dh: j.keys.p256dh, auth: j.keys.auth }, { onConflict: 'endpoint' });
    if (error) throw error;
    if (!quiet) { toast('¡Listo! Te avisaremos de tus mensajes 🔔'); SFX.play('msg'); }
    return true;
  } catch (e) { if (!quiet) toast('No se pudieron activar los avisos'); return false; }
}

    if (sub) { await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); } } catch (_) {}

}

    if (!m.read_at && m.sender_id !== state.me.id) unread.set(m.conversation_id, (unread.get(m.conversation_id) || 0) + 1);
  }
  const blocked = state.blocked || new Set();
  const rows = (convs || []).filter(c => last.has(c.id)).map(c => {
    const other = c.user_a === state.me.id ? c.b : c.a;
    return { c, other, m: last.get(c.id), n: unread.get(c.id) || 0 };

  if (!rows.length) return list.replaceChildren(h('div', { class: 'dm-empty' }, h('div', { icon: 'shotsbig' }),

    avatar(other, 52),
    h('div', { class: 'who' }, h('b', {}, other.username), h('span', {}, (m.sender_id === state.me.id ? 'Tú: ' : '') + ((m.body || '').replace(/\s*https?:\S+#[ple]=\d+/, '') || (m.media_type === 'video' ? '🎥 Video' : '📷 Foto')))),

const DM_SIGNED = new Map(); // ruta -> { url, exp }
async function signDm(paths) {
  const now = Date.now();
  const need = [...new Set(paths)].filter(p => { const c = DM_SIGNED.get(p); return !c || c.exp < now + 60e3; });
  if (!need.length) return;
  try {
    const { data } = await sb.storage.from('dm').createSignedUrls(need, 3600);
    (data || []).forEach(d => { if (d && d.signedUrl) DM_SIGNED.set(d.path || need[data.indexOf(d)], { url: d.signedUrl, exp: now + 3500e3 }); });
  } catch (_) {}
}
function openMediaViewer(src, type) {
  const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  const media = type === 'video' ? h('video', { src, controls: true, autoplay: true, playsinline: true }) : h('img', { src, alt: 'Foto del mensaje' });
  const bg = h('div', { class: 'mv', role: 'dialog', 'aria-label': type === 'video' ? 'Video' : 'Foto', onclick: (e) => { if (e.target === bg) close(); } },
    h('button', { class: 'iconbtn plain mv-x', 'aria-label': 'Cerrar', icon: 'close', onclick: close }), media);
  document.addEventListener('keydown', onKey);
  document.body.append(bg);
}
async function renderChat() {
  const chat = state.chat;

  const other = chat.other || {};
  $app.append(h('header', { class: 'topbar chat-head' },
    h('button', { class: 'iconbtn plain', 'aria-label': 'Regresar', icon: 'back', onclick: () => go('inbox') }),
    h('button', { class: 'who', onclick: () => go('profile', { profileId: other.id }) }, avatar(other, 36), h('span', {}, other.username || ''))));
  const box = h('main', { class: 'chat' }, h('div', { class: 'spinner' }));
  const input = h('textarea', { class: 'input', rows: 1, maxlength: '2000', placeholder: 'Escribe un mensaje…', 'aria-label': 'Mensaje' });
  const send = h('button', { class: 'send', type: 'submit', 'aria-label': 'Enviar', icon: 'send', disabled: true });
  const picker = h('input', { type: 'file', accept: 'image/*,video/*', hidden: true });
  const attach = h('button', { class: 'attach', type: 'button', 'aria-label': 'Mandar foto o video', icon: 'camera', onclick: () => picker.click() });
  const form = h('form', { onsubmit: (e) => { e.preventDefault(); submit(); } }, attach, picker, input, send);
  $app.append(box, h('div', { class: 'composer' }, form));
  const blockedNow = state.blocked && state.blocked.has(other.id);
  if (blockedNow) { input.disabled = true; attach.disabled = true; input.placeholder = 'Bloqueaste a esta persona'; }

  const grow = () => { input.style.height = 'auto'; input.style.height = Math.min(130, input.scrollHeight) + 'px'; send.disabled = !input.value.trim() || blockedNow; };
  input.addEventListener('input', grow);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); submit(); } });
  picker.addEventListener('change', () => { const f = picker.files && picker.files[0]; picker.value = ''; if (f) sendMedia(f); });

  let msgs = [], alive = true, lastCount = -1;
  const seen = new Set();
  const rx = new Map();   // id del mensaje -> [{ user_id, reaction }]
  async function loadRx() {
    if (!HAS_MSG_RX) return;
    const ids = msgs.map(m => m.id).filter(id => typeof id === 'number');
    if (!ids.length) return;
    const { data, error } = await sb.from('message_reactions').select('message_id,user_id,reaction').in('message_id', ids.slice(-300));
    if (error) { if (/message_reactions|relation|schema/i.test(error.message || '')) HAS_MSG_RX = false; return; }
    rx.clear(); (data || []).forEach(r => { if (!rx.has(r.message_id)) rx.set(r.message_id, []); rx.get(r.message_id).push(r); });
    if (alive) paint();
  }
  async function setRx(m, k) {
    if (!HAS_MSG_RX || typeof m.id !== 'number') return;
    const list = rx.get(m.id) || [];
    const mineR = list.find(r => r.user_id === state.me.id);
    const before = list.slice();
    const removing = mineR && mineR.reaction === k;
    const next = list.filter(r => r.user_id !== state.me.id);
    if (!removing) next.push({ message_id: m.id, user_id: state.me.id, reaction: k });
    rx.set(m.id, next); paint();
    if (!removing) SFX.play(k);
    try { navigator.vibrate && navigator.vibrate(15); } catch (_) {}
    const res = removing ? await sb.from('message_reactions').delete().eq('message_id', m.id).eq('user_id', state.me.id)
      : await sb.from('message_reactions').upsert({ message_id: m.id, user_id: state.me.id, reaction: k }, { onConflict: 'message_id,user_id' });
    if (res.error) { rx.set(m.id, before); paint(); toast(/message_reactions|relation|schema/i.test(res.error.message || '') ? 'Falta activar las reacciones de mensajes en Supabase' : 'No se pudo reaccionar'); }
  }
  function rxPill(m, el) {
    const list = rx.get(m.id) || [];
    let pill = el.querySelector(':scope > .msg-rx');
    el.classList.toggle('has-rx', list.length > 0);
    if (!list.length) { if (pill) pill.remove(); return; }
    if (!pill) { pill = h('button', { class: 'msg-rx', type: 'button' }); el.append(pill); }
    const mineR = list.find(r => r.user_id === state.me.id);
    pill.setAttribute('aria-label', mineR ? 'Quitar tu reacción' : 'Reaccionar');
    pill.onclick = (e) => { e.stopPropagation(); if (mineR) setRx(m, mineR.reaction); else openReactPicker(el, null, (k) => setRx(m, k)); };
    const kinds = [...new Set(list.map(r => r.reaction))];
    pill.replaceChildren(...kinds.map(k => reactIcon(k, 'mini')), list.length > 1 ? h('span', { class: 'rx-n' }, String(list.length)) : '');
  }
  // Dejar presionado (o doble toque) un mensaje para reaccionar
  function armRx(el, m) {
    if (!HAS_MSG_RX || m.pending) return;
    let t = null, fired = false, lastTap = 0;
    const open = () => { const cur = (rx.get(m.id) || []).find(r => r.user_id === state.me.id); openReactPicker(el, cur ? cur.reaction : null, (k) => setRx(m, k)); };
    el.addEventListener('pointerdown', (e) => { if (e.target.closest('.msg-rx,.msg-post,video')) return; fired = false; clearTimeout(t); t = setTimeout(() => { fired = true; try { navigator.vibrate && navigator.vibrate(15); } catch (_) {} open(); }, 420); });
    ['pointerup', 'pointerleave', 'pointercancel', 'pointermove'].forEach(ev => el.addEventListener(ev, (e) => { if (ev !== 'pointermove' || Math.abs(e.movementY) > 4) clearTimeout(t); }));

      const now = Date.now();
      if (now - lastTap < 300) { lastTap = 0; e.stopPropagation(); e.preventDefault(); clearTimeout(el._tapT); setRx(m, 'love'); el.classList.remove('rx-pop'); void el.offsetWidth; el.classList.add('rx-pop'); return; }
      lastTap = now;
    }, true);
    if (m.media_path || m.localUrl) el.append(h('button', { class: 'msg-rx-add', type: 'button', 'aria-label': 'Reaccionar a esta ' + (m.media_type === 'video' ? 'video' : 'foto'), onclick: (e) => { e.stopPropagation(); open(); } }, '☺'));
  }
  const nodes = new Map(); // id -> elemento (para que los videos no se reinicien)
  function bubble(m) {

    if (nodes.has(key)) return nodes.get(key);
    const mine = m.sender_id === state.me.id;
    let el;
    if (m.media_path || m.localUrl) {
      const src = m.localUrl || (DM_SIGNED.get(m.media_path) || {}).url;
      const media = !src ? h('div', { class: 'msg-media-ph' }, 'Cargando…')
        : m.media_type === 'video' ? h('video', { src, controls: true, playsinline: true, preload: 'metadata' })
        : h('img', { src, alt: 'Foto', loading: 'lazy', onclick: (e) => { const box = e.currentTarget.closest('.msg'); clearTimeout(box._tapT); box._tapT = setTimeout(() => openMediaViewer(src, 'image'), 300); } });
      el = h('div', { class: 'msg hasmedia ' + (mine ? 'me' : 'them') + (m.pending ? ' pending' : '') }, media, m.body ? h('p', {}, m.body) : null,
        m.pending ? h('span', { class: 'msg-up' }, 'Enviando…') : null);
      if (!src) return el; // sin enlace todavía: no guardar, se vuelve a intentar
    } else {
      const pm = /#([ple])=(\d+)/.exec(m.body || '');
      const openers = { p: [openPostById, '👀 Ver publicación'], l: [openListingById, '🛒 Ver anuncio'], e: [openEventById, '📅 Ver evento'] };
      el = pm ? h('div', { class: 'msg ' + (mine ? 'me' : 'them') + (m.pending ? ' pending' : '') }, m.body.replace(/\s*https?:\S+#[ple]=\d+/, ''),
          h('button', { class: 'msg-post', onclick: () => openers[pm[1]][0](Number(pm[2])) }, openers[pm[1]][1]))
        : h('div', { class: 'msg ' + (mine ? 'me' : 'them') + (m.pending ? ' pending' : '') }, m.body);
    }

  }
  function paint() {
    const kids = []; let prev = null;

      if (!prev || new Date(m.created_at) - new Date(prev.created_at) > 15 * 60e3) kids.push(h('div', { class: 'msg-time' }, shortTime(m.created_at)));
      const el = bubble(m); if (!m.pending) rxPill(m, el); kids.push(el);

    }

    if (lastMine && msgs[msgs.length - 1] === lastMine && lastMine.read_at) kids.push(h('div', { class: 'msg-seen' }, 'Visto'));
    if (!msgs.length) kids.push(h('div', { class: 'dm-empty' }, h('div', { icon: 'shotsbig' }), h('b', {}, '¡Salud!'), `Mándale el primer mensaje a @${other.username || ''}.`));

  const COLS = 'id,sender_id,body,media_path,media_type,created_at,read_at';
  async function load() {

    if (!alive) return;
    if (error) return box.replaceChildren(h('div', { class: 'empty' }, friendlyError(error)));
    await signDm((data || []).filter(m => m.media_path).map(m => m.media_path));
    if (!alive) return;

  function failMsg(error) {

  }
  async function sendMedia(file) {
    if (blockedNow) return;

    if (file.size > 50 * 1024 * 1024) return toast('El video es muy pesado (máx. 50 MB)');

    const localUrl = URL.createObjectURL(blob);
    const tmp = { id: 'tmp' + Date.now(), sender_id: state.me.id, media_type: isVideo ? 'video' : 'image', localUrl, created_at: new Date().toISOString(), pending: true };
    msgs.push(tmp); paint();
    const ext = isVideo ? ((file.name.split('.').pop() || 'mp4').toLowerCase().replace(/[^a-z0-9]/g, '') || 'mp4') : 'jpg';

// ---------- arranque ----------
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  // El aviso llegó con la app abierta: suena la campana aquí adentro
  navigator.serviceWorker.addEventListener('message', (e) => {
    if (!e.data || e.data.type !== 'herria-msg') return;
    msgDing();
    const b = document.querySelector('.msg-count'); if (b) refreshUnread(b);
  });
}
// Despertar el audio con cualquier toque (cada vez que vuelves a la app también)
['pointerdown', 'touchstart', 'keydown'].forEach(ev => document.addEventListener(ev, () => { if (!SFX.ready) SFX.unlock(); }, { passive: true, capture: true }));
document.addEventListener('visibilitychange', () => { if (!document.hidden) { const b = document.querySelector('.msg-count'); if (b) refreshUnread(b); } });
let started = false;
// Botón "atrás" del teléfono: cierra lo que esté abierto, regresa al inicio, y en el inicio actualiza.
// Botón "atrás" del teléfono: cierra lo que esté abierto y regresa al inicio.
// En el inicio: si estás abajo, te sube hasta arriba; si ya estás arriba, el siguiente "atrás" cierra la app.
let ARMED = false;
try { history.scrollRestoration = 'manual'; } catch (_) {}
function armBack() { if (ARMED) return; try { history.pushState({ yh: 1 }, ''); ARMED = true; } catch (_) {} }
function backNeeded() {
  const overlay = document.querySelector('.sd-viewer,.sheet-bg,.react-pick-bg,.sdc,.menu-bg');
  return !!overlay || state.view !== 'feed' || window.scrollY > 120;
}
function syncBack() { if (backNeeded()) armBack(); }
setInterval(() => { const b = document.querySelector('.msg-count'); if (b && !document.hidden) refreshUnread(b); }, 20000);
window.addEventListener('scroll', () => { if (!ARMED && window.scrollY > 120) armBack(); }, { passive: true });
// Cada vez que cambia la pantalla o se abre algo, el "atrás" queda listo para regresar
new MutationObserver(() => syncBack()).observe(document.body, { childList: true });
window.addEventListener('popstate', () => {
  ARMED = false;
  const picker = document.querySelector('.react-pick-bg');
  if (picker) { picker.remove(); return syncBack(); }
  const menu = document.querySelector('.menu-bg');
  if (menu && !document.querySelector('.sheet-bg')) { menu._close(); return syncBack(); }
  const sdcPane = document.querySelector('.sdc .sdc-pane .sdc-done, .sdc .sdc-sheet .sdc-done');
  if (sdcPane) { sdcPane.click(); return syncBack(); }
  const sdc = document.querySelector('.sdc');
  if (sdc) { sdc._close(); return syncBack(); }
  const viewerClose = document.querySelector('.sd-viewer [aria-label="Cerrar"]');
  if (viewerClose) { viewerClose.click(); return syncBack(); }
  const sheets = document.querySelectorAll('.sheet-bg');
  if (sheets.length) { const c = sheets[sheets.length - 1].querySelector('.sheet-head [aria-label="Cerrar"]'); c ? c.click() : sheets[sheets.length - 1].remove(); return syncBack(); }
  if (state.view === 'auth') { go('feed'); return syncBack(); }
  if (!state.me || state.view === 'welcome') return syncBack();
  if (state.view === 'chat') { go('inbox'); return syncBack(); }
  if (state.view !== 'feed') { go('feed'); return syncBack(); }
  // En el inicio y abajo: sube hasta arriba y avisa; el siguiente "atrás" ya cierra la app
  window.scrollTo({ top: 0, behavior: 'instant' });
  toast('Toca atrás otra vez para salir');
});
sb.auth.onAuthStateChange((_event, session) => {
  const changed = !started || (session && session.user.id) !== (state.session && state.session.user.id);
  started = true;
  state.session = session;
  if (!changed) return;
  stopInbox();
  state.me = session ? null : GUEST; state.blocked = new Set(); state.view = 'feed'; render();
  if (session) setTimeout(async () => { await loadMe(); listenInbox(); enablePush(true); if (needsWelcome()) { state.view = 'welcome'; state.welcomeStep = 0; } render(); openDeepLink(); }, 0);
  else setTimeout(openDeepLink, 300);
});
// Enlaces a una publicación (…/#p=123): la abre al entrar
function openDeepLink() {
  const u = /^#u=([0-9a-f-]{36})$/.exec(location.hash || '');
  if (u && state.me && !isGuest()) {  // tocaste un aviso de mensaje: abre ese chat
    history.replaceState(history.state, '', location.pathname + location.search);
    sb.from('profiles').select(PROF_MINI).eq('id', u[1]).maybeSingle().then(({ data }) => { if (data) openChatWith(data); });
    return;
  }
  const m = /^#([ple])=(\d+)$/.exec(location.hash || '');
  if (!m || !state.me) return;
  history.replaceState(history.state, '', location.pathname + location.search);
  const id = Number(m[2]);
  if (m[1] === 'l') { state.feriaTab = 'mercado'; if (state.view !== 'feria') go('feria'); return openListingById(id); }
  if (m[1] === 'e') { state.feriaTab = 'eventos'; if (state.view !== 'feria') go('feria'); return openEventById(id); }

window.addEventListener('hashchange', openDeepLink);
