<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172531">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ranchfolk">
<title>Ranchfolk</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#FFFFFF; --surface:#FFF6EE; --surface2:#FFFFFF; --line:#F1DED2;
  --text:#2A0E0F; --soft:#4E2E27; --muted:#8C6A5D;
  --accent:#FF3347; --gold:#FFD23F; --teal:#FFD23F; --ink:#1A0608;
  --grad:linear-gradient(120deg,#FFD23F 0%,#FF7A1A 50%,#E8172E 100%);
  --ring:repeating-conic-gradient(from 0deg,#FFD23F 0deg 12deg,#E8172E 12deg 24deg);
  --glow:0 8px 22px rgba(255,90,26,.32);
  --stitch:1.5px dashed rgba(232,120,26,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Work Sans',system-ui,sans-serif;font-size:15px}
body{background:var(--bg)}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;transition:transform .12s ease}
button:active{transform:scale(.94)}
a{color:var(--accent)}
img,video{display:block;max-width:100%}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.logo{font-family:Rye,serif;font-size:30px;letter-spacing:.5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 12px rgba(255,122,26,.45))}
.topbar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.9);border-bottom:var(--stitch);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;padding:0}
.iconbtn.plain{border:none;background:none}
main{flex:1;padding-bottom:calc(104px + env(safe-area-inset-bottom))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 14px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
.nav-in{pointer-events:auto;max-width:492px;margin:0 auto;display:flex;justify-content:space-around;align-items:center;padding:6px 8px;border-radius:28px;background:rgba(255,255,255,.94);backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);border:1px solid var(--line);box-shadow:0 8px 28px rgba(120,40,20,.16)}
.nav button{border:none;background:none;width:58px;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.nav button.on{color:var(--text)}
.nav button.on svg{stroke:url(#g);filter:drop-shadow(0 0 8px rgba(255,122,26,.7))}
.nav button.on::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.nav .plus{width:60px;height:46px;border-radius:16px;background:var(--grad);color:var(--ink);box-shadow:var(--glow);outline:var(--stitch);outline-color:rgba(26,6,8,.45);outline-offset:-5px}
.stories{display:flex;gap:14px;overflow-x:auto;padding:10px 16px 16px;scrollbar-width:none}
.stories::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.story{border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;flex-shrink:0}
.story span{font-size:12px;font-weight:500;color:var(--soft);max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{position:relative;width:70px;height:70px;border-radius:50%;padding:3px;background:var(--line)}
.ring.new{background:none}
.ring.new::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--ring);animation:spin 4s linear infinite;box-shadow:0 0 16px rgba(255,122,26,.45)}
.ring>div{position:relative;width:100%;height:100%;border-radius:50%;border:3px solid var(--bg);overflow:hidden}
.avatar{border-radius:50%;background:var(--grad);color:var(--ink);font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 16px;scrollbar-width:none}
.chip{flex-shrink:0;height:38px;padding:0 18px;border-radius:19px;border:1px solid var(--line);background:var(--surface);color:var(--soft);font-weight:600;font-size:14px}
.chip.on{background:var(--grad);border-color:transparent;color:var(--ink);box-shadow:0 4px 16px rgba(255,122,26,.35)}
.post{margin:0 10px 22px;border-radius:24px;background:#FFFFFF;border:1px solid var(--line);overflow:hidden;box-shadow:0 6px 22px rgba(120,40,20,.10)}
.post-head{display:flex;align-items:center;gap:10px;padding:12px 12px 10px;border-bottom:var(--stitch);margin:0 8px 0}
.post-head .who{flex:1;min-width:0;border:none;background:none;padding:0;text-align:left;display:flex;flex-direction:column}
.post-head b{font-size:15px}
.post-head small{color:var(--muted);font-size:13px}
.tag{font-size:12px;font-weight:700;color:var(--ink);background:var(--grad);padding:5px 11px;border-radius:12px}
.media{position:relative;background:#000;width:100%;aspect-ratio:4/5;overflow:hidden;user-select:none;-webkit-user-select:none}
.media img,.media video{width:100%;height:100%;object-fit:cover}
.media.is-ride{cursor:pointer;aspect-ratio:4/5}
.ride-badge{position:absolute;left:10px;top:10px;z-index:2;display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;font-weight:700;padding:4px 10px 4px 7px;border-radius:999px;pointer-events:none}
.ride-badge [icon],.ride-badge svg{width:16px;height:16px}
.ride-go{position:absolute;right:10px;bottom:10px;z-index:2;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center;pointer-events:none}
.ride-go svg{width:20px;height:20px}
.reels-ov{position:fixed;inset:0;z-index:35;background:#000;animation:up .18s ease-out}
.reels-ov .rides{z-index:1}
.reels-ov .ride-info{bottom:calc(28px + env(safe-area-inset-bottom))}
.reels-ov .rides-top{z-index:4}
.up-status{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.62);color:#fff;font-size:13px;font-weight:600;padding:7px 12px;border-radius:12px;pointer-events:none}
.up-status i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden;font-style:normal}
.up-status i b{display:block;height:100%;background:#F3BD68;transition:width .3s}
.up-status.ok{background:rgba(30,110,60,.88)}
.picker .up-status span{color:#fff;font-weight:700}
.picker{position:relative}
.rc-cam .rc-live{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.rc-cam .rc-live.mirror{transform:scaleX(-1)}
.rc-cam .sdc-top{align-items:flex-start}
.rc-song{pointer-events:auto;margin-top:4px;max-width:58%;height:38px;padding:0 16px;border:none;border-radius:19px;background:rgba(0,0,0,.5);color:#fff;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-song.on{background:rgba(243,189,104,.92);color:#172531}
.rc-cam .sdc-tools{pointer-events:auto}
.rc-cam .sdc-tool.on span{filter:drop-shadow(0 0 6px #F3BD68)}
.rc-cam .sdc-x{pointer-events:auto}
.rc-bottom{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:10px 20px calc(22px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.5))}
.rc-durs{display:flex;justify-content:center;gap:6px;margin-bottom:14px}
.rc-durs button{border:none;background:none;color:rgba(255,255,255,.7);font-weight:700;font-size:14px;padding:6px 12px;border-radius:14px}
.rc-durs button.on{background:#fff;color:#172531}
.rc-cam.recording .rc-durs,.rc-cam.recording .rc-gal,.rc-cam.recording .sdc-tools,.rc-cam.recording .rc-song{visibility:hidden}
.rc-row3{display:flex;align-items:center;justify-content:space-between}
.rc-gal{width:56px;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;color:#fff;font-size:26px;padding:0}
.rc-gal small{font-size:12px;font-weight:600}
.rc-rec{width:84px;height:84px;border-radius:50%;border:none;background:none;padding:0;position:relative}
.rc-ring{--p:0;position:absolute;inset:0;border-radius:50%;background:conic-gradient(#F3BD68 calc(var(--p)*360deg),rgba(255,255,255,.55) 0);display:flex;align-items:center;justify-content:center}
.rc-ring::before{content:'';position:absolute;inset:6px;border-radius:50%;background:rgba(0,0,0,.25)}
.rc-ring span{position:relative;width:62px;height:62px;border-radius:50%;background:#E8323C;transition:all .2s}
.rc-cam.recording .rc-ring span{width:30px;height:30px;border-radius:8px}
.rc-time{position:absolute;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:3;background:rgba(232,50,60,.9);color:#fff;font-weight:800;font-size:14px;padding:4px 12px;border-radius:12px}
.rc-count{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;font:900 120px 'Work Sans',system-ui,sans-serif;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.6);animation:up .3s ease-out;pointer-events:none}
.rc-msg{position:absolute;left:24px;right:24px;top:38%;z-index:2;text-align:center;background:rgba(0,0,0,.6);padding:18px;border-radius:18px}
.rc-msg p{margin:0 0 12px;line-height:1.4}
.rc-edit .sdc-x{font-size:30px;line-height:1}
.sdc .sdc-pane.rc-post{background:#FFFDF8;color:#172531;padding:calc(10px + env(safe-area-inset-top)) 0 0}
.rc-post-top{display:flex;align-items:center;justify-content:space-between;padding:0 12px 10px;border-bottom:1px solid #EFE6D4}
.rc-post-top b{font-size:17px}
.sdc .rc-post .rc-back{width:40px;height:40px;padding:0;font-size:30px;line-height:1;background:none;color:#172531}
.rc-post-body{flex:1;overflow-y:auto;padding:14px 16px}
.rc-row{display:flex;gap:12px;margin-bottom:12px}
.rc-cap{flex:1;min-height:150px;resize:none}
.rc-th{width:96px;flex:none;display:flex;flex-direction:column;gap:4px}
.rc-thumb{width:96px;height:150px;object-fit:cover;border-radius:12px;background:#000}
.rc-th small{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rc-tags .chip{font-size:13px;padding:5px 10px}
.rc-status{display:flex;align-items:center;gap:10px;margin:14px 0 4px;padding:10px 12px;border-radius:12px;background:#F4EBDB;font-size:14px;font-weight:600}
.rc-status i{flex:1;height:6px;border-radius:3px;background:rgba(0,0,0,.1);overflow:hidden}
.rc-status i b{display:block;height:100%;background:#C7843B;transition:width .3s}
.rc-status.ok{background:#E3F2E5;color:#1E6E3C}
.rc-status.bad{background:#FBE4E4;color:#B3261E}
.rc-post-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #EFE6D4}
.rc-pub{width:100%}
.ride-ovl{container-type:inline-size}
.fx-ph.vid{position:relative}
.fx-ph video{width:100%;height:100%;object-fit:cover}
.fx-ph-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.fx-vid{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:10px}
.fx-pic video{width:100%;height:100%;object-fit:cover}
.fx-car-vid{flex:0 0 100%;width:100%;height:100%;object-fit:contain;background:#000;scroll-snap-align:center}


@keyframes pulse{50%{opacity:.45}}
.reels-ov .ride-side{bottom:calc(32px + env(safe-area-inset-bottom))}
.burst{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0}
.burst.go{animation:burst .9s ease-out}
.burst b{font-family:Rye,serif;font-size:42px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 14px rgba(0,0,0,.7))}
@keyframes burst{0%{opacity:0;transform:scale(.4) rotate(-8deg)}20%{opacity:1;transform:scale(1.2) rotate(4deg)}40%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:scale(1.05) translateY(-18px)}}
.actions{display:flex;align-items:center;padding:6px 6px 0}
.actions .count{margin-left:auto;padding-right:10px;font-weight:700;font-size:14px}
.liked{color:var(--accent)}
.liked svg{fill:var(--accent);filter:drop-shadow(0 0 8px rgba(232,23,46,.8))}
.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{50%{transform:scale(1.4)}}
.caption{margin:2px 16px 0;font-size:14px;line-height:1.45;color:var(--soft);white-space:pre-wrap;word-wrap:break-word}
.caption b{color:var(--text)}
.meta{margin:6px 16px 14px;color:var(--muted);font-size:13px}
.linkbtn{border:none;background:none;padding:0;color:var(--muted);font-size:13px}
.shop{margin:12px 12px 4px;padding:12px;border-radius:18px;background:linear-gradient(135deg,rgba(255,122,26,.12),rgba(255,210,63,.12));border:var(--stitch)}
.shop h4{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.shop h4 small{font-weight:400;color:var(--muted);font-size:11px}
.shop-items{display:flex;gap:8px;overflow-x:auto}
.shop-item{flex-shrink:0;min-width:110px;padding:12px;border-radius:14px;background:#FFFFFF;border:1px solid var(--line);text-decoration:none;color:var(--text);display:flex;flex-direction:column;gap:4px}
.shop-item span{color:#D0451B;font-size:13px;font-weight:700}
.empty{text-align:center;padding:60px 30px;color:var(--muted);line-height:1.5}
.empty .logo{display:block;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:0 4px}
.tile{position:relative;aspect-ratio:3/4;background:var(--surface);border:none;padding:0;overflow:hidden;border-radius:10px}
.tile img,.tile video{width:100%;height:100%;object-fit:cover}
.tile .play{position:absolute;top:6px;right:6px;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))}
.page{padding-left:16px;padding-right:16px}
.page form{padding-bottom:24px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--soft)}
.input{width:100%;min-height:50px;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
.input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(255,122,26,.25)}
textarea.input{min-height:90px;resize:vertical}
.btn{width:100%;height:52px;border-radius:26px;border:none;background:var(--grad);color:var(--ink);font-weight:700;font-size:16px;box-shadow:var(--glow)}
.btn:disabled{opacity:.55}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--text);box-shadow:none}
.btn.small{width:auto;height:42px;padding:0 20px;font-size:14px}
.err{color:#C2183A;font-size:14px;margin:0 0 12px;min-height:1px}
.ok{color:#1E8A4C;font-size:14px;margin:0 0 12px}
.picker{width:100%;aspect-ratio:4/5;border-radius:22px;border:2px dashed rgba(255,210,63,.55);background:linear-gradient(135deg,rgba(255,122,26,.08),rgba(255,210,63,.1));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);overflow:hidden;padding:0;margin-bottom:14px}
.picker img,.picker video{width:100%;height:100%;object-fit:cover}
.auth{flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 22px calc(30px + env(safe-area-inset-bottom));position:relative;isolation:isolate}
.auth::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 30% at 20% 20%,rgba(255,122,26,.35),transparent 70%),radial-gradient(40% 30% at 80% 30%,rgba(255,210,63,.3),transparent 70%),radial-gradient(45% 35% at 50% 85%,rgba(232,23,46,.22),transparent 70%);filter:blur(30px);animation:float 12s ease-in-out infinite alternate}
@keyframes float{to{transform:translate(4%,-3%) rotate(8deg)}}
.auth .logo{font-size:60px;text-align:center}
.auth form{padding:20px 18px;border-radius:24px;background:rgba(255,255,255,.85);border:var(--stitch);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.auth p.lead{text-align:center;color:var(--soft);margin:6px 0 30px}
.switch{text-align:center;margin-top:18px;color:var(--muted);font-size:14px}
.switch button{border:none;background:none;color:#D0451B;font-weight:700;padding:8px}
.prof-head{display:flex;align-items:center;gap:18px;padding:6px 16px 14px}
.prof-head .ring{background:var(--ring)}
.stats{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));text-align:center;gap:8px}
.stats>div{padding:10px 4px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.stats b{display:block;font-size:20px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats span{font-size:12px;color:var(--muted)}
.prof-info{padding:0 16px 14px}
.prof-info b{font-size:18px}
.prof-info div{color:var(--muted);font-size:14px;margin-top:2px}
.prof-btns{display:flex;gap:8px;padding:0 16px 16px}
.prof-btns .btn{height:42px;font-size:14px}
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(40,10,5,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:85vh;max-height:85dvh;background:var(--surface2);border-radius:26px 26px 0 0;border:1px solid var(--line);display:flex;flex-direction:column;animation:up .25s cubic-bezier(.2,1,.3,1)}
.sheet .post{margin:0 0 10px;box-shadow:none}
@keyframes up{from{transform:translateY(60px);opacity:.3}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 6px 18px;border-bottom:1px solid var(--line)}
.sheet-head b{font-size:16px}
.sheet-body{overflow-y:auto;padding:12px 16px;flex:1}
.sheet-foot{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.cmt{display:flex;gap:10px;margin-bottom:14px}
.cmt p{margin:0;font-size:14px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;color:var(--soft)}
.cmt p b{color:var(--text)}
.cmt small{color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--grad);color:var(--ink);padding:11px 20px;border-radius:22px;font-weight:700;font-size:14px;z-index:30;max-width:90vw;text-align:center;box-shadow:var(--glow);animation:up .25s ease-out}
.spinner{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--teal);border-right-color:var(--gold);animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.row{display:flex;gap:8px}
.row .input{flex:1;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- Sundowns ---- */
.sd-add{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;background:var(--grad);color:var(--ink);border:3px solid var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;line-height:1}
.ring.seen{background:#E6D2C7}
.ring.blank{background:none;border:2px dashed rgba(255,210,63,.55);padding:1px}
.story .sd-add{max-width:none;overflow:visible;color:var(--ink);width:28px;height:28px;font-size:18px;z-index:2}
.sd-new>div{display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#FFFDF8,#F3E6CC)}
.story .sd-plus{font-size:34px;font-weight:300;color:#6A3415;line-height:1;max-width:none!important;overflow:visible!important}
.sd-new{border-color:#CFAE73!important}
.kinds svg{width:20px;height:20px}
.sd-viewer{color:#fff;position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;animation:up .2s ease-out}
.sd-in{position:relative;flex:1;max-width:520px;width:100%;margin:0 auto;display:flex;align-items:center;justify-content:center;overflow:hidden}
.sd-in img,.sd-in video{width:100%;height:100%;object-fit:contain}
.sd-top{position:absolute;left:0;right:0;top:0;z-index:3;padding:calc(10px + env(safe-area-inset-top)) 10px 18px;background:linear-gradient(rgba(0,0,0,.65),transparent)}
.sd-bars{display:flex;gap:4px;margin-bottom:10px}
.sd-bar{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.sd-bar i{display:block;height:100%;width:0;background:var(--grad)}
.sd-head{display:flex;align-items:center;gap:10px}
.sd-head b{font-size:15px}
.sd-head small{color:rgba(255,255,255,.75);font-size:13px;white-space:nowrap}
.sd-head .sp{flex:1}
.sd-who{display:flex;align-items:center;gap:10px;border:none;background:none;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.sd-zone{position:absolute;top:80px;bottom:90px;z-index:2;border:none;background:none;padding:0}
.sd-zone.prev{left:0;width:33%}
.sd-zone.next{right:0;width:67%}
.sd-cap{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:24px 18px calc(22px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.7));font-size:15px;line-height:1.4;text-align:center;white-space:pre-wrap;word-wrap:break-word}
.sd-label{display:inline-flex;align-items:center;gap:6px;font-family:Rye,serif;font-size:13px;color:var(--gold)}

.sd-viewer .sd-top,.sd-viewer .sd-cap{transition:opacity .2s}
.sd-viewer.is-held .sd-top,.sd-viewer.is-held .sd-cap{opacity:0}
.sd-paused{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;display:none;align-items:center;gap:8px;padding:10px 16px;border-radius:22px;background:rgba(0,0,0,.55);color:#fff;font-weight:700;font-size:14px;pointer-events:none}
.sd-paused svg{width:18px;height:18px}
.sd-zone{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.sd-bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(30px) brightness(.55) saturate(1.1);transform:scale(1.1)}
.sd-stage img,.sd-stage video{position:relative}
.sd-music{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:10px;max-width:82%;padding:8px 16px 8px 8px;border-radius:16px;background:rgba(251,240,216,.96);color:#3B2314;box-shadow:0 8px 24px rgba(0,0,0,.35);pointer-events:none;animation:sdpop .35s ease-out}
.sd-music img,.sd-music .ph{width:46px;height:46px;border-radius:10px;object-fit:cover;flex-shrink:0;background:linear-gradient(135deg,#FA5C6E,#D21E3C);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
.sd-music .t{display:flex;flex-direction:column;min-width:0}
.sd-music b,.sd-music small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd-music b{font-size:14px}.sd-music small{font-size:12px;color:#7A5A44}
.sd-music .eq{display:flex;align-items:flex-end;gap:2px;height:16px;margin-left:4px}
.sd-music .eq i{width:3px;height:40%;background:#8B4A22;border-radius:1px;animation:eq .9s ease-in-out infinite}
.sd-music .eq i:nth-child(2){animation-delay:.2s}.sd-music .eq i:nth-child(3){animation-delay:.4s}
.sd-viewer.is-paused .sd-music .eq i,.sd-viewer.sd-muted .sd-music .eq i{animation-play-state:paused}
@keyframes sdpop{from{transform:translateX(-50%) scale(.85);opacity:0}}
.sd-reply{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:center;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.55))}
.sd-reply input{flex:1;min-width:0;height:42px;padding:0 16px;border-radius:22px;border:1.5px solid rgba(255,255,255,.75);background:rgba(0,0,0,.25);color:#fff;font:inherit;font-size:15px;outline:none}
.sd-reply input::placeholder{color:rgba(255,255,255,.8)}
.sd-reply .emo{width:40px;height:40px;border:none;border-radius:50%;background:none;font-size:26px;line-height:1;padding:0;flex-shrink:0}
.sd-reply .emo:active{transform:scale(1.25)}
.sd-reply .sendbtn{display:none;width:42px;height:42px;border:none;border-radius:50%;background:var(--grad);color:#3B2314;align-items:center;justify-content:center;flex-shrink:0}
.sd-reply.typing .emo{display:none}.sd-reply.typing .sendbtn{display:flex}
.sd-viewer.has-reply .sd-cap{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.sd-viewer.has-reply .sd-zone{bottom:120px}
.sd-float{position:absolute;bottom:80px;z-index:6;font-size:34px;pointer-events:none;animation:sdfloat 1.6s ease-out forwards}
@keyframes sdfloat{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-30px) scale(1.15)}100%{transform:translateY(-320px) scale(1);opacity:0}}
/* ---- Rides ---- */
.rides{color:#fff;position:fixed;top:0;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;overflow-y:auto;scroll-snap-type:y mandatory;background:#000;scrollbar-width:none;z-index:1}
.rides::-webkit-scrollbar{display:none}
.rides-top{color:#fff;position:fixed;top:0;left:0;right:0;max-width:520px;margin:0 auto;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:linear-gradient(rgba(0,0,0,.55),transparent);pointer-events:none}
.rides-top>*{pointer-events:auto}
.ride{position:relative;height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#000}
.ride video{width:100%;height:100%;object-fit:cover}
.ride .burst{z-index:2}
.ride-info{position:absolute;left:0;right:76px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:3;padding:0 14px;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.ride-info .who{display:flex;align-items:center;gap:10px;border:none;background:none;padding:0;margin-bottom:8px;text-align:left}
.ride-info .who b{font-size:16px}
.ride-info p{margin:0 0 8px;font-size:14px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.ride::after{content:"";position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.65));pointer-events:none;z-index:1}
.ride-side{position:absolute;right:6px;bottom:calc(100px + env(safe-area-inset-bottom));z-index:3;display:flex;flex-direction:column;align-items:center;gap:6px}
.ride-side .iconbtn{width:52px;height:52px;border-radius:26px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15);color:#fff}
.ride-side span{font-size:12px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.8);margin-bottom:6px}
.ride-paused{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;pointer-events:none}
.ride-paused span{width:76px;height:76px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;color:#fff}
.kinds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:4px;border-radius:20px;background:var(--surface);border:1px solid var(--line);margin-bottom:14px}
.kinds button{height:44px;border:none;border-radius:16px;background:none;color:var(--soft);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.kinds button.on{background:var(--grad);color:var(--ink);box-shadow:var(--glow)}
.hint{font-size:13px;color:var(--muted);margin:-6px 0 14px;line-height:1.4}

/* ---- Animales ---- */
.animal-pic{background:linear-gradient(135deg,#FFE7B8,#FFD0B0);color:#B5401A}
.animal-pic>span{display:flex;align-items:center;justify-content:center;width:55%;height:55%}
.animal-pic>span svg{width:100%;height:100%}
.animal-tag{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 5px;border-radius:17px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:13px}
.ride .animal-tag{background:rgba(0,0,0,.4);border-color:rgba(255,255,255,.25);color:#fff}
.herd{padding:0 0 16px}
.herd h3{display:flex;align-items:center;gap:8px;margin:0 16px 10px;font-size:15px}
.herd h3 svg{width:18px;height:18px;color:#D0451B}
.herd-row{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none}
.herd-row::-webkit-scrollbar{display:none}
.herd-card{flex-shrink:0;width:96px;padding:12px 6px;border-radius:18px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 14px rgba(120,40,20,.07)}
.herd-card b{font-size:13px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.herd-card small{font-size:11px;color:var(--muted)}
.herd-card.add{border:1.5px dashed rgba(232,120,26,.55);background:var(--surface);box-shadow:none}
.herd-plus{width:64px;height:64px;border-radius:50%;background:var(--grad);color:var(--ink);font-size:32px;font-weight:700;display:flex;align-items:center;justify-content:center}
.animal-hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 20px 16px}
.animal-ring{padding:5px;border-radius:50%;background:var(--ring);box-shadow:var(--glow);margin-bottom:12px}
.animal-ring .avatar{border:4px solid #fff}
.animal-hero h1{margin:0;font-family:Rye,serif;font-weight:400;font-size:32px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.animal-meta{color:var(--muted);font-size:14px;margin-top:4px}
.animal-owner{display:inline-flex;align-items:center;gap:8px;margin-top:10px;border:none;background:none;color:var(--soft);font-size:14px;padding:4px}
.animal-bio{margin:10px 0 0;font-size:14px;line-height:1.45;color:var(--soft);max-width:420px;white-space:pre-wrap}

/* ---- Menú y reglas ---- */
.menu{padding:8px 10px calc(14px + env(safe-area-inset-bottom))}
.menu-item{width:100%;min-height:52px;display:flex;align-items:center;gap:12px;padding:0 12px;border:none;border-radius:14px;background:none;color:var(--text);font-size:15px;font-weight:600;text-align:left}
.menu-item:active{background:var(--surface)}
.menu-item.danger{color:#C2183A}
.rules{font-size:14px;line-height:1.5;color:var(--soft);padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.rules p{margin:0 0 14px}
.rules-sec h4{margin:16px 0 6px;font-size:15px;color:var(--text)}
.rules-sec ul{margin:0;padding-left:20px}
.rules-sec li{margin-bottom:6px}

/* ---- Bienvenida ---- */
.welcome-card{margin:0 10px 16px;padding:16px;border-radius:24px;background:linear-gradient(135deg,rgba(255,210,63,.16),rgba(255,122,26,.12) 50%,rgba(232,23,46,.1));border:var(--stitch)}
.wc-head{display:flex;align-items:flex-start;justify-content:space-between}
.wc-kicker{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.wc-lead{margin:6px 0 12px;font-size:14px;color:var(--soft)}
.wc-tips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wc-tip{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.wc-tip b{display:block;font-size:14px}
.wc-tip small{display:block;font-size:12px;line-height:1.35;color:var(--muted);margin-top:2px}
.wc-ico{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:var(--grad);color:var(--ink);display:flex;align-items:center;justify-content:center}
.wc-ico svg{width:18px;height:18px}
.welcome{flex:1;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));position:relative;isolation:isolate}
.welcome::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 30% at 20% 15%,rgba(255,210,63,.28),transparent 70%),radial-gradient(40% 30% at 85% 30%,rgba(255,122,26,.22),transparent 70%),radial-gradient(45% 35% at 50% 90%,rgba(232,23,46,.14),transparent 70%);filter:blur(30px)}
.wl-top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.wl-dots{display:flex;gap:6px}
.wl-dots span{width:26px;height:6px;border-radius:3px;background:var(--line)}
.wl-dots span.on{background:var(--grad)}
.wl-body{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;max-width:420px;width:100%;margin:0 auto}
.wl-title{margin:0 0 8px;font-family:Rye,serif;font-weight:400;font-size:30px;line-height:1.15;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.wl-sub{margin:0 0 24px;color:var(--soft);font-size:15px;line-height:1.45}
.wl-avatar{display:flex;justify-content:center;margin-bottom:12px}
.wl-avatar .avatar{border:4px solid #fff;box-shadow:var(--glow)}
.wl-hat{display:flex;justify-content:center;margin-bottom:18px}
.wl-hat svg{width:140px;height:92px}

.liked .horse,.ride .liked .horse{filter:drop-shadow(0 2px 4px rgba(90,44,16,.45))}
.rear .horse,.burst.go .horse{animation:rear .9s cubic-bezier(.3,1.25,.5,1) both}
@keyframes rear{0%{transform:rotate(0) scale(1)}30%{transform:rotate(-16deg) translateY(-3px) scale(1.18)}55%{transform:rotate(6deg) scale(1.05)}75%{transform:rotate(-4deg)}100%{transform:rotate(0) scale(1)}}
.burst-horse .horse{width:150px;height:150px;filter:drop-shadow(0 0 2px #FBF0D8) drop-shadow(0 0 2px #FBF0D8) drop-shadow(0 4px 14px rgba(0,0,0,.55))}
.wc-ico .horse{width:24px;height:24px;filter:none}

/* ---------- Sundown: recuadro 9:16 con textos, emojis y música ---------- */
.sd-canvas{position:relative;width:min(100%,calc(100vh*9/16));width:min(100%,calc(100dvh*9/16));aspect-ratio:9/16;max-height:100%;margin:auto;container-type:inline-size;overflow:hidden}
.sd-canvas>img,.sd-canvas>video{position:absolute;inset:0;width:100%!important;height:100%!important;object-fit:contain}
.sdo-layer{position:absolute;inset:0;pointer-events:none;z-index:1}
.sdo{position:absolute;white-space:pre-wrap;text-align:center;-webkit-user-select:none;user-select:none;touch-action:none;transform-origin:center}
.sdo-text{font:800 7.5cqw/1.15 'Work Sans',system-ui,sans-serif;max-width:86cqw;padding:1.5cqw 3cqw;border-radius:2.5cqw;text-shadow:0 1px 4px rgba(0,0,0,.55);word-wrap:break-word}
.sdo-text.box{text-shadow:none}
.sdo-emoji{font-size:17cqw;line-height:1;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.sdo-music{display:flex;align-items:center;gap:2.5cqw;padding:2cqw 4cqw 2cqw 2cqw;border-radius:4cqw;background:rgba(255,253,248,.96);color:#172531;box-shadow:0 2cqw 6cqw rgba(0,0,0,.35);max-width:80cqw}
.sdo-music img,.sdo-music .ph{width:11cqw;height:11cqw;border-radius:2.5cqw;object-fit:cover;flex-shrink:0;background:linear-gradient(135deg,#FA5C6E,#D21E3C);display:flex;align-items:center;justify-content:center;color:#fff;font-size:5cqw}
.sdo-music .t{display:flex;flex-direction:column;min-width:0;text-align:left}
.sdo-music b,.sdo-music small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sdo-music b{font-size:3.6cqw}.sdo-music small{font-size:3cqw;color:#4D6473}
.sdo-music .eq{display:flex;align-items:flex-end;gap:.6cqw;height:4cqw}
.sdo-music .eq i{width:.8cqw;height:40%;background:#2C4657;border-radius:1px;animation:eq .9s ease-in-out infinite}
.sdo-music .eq i:nth-child(2){animation-delay:.2s}.sdo-music .eq i:nth-child(3){animation-delay:.4s}
.sd-viewer.is-paused .sdo-music .eq i{animation-play-state:paused}
/* creador */
.sdc{position:fixed;inset:0;z-index:45;overscroll-behavior:contain;background:#000;color:#fff;overflow:hidden;animation:up .2s ease-out}
.sdc-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.sdo-layer.edit{pointer-events:auto}
.sdo-layer.edit .sdo{pointer-events:auto;cursor:grab}
.sdo.drag{filter:drop-shadow(0 0 0 transparent);opacity:.92}
.sdc-top{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(12px + env(safe-area-inset-top)) 12px 0;pointer-events:none}
.sdc-top>*{pointer-events:auto}
.sdc-x{width:44px;height:44px;border-radius:50%;border:none;background:rgba(0,0,0,.45);color:#fff;font-size:20px}
.sdc-tools{display:flex;flex-direction:column;gap:12px}
.sdc-tool{display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;color:#fff;padding:0}
.sdc-tool span{width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;font-family:Georgia,serif}
.sdc-tool small{font-size:11px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.sdc-bottom{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:14px 16px calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:flex-end;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.sdc-share{height:48px;padding:0 22px;border:none;border-radius:24px;background:linear-gradient(135deg,#F3BD68,#C7843B);color:#172531;font-weight:800;font-size:16px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.sdc-share:disabled{opacity:.7}
.sdc-trash{position:absolute;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) scale(.8);z-index:4;width:62px;height:62px;border-radius:50%;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.7);display:none;align-items:center;justify-content:center;font-size:28px;transition:transform .15s,background .15s}
.sdc.dragging .sdc-trash{display:flex}
.sdc.dragging .sdc-top,.sdc.dragging .sdc-bottom{opacity:0;pointer-events:none}
.sdc-trash.hot{transform:translateX(-50%) scale(1.15);background:#E2333F}
.sdc-hint{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3;width:min(86%,340px);padding:10px 14px;border-radius:14px;background:rgba(0,0,0,.6);font-size:13px;line-height:1.35;text-align:center;pointer-events:none;animation:up .3s ease-out}
.sdc-pane{position:absolute;inset:0;z-index:6;background:rgba(0,0,0,.72);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom))}
.sdc-pane-top{display:flex;justify-content:space-between;align-items:center}
.sdc-done{height:40px;padding:0 18px;border:none;border-radius:20px;background:#fff;color:#172531;font-weight:800;font-size:15px}
.sdc-mode{width:44px;height:44px;border-radius:12px;border:2px solid #fff;background:none;color:#fff;font:800 20px Georgia,serif}
.sdc-mode.on{background:#fff;color:#172531}
.sdc-ta-wrap{flex:1;display:flex;align-items:center;justify-content:center}
.sdc-ta{width:100%;max-width:440px;border:none;outline:none;resize:none;text-align:center;font:800 30px/1.2 'Work Sans',system-ui,sans-serif;padding:10px 14px;border-radius:14px;caret-color:#F3BD68;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.sdc-ta::placeholder{color:rgba(255,255,255,.6)}
.sdc-swatches{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:8px 0}
.sdc-swatches .sw{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.85);padding:0}
.sdc-swatches .sw.on{transform:scale(1.25);border-width:3px}
.sdc-sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;max-height:62%;display:flex;flex-direction:column;background:#FFFDF8;color:#172531;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom);animation:up .2s ease-out}
.sdc-sheet.tall{max-height:82%}
.sdc-sheet-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 10px 18px;border-bottom:1px solid #D9CBB0}
.sdc-sheet-head .sdc-done{background:#2C4657;color:#fff}
.sdc-sheet-body{padding:12px 14px;overflow-y:auto}
.sdc-etabs{padding:4px 10px 6px;border-bottom:1px solid #EFE6D4}
.sd-reply{gap:4px!important}.sd-reply .emo{width:34px!important;height:34px!important;font-size:24px!important;padding:0!important;min-width:0}
.sdc-emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:10px;overflow-y:auto}
.sdc-emojis button{font-size:34px;border:none;background:none;padding:6px 0;border-radius:12px}
.sdc-emojis button:active{background:#EFE6D4;transform:scale(1.2)}

/* ---------- Menú ☰ ---------- */
.sheet-bg{z-index:41}
.menu-bg{position:fixed;inset:0;z-index:35;background:rgba(23,37,49,.45);display:flex;justify-content:flex-end}
.mn-panel{width:min(100%,420px);height:100%;background:#F5EFE3;color:#172531;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.3);animation:mnin .2s ease-out}
.mn-panel.out{transform:translateX(100%);transition:transform .18s ease-in}
@keyframes mnin{from{transform:translateX(100%)}}
.mn-top{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 12px 10px 18px;background:linear-gradient(180deg,#2C4657,#172531);color:#F1E4CC}
.mn-top b{font-size:22px;font-family:Rye,Georgia,serif;color:#F3BD68}
.mn-top .iconbtn{color:#F1E4CC!important}
.mn-scroll{flex:1;overflow-y:auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
.mn-me{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #D9CBB0;border-radius:16px;background:#FFFDF8;text-align:left;box-shadow:0 2px 8px rgba(23,37,49,.06)}
.mn-me b{display:block;font-size:17px}.mn-me small{color:#4D6473;font-size:13px}
.mn-guest{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#F3BD68,#C7843B);display:flex;align-items:center;justify-content:center;font-size:28px}
.mn-h{font-size:15px;margin:18px 4px 10px;color:#4D6473}
.mn-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mn-tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border:1px solid #D9CBB0;border-radius:14px;background:#FFFDF8;text-align:left;box-shadow:0 2px 6px rgba(23,37,49,.05)}
.mn-tile b{font-size:14px}
.mn-tile:active,.mn-row:active,.mn-sec-head:active{background:#EFE6D4}
.mn-emo{font-size:26px;line-height:1}.mn-emo.sm{font-size:22px;width:38px;height:38px;border-radius:50%;background:#EFE6D4;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mn-sec{margin-top:12px;border-top:1px solid #D9CBB0}
.mn-sec-head{width:100%;display:flex;align-items:center;gap:12px;padding:12px 4px;border:none;background:none;text-align:left;font-size:16px;color:#172531}
.mn-sec-head b{flex:1}
.mn-chev{font-size:22px;color:#4D6473;transition:transform .15s;line-height:1}
.mn-sec-head.open .mn-chev{transform:rotate(180deg)}
.mn-sec-body{padding:0 0 6px}
.mn-row{width:100%;display:flex;align-items:center;gap:12px;padding:10px 8px;border:none;background:#FFFDF8;border-radius:12px;margin-bottom:6px;text-align:left;color:#172531}
.mn-row b{display:block;font-size:15px}.mn-row small{color:#4D6473;font-size:13px}
.mn-foot{text-align:center;color:#4D6473;font-size:12px;margin-top:18px}
.mn-how{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.mn-how b{font-size:15px}.mn-how p{margin:2px 0 0;color:#4D6473;font-size:14px;line-height:1.4}

/* ---------- Perfil nuevo ---------- */
.pf-hero{background:linear-gradient(180deg,#2C4657,#172531);color:#F1E4CC;text-align:center;padding:22px 14px 18px}
.pf-av{border:none;background:none;padding:0;margin:0 auto;display:block}
.pf-av .ring{width:112px;height:112px;margin:0 auto}
.pf-av{position:relative;width:112px}
.pf-av-plus{position:absolute;right:0;bottom:4px;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#F3BD68,#C7843B);color:#172531;font-size:24px;font-weight:800;line-height:31px;text-align:center;border:3px solid #1F3242;box-shadow:0 2px 8px rgba(0,0,0,.35);cursor:pointer}
.pf-hero.has-cover{padding-top:0}
.pf-cover{position:relative;height:160px;margin:0 -14px -56px;background:#33495A center/cover no-repeat;cursor:pointer}
.pf-cover::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,37,49,0) 45%,rgba(28,44,57,.95))}
.pf-cover.empty{background:repeating-linear-gradient(135deg,#2C4657 0 14px,#304C5E 14px 28px)}
.pf-cover-btn{position:absolute;right:10px;top:10px;z-index:1;background:rgba(23,37,49,.72);color:#FFF6E6;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:999px;border:1px solid rgba(243,189,104,.5)}
.pf-hero.has-cover .pf-av{z-index:1}
.at-wrap{display:flex;align-items:center;gap:0}.at-wrap span{font-weight:800;color:var(--muted);padding:0 6px 0 2px;font-size:17px}.at-wrap .input{flex:1}
.pf-hero h1{margin:10px 0 2px;font-size:23px;color:#fff}
.pf-sub{color:#F3BD68;font-size:14px}
.pf-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:14px}
.pf-stats b{display:block;font-size:20px;color:#F3BD68}.pf-stats small{display:block;font-size:11px;color:#C9D3DA;line-height:1.2}
.pf-btns{display:flex;gap:8px;padding:12px 14px}.pf-btns .btn{flex:1;height:44px;font-size:14px}
.btn.pf-gold{background:linear-gradient(135deg,#F3BD68,#C7843B)!important;color:#172531!important}
.pf-sec{padding:6px 14px 8px}.lbl{font-size:12px;font-weight:800;color:#C7843B;letter-spacing:.5px;text-transform:uppercase}
.pf-h{font-size:18px;margin:6px 2px 10px}
.pf-hls{display:flex;gap:14px;overflow-x:auto;padding:8px 2px 4px;scrollbar-width:none}
.pf-hl{border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;width:68px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pf-hl .c{width:64px;height:64px;border-radius:50%;border:2px solid #C7843B;padding:3px}
.pf-hl .c.add{border-style:dashed}
.pf-hl .c i{display:flex;width:100%;height:100%;border-radius:50%;overflow:hidden;align-items:center;justify-content:center;font-style:normal;font-size:24px;background:linear-gradient(160deg,#E9A06A,#3A2A3E)}
.pf-hl .c.add i{background:#EFE6D4;color:#172531}
.pf-hl .c img,.pf-hl .c video{width:100%;height:100%;object-fit:cover}
.pf-hl small{font-size:12px;font-weight:600;color:var(--text);max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-card{margin:8px 14px;padding:12px 14px;background:#fff;border:1px solid #D9CBB0;border-radius:16px}
.pf-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.pf-dato{display:flex;align-items:center;gap:14px;padding:7px 0;font-size:15px}
.pf-dato i{font-style:normal;font-size:20px;width:26px;text-align:center}.pf-dato small{display:block;color:#4D6473;font-size:12px}
.pf-fill{width:100%;margin:6px 0;padding:12px;border-radius:12px;border:1.5px dashed #C7843B;background:#FFF6E4;color:#172531;font-weight:700;font-size:14px}
.pf-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pf-badge{display:inline-flex;align-items:center;padding:6px 10px;border-radius:12px;background:#FFF6E4;border:1px solid #F3BD68;font-size:12px;font-weight:700}
.pf-arow{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.pf-acard{width:150px;flex-shrink:0;padding:0;background:#fff;border:1px solid #D9CBB0;border-radius:14px;overflow:hidden;text-align:left}
.pf-acard.add{border-style:dashed}
.pf-apic{height:100px;background:#EFE6D4;display:flex;align-items:center;justify-content:center;font-size:44px}
.pf-apic img{width:100%;height:100%;object-fit:cover}
.pf-atxt{padding:8px 10px}.pf-atxt b{display:block;font-size:15px}.pf-atxt small{color:#4D6473;font-size:12px}
.pf-tabs{display:flex;gap:8px;padding:10px 14px;position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:3;background:var(--bg,#F5EFE3)}
.pf-compose{margin:4px 14px 10px;background:#FFFDF8;border:1px solid #E8DCC6;border-radius:18px;padding:12px}
.pf-compose-row{display:flex;align-items:center;gap:10px}
.pf-think{flex:1;text-align:left;border:1px solid #E3D6BE;background:#F5EFE3;border-radius:22px;height:42px;padding:0 16px;font:inherit;font-size:15px;color:var(--muted);cursor:pointer}
.pf-think-ph{border:none;background:none;font-size:24px;cursor:pointer;padding:4px}
.pf-compose-acts{display:flex;gap:8px;margin-top:10px}
.pf-compose-acts button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:36px;border-radius:18px;border:1px solid #E3D6BE;background:#FFFDF8;font:inherit;font-size:13.5px;font-weight:700;color:var(--text);cursor:pointer}
.pf-compose-acts svg{width:18px;height:18px}
.pf-more{height:2px}
.pf-h2{display:flex;align-items:baseline;justify-content:space-between;padding:6px 16px 8px}.pf-h2 b{font-size:18px}.pf-h2 small{color:var(--muted)}
.pf-feed .post{margin-left:0;margin-right:0}
.pf-agrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 20px}.pf-agrid .pf-acard{width:auto}
.pf-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-height:46vh;overflow-y:auto}
.pf-pick-it{position:relative;aspect-ratio:9/16;border:none;padding:0;border-radius:8px;overflow:hidden;background:#000}
.pf-pick-it img,.pf-pick-it video{width:100%;height:100%;object-fit:cover;opacity:.85}
.pf-pick-it .ck{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;color:transparent;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.pf-pick-it.on .ck{background:#C7843B;color:#fff}.pf-pick-it.on img,.pf-pick-it.on video{opacity:1}

/* ---------- La Feria ---------- */
.fx{padding-bottom:110px}
.fx-seg{display:flex;gap:6px;margin:12px 14px;padding:4px;border-radius:16px;background:#EFE6D4}
.fx-seg button{flex:1;height:42px;border:none;border-radius:12px;background:none;font-weight:800;font-size:15px;color:#4D6473}
.fx-seg button.on{background:linear-gradient(180deg,#2C4657,#172531);color:#F3BD68;box-shadow:0 2px 8px rgba(23,37,49,.25)}
.fx-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}
.fx-card{display:flex;flex-direction:column;padding:0;border:1px solid #D9CBB0;border-radius:14px;background:#fff;overflow:hidden;text-align:left;box-shadow:0 2px 8px rgba(23,37,49,.06)}
.fx-card.sold{opacity:.65}
.fx-pic{position:relative;aspect-ratio:1;background:#EFE6D4;display:flex;align-items:center;justify-content:center;font-size:46px;overflow:hidden}
.fx-pic img{width:100%;height:100%;object-fit:cover}
.fx-feat{position:absolute;left:8px;top:8px;padding:4px 8px;border-radius:10px;background:linear-gradient(135deg,#F3BD68,#C7843B);color:#172531;font-size:11px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.fx-sold{position:absolute;right:-30px;top:16px;transform:rotate(35deg);background:#C2183A;color:#fff;font-size:11px;font-weight:800;padding:4px 36px}
.fx-info{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px}
.fx-price{font-size:17px;color:#172531}.fx-title{font-size:14px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fx-info small{color:#4D6473;font-size:12px}
.fx-fab{position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:6;height:50px;padding:0 20px;border:none;border-radius:25px;background:linear-gradient(135deg,#F3BD68,#C7843B);color:#172531;font-weight:800;font-size:15px;box-shadow:0 6px 18px rgba(23,37,49,.35)}
.fx-empty{grid-column:1/-1;text-align:center;padding:40px 20px;color:#4D6473;display:flex;flex-direction:column;gap:6px;align-items:center}
.fx-empty b{color:#172531;font-size:17px}.fx-empty-emo{font-size:52px}
.fx-detail{padding-top:0}
.fx-car-wrap{position:relative;margin:0 -16px}
.fx-car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:1;background:#000}
.fx-car img{flex:0 0 100%;width:100%;height:100%;object-fit:contain;scroll-snap-align:center}
.fx-car-ph{flex:0 0 100%;display:flex;align-items:center;justify-content:center;font-size:90px;background:#EFE6D4}
.fx-dots{position:absolute;left:0;right:0;bottom:10px;display:flex;gap:6px;justify-content:center}
.fx-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5)}.fx-dots i.on{background:#fff}
.fx-d-price{font-size:26px;font-weight:800;margin-top:12px;color:#172531}
.fx-d-title{font-size:19px;margin:2px 0 4px}
.fx-d-meta{color:#4D6473;font-size:13px}
.fx-d-desc{white-space:pre-wrap;line-height:1.45;font-size:15px;margin:12px 0}
.fx-seller{width:100%;display:flex;align-items:center;gap:12px;margin:12px 0;padding:10px 12px;border:1px solid #D9CBB0;border-radius:14px;background:#FFFDF8;text-align:left}
.fx-seller>div:not(.avatar){flex:1}.fx-seller>.avatar{flex:none!important}.fx-seller b{display:block;font-size:15px}.fx-seller small{color:#4D6473;font-size:12px;display:block}
.fx-chev{font-size:24px;color:#4D6473}
.btn.fx-gold{background:linear-gradient(135deg,#F3BD68,#C7843B)!important;color:#172531!important;width:100%}
.fx-tip{font-size:12px;color:#4D6473;background:#FFF6E4;border-radius:10px;padding:8px 10px;margin-top:12px;line-height:1.4}
.fx-ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.fx-ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#EFE6D4;border:1px solid #D9CBB0}
.fx-ph img{width:100%;height:100%;object-fit:cover}
.fx-ph button{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:13px}
.fx-ph.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px dashed #C7843B;background:#FFF6E4;color:#172531}
.fx-ph.add span{font-size:26px}.fx-ph.add small{font-size:12px;font-weight:700}
.fx-check{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;font-weight:600}
.fx-check input{width:20px;height:20px;accent-color:#2C4657}
.fx-evlist{padding:0 14px}
.fx-day{font-size:15px;margin:16px 4px 8px;color:#4D6473;text-transform:capitalize}
.fx-ev{display:flex;align-items:center;gap:12px;padding:10px;margin-bottom:8px;border:1px solid #D9CBB0;border-radius:16px;background:#fff;cursor:pointer}
.fx-ev.feat{border-color:#F3BD68;background:#FFF9EC}
.fx-date{width:54px;flex-shrink:0;text-align:center;border-radius:12px;background:linear-gradient(180deg,#2C4657,#172531);color:#F1E4CC;padding:6px 0}
.fx-date b{display:block;font-size:22px;color:#F3BD68;line-height:1.1}.fx-date small{display:block;font-size:11px;text-transform:uppercase}
.fx-ev-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fx-ev-txt b{font-size:15px;line-height:1.25}.fx-ev-txt small{color:#4D6473;font-size:12px}
.fx-going{height:38px;padding:0 14px;border-radius:19px;border:1.5px solid #2C4657;background:#fff;color:#172531;font-weight:800;font-size:14px;flex-shrink:0}
.fx-going.on{background:linear-gradient(180deg,#2C4657,#172531);color:#F3BD68;border-color:#172531}
.fx-going.sm{height:34px;padding:0 12px;font-size:13px}
.fx-gcount{color:#C7843B!important;font-weight:700}
.fx-ev-photo{width:calc(100% + 32px);margin:0 -16px;max-height:320px;object-fit:cover;display:block}
.fx-ev-banner{margin:0 -16px;height:150px;display:flex;align-items:center;justify-content:center;font-size:80px;background:linear-gradient(160deg,#E9A06A,#3A2A3E)}
.fx-ev-when{display:flex;flex-direction:column;gap:6px;margin:10px 0;font-size:15px}
.fx-ev-when a{color:#2C4657;font-weight:700;text-decoration:none}
.fx-ev-go{display:flex;align-items:center;gap:12px;margin:8px 0}
.fx-show{margin:4px 14px 10px;padding:12px;border:1px solid #D9CBB0;border-radius:18px;background:#fff;box-shadow:0 2px 8px rgba(23,37,49,.06)}
.fx-show-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.fx-show-head b{font-size:16px}.fx-show-head .linkbtn{color:#C7843B!important;font-weight:700;font-size:14px}
.fx-next{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:10px;border:none;border-radius:12px;background:linear-gradient(180deg,#2C4657,#172531);color:#F1E4CC;text-align:left}
.fx-next div{flex:1;min-width:0}.fx-next small{display:block;font-size:12px;color:#F3BD68}.fx-next b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-next-emo{font-size:26px}.fx-next .fx-chev{color:#F1E4CC}
.fx-show-row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.fx-mini{width:112px;flex-shrink:0;padding:0;border:none;background:none;text-align:left;display:flex;flex-direction:column;gap:2px}
.fx-mini .fx-pic{border-radius:12px;font-size:36px}.fx-mini b{font-size:14px;margin-top:4px}
.fx-mini small{font-size:12px;color:#4D6473;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-mini .fx-feat{padding:2px 6px;font-size:11px}
.fx-sell-cta{display:block;width:100%;margin-top:10px;padding:11px 12px;border:1.5px dashed #C7843B;border-radius:12px;background:#FFF6E4;color:#172531;font-weight:700;font-size:14px;text-align:left}
@media (max-width:350px){.topbar .logo{font-size:24px!important}}
.rules-links{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.rules-links a{display:block;padding:12px 14px;border:1px solid #D9CBB0;border-radius:12px;background:#FFFDF8;color:#172531;font-weight:700;text-decoration:none}
.sheet .btn.danger-btn,.btn.danger-btn{width:100%;background:#B3261E!important;background-image:none!important;color:#fff!important;border-color:#B3261E!important;box-shadow:0 3px 0 #7a1a14!important}
.btn.danger-btn::before,.btn.danger-btn::after{border-color:rgba(255,255,255,.45)!important}
.danger-btn:disabled{opacity:.45}
/* ---------- Verificada ---------- */
.vbadge{display:inline-flex;align-items:center;justify-content:center;width:1.05em;height:1.05em;margin-left:.3em;border-radius:50%;background:#C7843B;color:#fff!important;font-size:.72em;font-weight:900;line-height:1;vertical-align:.08em;box-shadow:0 0 0 1.5px #F3BD68 inset;font-family:Inter,sans-serif}
/* ---------- Aviso push ---------- */
.push-card{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:12px 16px 0;padding:12px 14px;border-radius:16px;background:#FFF6E4;border:1px solid #F3BD68}
.push-card .push-emo{font-size:26px}
.push-card>div:nth-child(2){flex:1;min-width:180px;display:flex;flex-direction:column;gap:2px}
.push-card small{color:var(--muted)}
.push-card .push-btns{display:flex;gap:8px;width:100%;justify-content:flex-end}
/* ---------- Reacciones ---------- */
.r-emo{display:inline-flex;align-items:center;justify-content:center;font-size:26px;line-height:1}
.r-horse{display:inline-flex}
.r-emo.big{font-size:28px;width:32px;height:32px}
.reacted .r-emo.big{animation:rpop .35s ease-out}
@keyframes rpop{0%{transform:scale(.5)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.r-emo.mini{font-size:15px;width:20px;height:20px;border-radius:50%;background:#FFFDF8;box-shadow:0 0 0 2px #FFFDF8}
.r-horse.mini .horse{width:20px;height:20px;border-radius:50%;background-color:#FFFDF8;box-shadow:0 0 0 2px #FFFDF8}
.r-stack{display:inline-flex;margin-right:6px;vertical-align:middle}
.r-stack>*+*{margin-left:-5px}
.react-count{display:inline-flex;align-items:center;color:var(--soft);font-weight:600}
.react-pick-bg{position:fixed;inset:0;z-index:60;-webkit-user-select:none;user-select:none}
.react-pick{position:fixed;display:flex;gap:2px;padding:6px 8px;border-radius:32px;background:#FFFDF8;border:1px solid #E2CFAF;box-shadow:0 10px 30px rgba(60,25,8,.3);animation:sdpop2 .2s ease-out}
@keyframes sdpop2{from{transform:translateY(10px) scale(.9);opacity:0}}
.react-pick .rp{position:relative;display:flex;flex-direction:column;align-items:center;border:none;background:none;padding:2px 3px;border-radius:14px;animation:rpin .3s ease-out both}
@keyframes rpin{from{transform:translateY(14px) scale(.5);opacity:0}}
.react-pick .rp .r-emo,.react-pick .rp .horse{width:42px;height:42px;font-size:34px;transition:transform .15s}
.react-pick .rp:hover .r-emo,.react-pick .rp:hover .horse,.react-pick .rp:active .r-emo,.react-pick .rp:active .horse{transform:scale(1.3) translateY(-6px)}
.react-pick .rp small{font-size:9px;font-weight:700;color:#7A5A44;white-space:nowrap;margin-top:1px}
.react-pick .rp.on{background:#F3E6CC}
.av-react{position:relative;display:inline-flex;flex-shrink:0}
.av-react .badge,.av-react .n-badge{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;font-size:14px;border-radius:50%;background:#FFFDF8;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #FFFDF8}
.av-react .r-horse.badge .horse{width:22px;height:22px}
/* ---------- Compartir ---------- */
.share-opt{width:100%;display:flex;align-items:center;gap:14px;padding:12px 6px;border:none;background:none;text-align:left;border-radius:14px}
.share-opt:active{background:var(--surface)}
.share-opt .so-ico{width:46px;height:46px;border-radius:50%;background:linear-gradient(180deg,#FFFDF8,#F3E6CC);border:1px solid #E2CFAF;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.share-opt b{display:block;font-size:15px}.share-opt small{color:var(--muted);font-size:13px}
.share-prev{display:flex;align-items:center;gap:10px;margin-bottom:10px;color:var(--soft);font-size:14px}
.shared-note{display:flex;align-items:center;gap:6px;padding:0 14px 8px;font-size:13px;color:var(--soft)}
.shared-note .linkbtn{font-size:13px;font-weight:700;color:var(--text)}
.shared-cap{margin:8px 14px 0;padding:8px 12px;border-left:3px solid #CFAE73;background:#FFFDF8;border-radius:0 10px 10px 0;font-size:14px;color:var(--soft)}
.msg{position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.msg.has-rx{margin-bottom:14px}
.msg-rx{position:absolute;bottom:-14px;display:inline-flex;align-items:center;gap:1px;height:24px;padding:0 6px;border-radius:12px;border:none;background:#FFFDF8;box-shadow:0 1px 4px rgba(60,25,8,.3);z-index:1}
.msg.them .msg-rx{right:-6px}.msg.me .msg-rx{left:-6px}
.msg-rx .r-emo.mini{box-shadow:none;background:none;font-size:14px;width:18px;height:18px}
.msg-rx .r-horse.mini .horse{width:18px;height:18px;box-shadow:none}
.msg-rx .rx-n{font-size:11px;font-weight:700;color:#7A5A44;margin-left:2px}
.msg-rx-add{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:1px solid #E2CFAF;background:#FFFDF8;color:#8B4A22;font-size:17px;line-height:1;padding:0;box-shadow:0 1px 4px rgba(60,25,8,.2)}
.msg.them .msg-rx-add{right:-40px}.msg.me .msg-rx-add{left:-40px}
.msg.rx-pop{animation:rxpop .35s ease-out}
@keyframes rxpop{50%{transform:scale(1.04)}}
.msg-post{display:block;margin-top:8px;padding:8px 12px;border-radius:12px;border:1px solid rgba(0,0,0,.12);background:rgba(255,253,248,.9);color:#3B2314;font-weight:700;font-size:14px}
/* ---------- Notificaciones ---------- */
.top-actions{display:flex;align-items:center;gap:6px}
.notif-list{padding-bottom:20px}
.n-group{margin:16px 16px 6px;font-size:15px;color:var(--soft)}
.notif{width:100%;display:flex;align-items:center;gap:12px;padding:10px 16px;border:none;background:none;text-align:left}
.notif.new{background:#FBF0D8}
.notif:active{background:var(--surface)}
.n-txt{flex:1;min-width:0}
.n-txt p{margin:0;font-size:14px;line-height:1.35;color:var(--text)}
.n-txt small{color:var(--muted);font-size:12px}
.n-quote{color:var(--soft)}
.n-thumb{width:48px;height:48px;border-radius:8px;overflow:hidden;flex-shrink:0;background:#E2CFAF}
.n-thumb img,.n-thumb video{width:100%;height:100%;object-fit:cover;display:block}
/* ---------- Visto por ---------- */
.sd-own{justify-content:flex-start}
.sd-seen{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:20px;border:none;background:rgba(0,0,0,.4);color:#fff;font-weight:700;font-size:14px}
.sd-views{position:absolute;left:0;right:0;bottom:0;z-index:7;max-height:62%;display:flex;flex-direction:column;background:#FFFDF8;color:var(--text);border-radius:20px 20px 0 0;animation:up .2s ease-out;padding-bottom:env(safe-area-inset-bottom)}
.sd-views-head{display:flex;align-items:center;justify-content:space-between;padding:12px 10px 6px 18px;border-bottom:1px solid #E2CFAF}
.sd-views-list{overflow-y:auto}
/* ---------- Mensajes ---------- */
.dm-btn{position:relative;color:var(--text)}
.dm-badge{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#E8172E;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.inbox-row{width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:none;text-align:left}
.inbox-row:active{background:var(--surface)}
.inbox-row .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.inbox-row .who b{font-size:15px}
.inbox-row .who span{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inbox-row.unread .who span{color:var(--text);font-weight:600}
.inbox-row small{color:var(--muted);font-size:12px;flex-shrink:0}
.inbox-dot{width:10px;height:10px;border-radius:50%;background:var(--grad);box-shadow:0 0 8px rgba(255,122,26,.6);flex-shrink:0}
.dm-empty{text-align:center;padding:50px 30px;color:var(--muted);line-height:1.5}
.dm-empty b{display:block;color:var(--text);font-size:17px;margin:10px 0 4px}
.chat-head{gap:6px;justify-content:flex-start}
.chat-head .who{display:flex;align-items:center;gap:10px;border:none;background:none;padding:0;font-weight:700;font-size:16px;min-width:0}
.chat{flex:1;display:flex;flex-direction:column;gap:4px;padding:14px 12px calc(86px + env(safe-area-inset-bottom))}
.msg{max-width:78%;padding:9px 14px;border-radius:20px;font-size:15px;line-height:1.38;white-space:pre-wrap;word-wrap:break-word}
.msg.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--grad);color:var(--ink);border-bottom-right-radius:6px}
.msg.pending{opacity:.6}
.msg-time{align-self:center;color:var(--muted);font-size:12px;margin:10px 0 4px}
.msg-seen{align-self:flex-end;color:var(--muted);font-size:12px;margin:2px 4px 0}
.composer{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.96);border-top:var(--stitch);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.composer form{max-width:520px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.composer textarea{flex:1;min-height:46px;max-height:130px;resize:none;border-radius:23px;padding:12px 16px;line-height:1.3}
.composer .send{width:46px;height:46px;border-radius:23px;border:none;background:var(--grad);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:var(--glow);flex-shrink:0}
.composer .send:disabled{opacity:.5}
.song-chip{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:5px 12px 5px 5px;border-radius:22px;border:1px solid #D6BC93;background:linear-gradient(180deg,#FFFDF8,#F3E6CC);color:#3B2314;font-size:13px;font-weight:600;text-align:left;box-shadow:0 2px 6px rgba(90,45,15,.12)}
.song-chip img,.song-chip .song-sp{width:30px;height:30px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#6A3415;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;animation:spin 6s linear infinite}
.song-chip .song-sp{background:#1DB954}
.song-chip .song-note{font-size:13px}
.song-chip .song-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.song-chip.dark{background:rgba(20,8,2,.55);border-color:rgba(247,226,186,.45);color:#FBF0D8;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-shadow:none}
.song-prev{margin-top:4px}
.song-cut{margin-top:10px;padding:10px 12px;border-radius:14px;background:#FFFDF8;border:1px solid #E2CFAF}
.song-cut-top{display:flex;align-items:center;gap:6px;font-size:14px}
.song-cut-help{display:flex;align-items:center;justify-content:space-between;gap:8px}
.song-cut-help small{color:var(--muted)}
.song-range{width:100%;margin:10px 0 6px;accent-color:#8B4A22;height:28px}
.ring>div.sd-thumb-wrap{position:relative;overflow:visible;background:#2B160A}
.sd-thumb-wrap .sd-thumb{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.sd-mini{position:absolute;left:-4px;bottom:-4px;border-radius:50%;border:2px solid var(--bg);display:flex;overflow:hidden;max-width:none!important}
.song-picked{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.song-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.song-row{display:flex;align-items:center;gap:10px;padding:6px;border-radius:14px;background:#FFFDF8;border:1px solid #E2CFAF;cursor:pointer}
.song-row:active{background:#F3E6CC}
.song-row img{width:46px;height:46px;border-radius:8px;object-fit:cover;flex-shrink:0;background:#E2CFAF}
.song-row .who{flex:1;min-width:0;display:flex;flex-direction:column}
.song-row .who b,.song-row .who small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song-row .who small{color:var(--muted)}
.song-play{width:38px;height:38px;border-radius:19px;border:1px solid #CFAE73;background:linear-gradient(135deg,#FBF0D8,#EBD3A6);color:#3B2314;font-size:14px;flex-shrink:0}
.song-play.playing{background:#6A3415;color:#FBF0D8}
.song-chip .song-eq{display:none;align-items:flex-end;gap:2px;height:14px}
.song-chip .song-eq i{display:block;width:3px;height:40%;background:currentColor;border-radius:2px}
.song-chip.playing .song-eq{display:inline-flex}
.song-chip .song-pl{font-size:11px;opacity:.8}
.song-chip.playing .song-pl{display:none}
.song-chip.playing .song-eq i{animation:eq .9s ease-in-out infinite}
.song-chip.playing .song-eq i:nth-child(2){animation-delay:.2s}.song-chip.playing .song-eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:30%}50%{height:100%}}
.song-chip:not(.playing) img{animation-play-state:paused}
.song-chip .song-sp.am{background:linear-gradient(135deg,#FA5C6E,#D21E3C)}
.song-body{padding:12px 12px 20px}
.song-frame{width:100%;aspect-ratio:16/9;border:0;border-radius:14px;background:#000;display:block}
.song-frame.sp{aspect-ratio:auto;height:152px;background:transparent}
.yt-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:8px;padding:10px 12px;border-radius:14px;border:1px solid #D6BC93;background:#FFFDF8;color:#3B2314;font-weight:700;font-size:14px}
.yt-btn .yt-logo{display:inline-flex;align-items:center;justify-content:center;width:26px;height:18px;border-radius:5px;background:#FF0000;color:#fff;font-size:10px}
.song-row img.yt{width:64px;height:46px}
.yt-prev{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000;display:block;margin-top:10px}
.sd-yt{position:absolute;left:0;top:0;width:200px;z-index:4;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 6px 18px rgba(0,0,0,.5);transition:transform .25s ease;will-change:transform}
.sd-yt.dragging{transition:none;box-shadow:0 10px 28px rgba(0,0,0,.6)}
.sd-yt iframe{width:200px;height:200px;border:0;display:block}
.sd-yt-grip{height:22px;display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(30,16,8,.92);color:#FBF0D8;font-size:11px;font-weight:600;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
.sd-yt-grip i{width:28px;height:4px;border-radius:2px;background:rgba(251,240,216,.7)}
.sd-song{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:5px 12px;border-radius:20px;background:rgba(0,0,0,.45);font-size:13px;font-weight:600}
.sd-song span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.join{text-align:center;padding:10px 20px 22px}
.join .join-ico{display:flex;justify-content:center;color:var(--text)}
.join b{display:block;font-size:18px;margin:8px 0 6px}
.join p{color:var(--muted);margin:0 0 16px;line-height:1.45}
.composer .attach{width:46px;height:46px;border-radius:23px;border:1px solid var(--line);background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.composer .attach svg{width:24px;height:24px}
.msg.hasmedia{padding:4px;overflow:visible;max-width:72%}
.msg.hasmedia img,.msg.hasmedia video{display:block;width:100%;height:auto;max-height:340px;object-fit:cover;border-radius:16px;background:#000}
.msg.hasmedia img{cursor:zoom-in}
.msg.hasmedia p{margin:6px 10px 4px}
.msg-media-ph{width:200px;height:150px;border-radius:16px;background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.msg-up{display:block;font-size:12px;margin:4px 10px 2px;opacity:.8}
.mv{position:fixed;inset:0;z-index:40;background:rgba(10,4,4,.94);display:flex;align-items:center;justify-content:center;padding:20px}
.mv img,.mv video{max-width:100%;max-height:100%;border-radius:10px}
.mv-x{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;color:#fff}
@media (prefers-reduced-motion:reduce){*:not(.horse){animation:none!important;transition:none!important}}
/* ---------- Tema: Cuero ---------- */

.topbar{background:linear-gradient(180deg,#8B4A22,#6A3415);border-bottom:none;box-shadow:0 4px 14px rgba(70,30,10,.3);outline:1.5px dashed rgba(247,230,196,.45);outline-offset:-6px}
.topbar .logo{background:linear-gradient(180deg,#FFE3A3,#F2B24C);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.topbar b,.topbar .iconbtn.plain{color:#F7E6C4}
.topbar .iconbtn{background:rgba(247,230,196,.15);border-color:rgba(247,230,196,.4);color:#F7E6C4}
.logo{background:linear-gradient(180deg,#B5652E,#6A3415);-webkit-background-clip:text;background-clip:text;color:transparent;filter:none}
.post,.welcome-card,.sheet,.auth form{background:#FFFDF8;border:1px solid #E2CFAF;box-shadow:0 4px 14px rgba(90,45,15,.12)}
.post-head{background:linear-gradient(180deg,#F3E3C6,#EAD3AC);margin:0;border-bottom:1.5px dashed rgba(139,74,34,.35)}
.btn{background:linear-gradient(180deg,#A0582A,#7A3E1C);color:#FFF4DE;box-shadow:0 3px 0 #4E2410;outline:1.5px dashed rgba(255,244,222,.45);outline-offset:-6px}
.btn.ghost{background:#FFFDF8;color:var(--text);border:1.5px solid #A0582A;outline:none;box-shadow:none}
.chip{background:#FFFDF8;border-color:#E2CFAF}
.chip.on{background:linear-gradient(180deg,#A0582A,#7A3E1C);color:#FFF4DE;box-shadow:none}
.tag{background:linear-gradient(120deg,#F6C445 0%,#EE8A2A 45%,#C9362A 100%);color:#2B160A}
.nav-in{background:linear-gradient(180deg,#8B4A22,#6A3415);border:none;box-shadow:0 8px 24px rgba(60,28,10,.35);outline:1.5px dashed rgba(247,230,196,.4);outline-offset:-5px}
.nav button{color:rgba(247,230,196,.7)}
.nav button.on{color:#FFE3A3}
.nav .plus{background:linear-gradient(120deg,#F6C445 0%,#EE8A2A 45%,#C9362A 100%);color:#2B160A}
.auth::before{background:radial-gradient(60% 40% at 50% 0%,rgba(238,138,42,.45),transparent 70%);animation:none}

function ytMini(id, start, host) {
  const KEY = 'herria_yt_corner';
  const grip = h('div', { class: 'sd-yt-grip', 'aria-label': 'Arrastra el video a otra esquina' }, h('i'), 'mover', h('i'));
  const box = h('div', { class: 'sd-yt' }, grip, ytFrame(id, start));

  const spots = () => {
    const r = host.getBoundingClientRect();
    const bar = host.querySelector('.sd-top'), cap = host.querySelector('.sd-cap');
    const top = (bar ? bar.offsetHeight - 8 : 76), bottom = Math.max(top, r.height - H - (cap && cap.style.display !== 'none' ? cap.offsetHeight : 20));
    return { tl: [M, top], tr: [r.width - W - M, top], bl: [M, bottom], br: [r.width - W - M, bottom] };
  };
  let corner = 'tr'; try { corner = localStorage.getItem(KEY) || 'tr'; } catch (_) {}
  let x = 0, y = 0;
  const place = (c) => { const sp = spots(); [x, y] = sp[c] || sp.tr; box.style.transform = `translate(${x}px,${y}px)`; };
  place(corner);
  let sx, sy, ox, oy, moving = false;
  grip.addEventListener('pointerdown', (e) => { e.stopPropagation(); moving = true; sx = e.clientX; sy = e.clientY; ox = x; oy = y; box.classList.add('dragging'); grip.setPointerCapture(e.pointerId); });

    box.style.transform = `translate(${x}px,${y}px)`;
  });
  const end = (e) => {
    if (!moving) return; moving = false; e.stopPropagation(); box.classList.remove('dragging');
    const sp = spots(); let best = 'tr', bd = Infinity;
    for (const k in sp) { const d = Math.hypot(sp[k][0] - x, sp[k][1] - y); if (d < bd) { bd = d; best = k; } }

async function fetchPosts({ category, userId, userIds, tag, text, kinds = ['post', 'ride'], since, animalId, before, limit = 60, exclude } = {}) {
  const build = () => {
    let q = sb.from('posts').select(postSelect()).order('created_at', { ascending: false }).limit(limit);
    if (before) q = q.lt('created_at', before);
    if (exclude) q = q.neq('id', exclude);
    if (category && category !== 'Todo') q = q.eq('category', category);
    if (userId) q = q.eq('user_id', userId);
    if (userIds) q = q.in('user_id', userIds.slice(0, 300));
    if (text) q = q.ilike('caption', '%' + String(text).replace(/[%,()_\\]/g, '') + '%');
    if (tag) q = q.ilike('caption', '%#' + String(tag).replace(/[%,()_\\]/g, '') + '%');
    if (since) q = q.gte('created_at', since);
    if (animalId) q = q.eq('animal_id', animalId);
    if (HAS_KIND) q = q.in('kind', kinds);

    if (!HAS_KIND && !kinds.includes('post')) return [];
    if (!HAS_ANIMALS && animalId) return [];

// Caché en el teléfono: cuando terminas de ver un video, se guarda para que la próxima vez no gaste datos
const KEPT = new Set();
function keepWhenWatched(v, url) {
  if (!url || !('serviceWorker' in navigator)) return;
  const keep = () => {
    if (KEPT.has(url) || !(v.duration > 0) || v.currentTime < v.duration * 0.8) return;
    if (isHQ(url) && slowNet()) return;   // la HD pesa mucho para volverla a bajar con datos
    KEPT.add(url);
    navigator.serviceWorker.ready.then(r => r.active && r.active.postMessage({ type: 'rf-keep', url })).catch(() => {});
  };
  v.addEventListener('timeupdate', keep);
  v.addEventListener('ended', keep);
}
// Scroll infinito para listas: un "sensor" al final que pide más cuando te vas acercando
function infiniteList(list, cursor, loadMore) {
  const sensor = h('div', { class: 'more-sensor' }, h('div', { class: 'spinner', style: 'margin:18px auto' }));
  list.append(sensor);
  let busy = false;
  const io = new IntersectionObserver(async (es) => {
    if (busy || !es.some(e => e.isIntersecting) || !document.body.contains(sensor)) return;
    busy = true;
    try { cursor = await loadMore(cursor); } catch (_) { cursor = cursor; }
    busy = false;
    if (!cursor) { io.disconnect(); sensor.remove(); }
    else { io.unobserve(sensor); io.observe(sensor); }   // si sigue a la vista, que pida otra tanda
  }, { rootMargin: '1200px 0px' });
  io.observe(sensor);
}

async function deletePost(p) {
  if (!confirm('¿Borrar esta publicación?')) return false;
  const { error } = await sb.from('posts').delete().eq('id', p.id);
  if (error) { toast('No se pudo borrar'); return false; }
  const path = !p.shared_id && p.media_url.split('/media/')[1];   // un compartido no borra la foto original
  if (path) sb.storage.from('media').remove(withVariants(decodeURIComponent(path)));
  toast('Borrado');
  return true;
}

  if (res.error) {

async function makeCollage(files) {
  const W = 1080, H = 1920, G = 14, R = 26;
  const LAYOUT = { 2: [1, 1], 3: [1, 2], 4: [2, 2], 5: [2, 1, 2], 6: [2, 2, 2] }[files.length] || [1];
