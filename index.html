<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yeehaw">
<title>Yeehaw</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#FFFFFF; --surface:#FFF6EE; --surface2:#FFFFFF; --line:#F1DED2;
  --text:#2A0E0F; --soft:#4E2E27; --muted:#8C6A5D;
  --accent:#FF3347; --gold:#FFD23F; --teal:#FFD23F; --ink:#1A0608;
  --grad:linear-gradient(120deg,#FFD23F 0%,#FF7A1A 50%,#E8172E 100%);
  --ring:repeating-conic-gradient(from 0deg,#FFD23F 0deg 12deg,#E8172E 12deg 24deg);
  --glow:0 8px 22px rgba(255,90,26,.32);
  --stitch:1.5px dashed rgba(232,120,26,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Work Sans',system-ui,sans-serif;font-size:15px}
body{background:var(--bg)}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;transition:transform .12s ease}
button:active{transform:scale(.94)}
a{color:var(--accent)}
img,video{display:block;max-width:100%}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.logo{font-family:Rye,serif;font-size:30px;letter-spacing:.5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 12px rgba(255,122,26,.45))}
.topbar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.9);border-bottom:var(--stitch);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;padding:0}
.iconbtn.plain{border:none;background:none}
main{flex:1;padding-bottom:calc(104px + env(safe-area-inset-bottom))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 14px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
.nav-in{pointer-events:auto;max-width:492px;margin:0 auto;display:flex;justify-content:space-around;align-items:center;padding:6px 8px;border-radius:28px;background:rgba(255,255,255,.94);backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);border:1px solid var(--line);box-shadow:0 8px 28px rgba(120,40,20,.16)}
.nav button{border:none;background:none;width:58px;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.nav button.on{color:var(--text)}
.nav button.on svg{stroke:url(#g);filter:drop-shadow(0 0 8px rgba(255,122,26,.7))}
.nav button.on::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.nav .plus{width:60px;height:46px;border-radius:16px;background:var(--grad);color:var(--ink);box-shadow:var(--glow);outline:var(--stitch);outline-color:rgba(26,6,8,.45);outline-offset:-5px}
.stories{display:flex;gap:14px;overflow-x:auto;padding:10px 16px 16px;scrollbar-width:none}
.stories::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.story{border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;flex-shrink:0}
.story span{font-size:12px;font-weight:500;color:var(--soft);max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{position:relative;width:70px;height:70px;border-radius:50%;padding:3px;background:var(--line)}
.ring.new{background:none}
.ring.new::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--ring);animation:spin 4s linear infinite;box-shadow:0 0 16px rgba(255,122,26,.45)}
.ring>div{position:relative;width:100%;height:100%;border-radius:50%;border:3px solid var(--bg);overflow:hidden}
.avatar{border-radius:50%;background:var(--grad);color:var(--ink);font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 16px;scrollbar-width:none}
.chip{flex-shrink:0;height:38px;padding:0 18px;border-radius:19px;border:1px solid var(--line);background:var(--surface);color:var(--soft);font-weight:600;font-size:14px}
.chip.on{background:var(--grad);border-color:transparent;color:var(--ink);box-shadow:0 4px 16px rgba(255,122,26,.35)}
.post{margin:0 10px 22px;border-radius:24px;background:#FFFFFF;border:1px solid var(--line);overflow:hidden;box-shadow:0 6px 22px rgba(120,40,20,.10)}
.post-head{display:flex;align-items:center;gap:10px;padding:12px 12px 10px;border-bottom:var(--stitch);margin:0 8px 0}
.post-head .who{flex:1;min-width:0;border:none;background:none;padding:0;text-align:left;display:flex;flex-direction:column}
.post-head b{font-size:15px}
.post-head small{color:var(--muted);font-size:13px}
.tag{font-size:12px;font-weight:700;color:var(--ink);background:var(--grad);padding:5px 11px;border-radius:12px}
.media{position:relative;background:#000;width:100%;aspect-ratio:4/5;overflow:hidden;user-select:none;-webkit-user-select:none}
.media img,.media video{width:100%;height:100%;object-fit:cover}
.burst{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0}
.burst.go{animation:burst .9s ease-out}
.burst b{font-family:Rye,serif;font-size:42px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 14px rgba(0,0,0,.7))}
@keyframes burst{0%{opacity:0;transform:scale(.4) rotate(-8deg)}20%{opacity:1;transform:scale(1.2) rotate(4deg)}40%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:scale(1.05) translateY(-18px)}}
.actions{display:flex;align-items:center;padding:6px 6px 0}
.actions .count{margin-left:auto;padding-right:10px;font-weight:700;font-size:14px}
.liked{color:var(--accent)}
.liked svg{fill:var(--accent);filter:drop-shadow(0 0 8px rgba(232,23,46,.8))}
.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{50%{transform:scale(1.4)}}
.caption{margin:2px 16px 0;font-size:14px;line-height:1.45;color:var(--soft);white-space:pre-wrap;word-wrap:break-word}
.caption b{color:var(--text)}
.meta{margin:6px 16px 14px;color:var(--muted);font-size:13px}
.linkbtn{border:none;background:none;padding:0;color:var(--muted);font-size:13px}
.shop{margin:12px 12px 4px;padding:12px;border-radius:18px;background:linear-gradient(135deg,rgba(255,122,26,.12),rgba(255,210,63,.12));border:var(--stitch)}
.shop h4{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.shop h4 small{font-weight:400;color:var(--muted);font-size:11px}
.shop-items{display:flex;gap:8px;overflow-x:auto}
.shop-item{flex-shrink:0;min-width:110px;padding:12px;border-radius:14px;background:#FFFFFF;border:1px solid var(--line);text-decoration:none;color:var(--text);display:flex;flex-direction:column;gap:4px}
.shop-item span{color:#D0451B;font-size:13px;font-weight:700}
.empty{text-align:center;padding:60px 30px;color:var(--muted);line-height:1.5}
.empty .logo{display:block;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:0 4px}
.tile{position:relative;aspect-ratio:3/4;background:var(--surface);border:none;padding:0;overflow:hidden;border-radius:10px}
.tile img,.tile video{width:100%;height:100%;object-fit:cover}
.tile .play{position:absolute;top:6px;right:6px;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))}
.page{padding-left:16px;padding-right:16px}
.page form{padding-bottom:24px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--soft)}
.input{width:100%;min-height:50px;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
.input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(255,122,26,.25)}
textarea.input{min-height:90px;resize:vertical}
.btn{width:100%;height:52px;border-radius:26px;border:none;background:var(--grad);color:var(--ink);font-weight:700;font-size:16px;box-shadow:var(--glow)}
.btn:disabled{opacity:.55}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--text);box-shadow:none}
.btn.small{width:auto;height:42px;padding:0 20px;font-size:14px}
.err{color:#C2183A;font-size:14px;margin:0 0 12px;min-height:1px}
.ok{color:#1E8A4C;font-size:14px;margin:0 0 12px}
.picker{width:100%;aspect-ratio:4/5;border-radius:22px;border:2px dashed rgba(255,210,63,.55);background:linear-gradient(135deg,rgba(255,122,26,.08),rgba(255,210,63,.1));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);overflow:hidden;padding:0;margin-bottom:14px}
.picker img,.picker video{width:100%;height:100%;object-fit:cover}
.auth{flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 22px calc(30px + env(safe-area-inset-bottom));position:relative;isolation:isolate}
.auth::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 30% at 20% 20%,rgba(255,122,26,.35),transparent 70%),radial-gradient(40% 30% at 80% 30%,rgba(255,210,63,.3),transparent 70%),radial-gradient(45% 35% at 50% 85%,rgba(232,23,46,.22),transparent 70%);filter:blur(30px);animation:float 12s ease-in-out infinite alternate}
@keyframes float{to{transform:translate(4%,-3%) rotate(8deg)}}
.auth .logo{font-size:60px;text-align:center}
.auth form{padding:20px 18px;border-radius:24px;background:rgba(255,255,255,.85);border:var(--stitch);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.auth p.lead{text-align:center;color:var(--soft);margin:6px 0 30px}
.switch{text-align:center;margin-top:18px;color:var(--muted);font-size:14px}
.switch button{border:none;background:none;color:#D0451B;font-weight:700;padding:8px}
.prof-head{display:flex;align-items:center;gap:18px;padding:6px 16px 14px}
.prof-head .ring{background:var(--ring)}
.stats{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));text-align:center;gap:8px}
.stats>div{padding:10px 4px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.stats b{display:block;font-size:20px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats span{font-size:12px;color:var(--muted)}
.prof-info{padding:0 16px 14px}
.prof-info b{font-size:18px}
.prof-info div{color:var(--muted);font-size:14px;margin-top:2px}
.prof-btns{display:flex;gap:8px;padding:0 16px 16px}
.prof-btns .btn{height:42px;font-size:14px}
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(40,10,5,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:85vh;max-height:85dvh;background:var(--surface2);border-radius:26px 26px 0 0;border:1px solid var(--line);display:flex;flex-direction:column;animation:up .25s cubic-bezier(.2,1,.3,1)}
.sheet .post{margin:0 0 10px;box-shadow:none}
@keyframes up{from{transform:translateY(60px);opacity:.3}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 6px 18px;border-bottom:1px solid var(--line)}
.sheet-head b{font-size:16px}
.sheet-body{overflow-y:auto;padding:12px 16px;flex:1}
.sheet-foot{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.cmt{display:flex;gap:10px;margin-bottom:14px}
.cmt p{margin:0;font-size:14px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;color:var(--soft)}
.cmt p b{color:var(--text)}
.cmt small{color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--grad);color:var(--ink);padding:11px 20px;border-radius:22px;font-weight:700;font-size:14px;z-index:30;max-width:90vw;text-align:center;box-shadow:var(--glow);animation:up .25s ease-out}
.spinner{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--teal);border-right-color:var(--gold);animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.row{display:flex;gap:8px}
.row .input{flex:1;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- Sundowns ---- */
.sd-add{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;background:var(--grad);color:var(--ink);border:3px solid var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;line-height:1}
.ring.seen{background:#E6D2C7}
.ring.blank{background:none;border:2px dashed rgba(255,210,63,.55);padding:1px}
.story .sd-add{max-width:none;overflow:visible;color:var(--ink)}
.kinds svg{width:20px;height:20px}
.sd-viewer{color:#fff;position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;animation:up .2s ease-out}
.sd-in{position:relative;flex:1;max-width:520px;width:100%;margin:0 auto;display:flex;align-items:center;justify-content:center;overflow:hidden}
.sd-in img,.sd-in video{width:100%;height:100%;object-fit:contain}
.sd-top{position:absolute;left:0;right:0;top:0;z-index:3;padding:calc(10px + env(safe-area-inset-top)) 10px 18px;background:linear-gradient(rgba(0,0,0,.65),transparent)}
.sd-bars{display:flex;gap:4px;margin-bottom:10px}
.sd-bar{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.sd-bar i{display:block;height:100%;width:0;background:var(--grad)}
.sd-head{display:flex;align-items:center;gap:10px}
.sd-head b{font-size:15px}
.sd-head small{color:rgba(255,255,255,.75);font-size:13px}
.sd-head .sp{flex:1}
.sd-zone{position:absolute;top:80px;bottom:90px;z-index:2;border:none;background:none;padding:0}
.sd-zone.prev{left:0;width:33%}
.sd-zone.next{right:0;width:67%}
.sd-cap{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:24px 18px calc(22px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.7));font-size:15px;line-height:1.4;text-align:center;white-space:pre-wrap;word-wrap:break-word}
.sd-label{display:inline-flex;align-items:center;gap:6px;font-family:Rye,serif;font-size:13px;color:var(--gold)}
/* ---- Rides ---- */
.rides{color:#fff;position:fixed;top:0;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;overflow-y:auto;scroll-snap-type:y mandatory;background:#000;scrollbar-width:none;z-index:1}
.rides::-webkit-scrollbar{display:none}
.rides-top{color:#fff;position:fixed;top:0;left:0;right:0;max-width:520px;margin:0 auto;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:linear-gradient(rgba(0,0,0,.55),transparent);pointer-events:none}
.rides-top>*{pointer-events:auto}
.ride{position:relative;height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#000}
.ride video{width:100%;height:100%;object-fit:cover}
.ride .burst{z-index:2}
.ride-info{position:absolute;left:0;right:76px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:3;padding:0 14px;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.ride-info .who{display:flex;align-items:center;gap:10px;border:none;background:none;padding:0;margin-bottom:8px;text-align:left}
.ride-info .who b{font-size:16px}
.ride-info p{margin:0 0 8px;font-size:14px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.ride::after{content:"";position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.65));pointer-events:none;z-index:1}
.ride-side{position:absolute;right:6px;bottom:calc(100px + env(safe-area-inset-bottom));z-index:3;display:flex;flex-direction:column;align-items:center;gap:6px}
.ride-side .iconbtn{width:52px;height:52px;border-radius:26px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15);color:#fff}
.ride-side span{font-size:12px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.8);margin-bottom:6px}
.ride-paused{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;pointer-events:none}
.ride-paused span{width:76px;height:76px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;color:#fff}
.kinds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:4px;border-radius:20px;background:var(--surface);border:1px solid var(--line);margin-bottom:14px}
.kinds button{height:44px;border:none;border-radius:16px;background:none;color:var(--soft);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.kinds button.on{background:var(--grad);color:var(--ink);box-shadow:var(--glow)}
.hint{font-size:13px;color:var(--muted);margin:-6px 0 14px;line-height:1.4}

/* ---- Animales ---- */
.animal-pic{background:linear-gradient(135deg,#FFE7B8,#FFD0B0);color:#B5401A}
.animal-pic>span{display:flex;align-items:center;justify-content:center;width:55%;height:55%}
.animal-pic>span svg{width:100%;height:100%}
.animal-tag{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 5px;border-radius:17px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:13px}
.ride .animal-tag{background:rgba(0,0,0,.4);border-color:rgba(255,255,255,.25);color:#fff}
.herd{padding:0 0 16px}
.herd h3{display:flex;align-items:center;gap:8px;margin:0 16px 10px;font-size:15px}
.herd h3 svg{width:18px;height:18px;color:#D0451B}
.herd-row{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none}
.herd-row::-webkit-scrollbar{display:none}
.herd-card{flex-shrink:0;width:96px;padding:12px 6px;border-radius:18px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 14px rgba(120,40,20,.07)}
.herd-card b{font-size:13px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.herd-card small{font-size:11px;color:var(--muted)}
.herd-card.add{border:1.5px dashed rgba(232,120,26,.55);background:var(--surface);box-shadow:none}
.herd-plus{width:64px;height:64px;border-radius:50%;background:var(--grad);color:var(--ink);font-size:32px;font-weight:700;display:flex;align-items:center;justify-content:center}
.animal-hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 20px 16px}
.animal-ring{padding:5px;border-radius:50%;background:var(--ring);box-shadow:var(--glow);margin-bottom:12px}
.animal-ring .avatar{border:4px solid #fff}
.animal-hero h1{margin:0;font-family:Rye,serif;font-weight:400;font-size:32px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.animal-meta{color:var(--muted);font-size:14px;margin-top:4px}
.animal-owner{display:inline-flex;align-items:center;gap:8px;margin-top:10px;border:none;background:none;color:var(--soft);font-size:14px;padding:4px}
.animal-bio{margin:10px 0 0;font-size:14px;line-height:1.45;color:var(--soft);max-width:420px;white-space:pre-wrap}

/* ---- Menú y reglas ---- */
.menu{padding:8px 10px calc(14px + env(safe-area-inset-bottom))}
.menu-item{width:100%;min-height:52px;display:flex;align-items:center;gap:12px;padding:0 12px;border:none;border-radius:14px;background:none;color:var(--text);font-size:15px;font-weight:600;text-align:left}
.menu-item:active{background:var(--surface)}
.menu-item.danger{color:#C2183A}

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;

    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k in el && typeof v !== 'string') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;

  const s = (Date.now() - new Date(iso).getTime()) / 1000;

  const m = Math.floor(s / 60); if (m < 60) return `hace ${m} min`;
  const hr = Math.floor(m / 60); if (hr < 24) return `hace ${hr} h`;
  const d = Math.floor(hr / 24); if (d < 7) return `hace ${d} ${d === 1 ? 'día' : 'días'}`;

  if (!file.type.startsWith('image/') || file.type === 'image/gif') return file;

  const map = new Map();
  items.slice().reverse().forEach(it => {
    if (!map.has(it.user_id)) map.set(it.user_id, { user: it.profiles || { id: it.user_id }, items: [] });
    map.get(it.user_id).items.push(it);
  });
  return [...map.values()].map(g => ({ ...g, unseen: g.items.some(i => !seenSundowns.has(i.id)) }));  // fetchPosts ya quita bloqueados y reportados
}

function likeControls(p, short) {
  const myId = state.me.id;
  let liked = (p.likes || []).some(l => l.user_id === myId);
  let likeCount = (p.likes || []).length;
  const countEl = h('span', { class: short ? '' : 'count' });
  const likeBtn = h('button', { class: 'iconbtn' + (short ? '' : ' plain'), 'aria-label': 'Dar yeehaw', icon: 'horse' });
  const paint = () => {
    likeBtn.classList.toggle('liked', liked);
    likeBtn.setAttribute('aria-pressed', String(liked));
    countEl.textContent = short ? likeCount.toLocaleString('es-MX') : `${likeCount.toLocaleString('es-MX')} ${likeCount === 1 ? 'yeehaw' : 'yeehaws'}`;
  };
  let busy = false;
  const rear = () => { likeBtn.classList.remove('rear'); void likeBtn.offsetWidth; likeBtn.classList.add('rear'); try { navigator.vibrate && navigator.vibrate(25); } catch (_) {} };
  likeBtn.addEventListener('animationend', (e) => { if (e.animationName === 'rear') likeBtn.classList.remove('rear'); });
  const setLike = async (want) => {
    if (busy) return;
    if (want === liked) { if (want) rear(); return; }
    busy = true; liked = want; likeCount += want ? 1 : -1; paint();
    likeBtn.classList.remove('rear'); if (want) rear();
    const res = want ? await sb.from('likes').insert({ post_id: p.id, user_id: myId })
                     : await sb.from('likes').delete().eq('post_id', p.id).eq('user_id', myId);
    if (res.error) { liked = !want; likeCount += want ? -1 : 1; paint(); toast('No se pudo guardar, intenta de nuevo'); }
    busy = false;
  };
  likeBtn.addEventListener('click', () => setLike(!liked));
  paint();
  return { likeBtn, countEl, setLike };
}
function burstEl() { return h('div', { class: 'burst', 'aria-hidden': 'true' }, h('span', { class: 'burst-horse', icon: 'horse' }), h('b', {}, 'YEEHAW!')); }
function fireBurst(b) { b.classList.remove('go'); void b.offsetWidth; b.classList.add('go'); }
async function sharePost(p) {
  const data = { title: 'Yeehaw', text: (p.caption || 'Mira esto en Yeehaw') + '\n', url: location.href };
  try { if (navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(location.href); toast('Enlace copiado'); } } catch (_) {}
}
async function deletePost(p) {
  if (!confirm('¿Borrar esta publicación?')) return false;
  const { error } = await sb.from('posts').delete().eq('id', p.id);
  if (error) { toast('No se pudo borrar'); return false; }
  const path = p.media_url.split('/media/')[1];
  if (path) sb.storage.from('media').remove([decodeURIComponent(path)]);
  toast('Borrado');
  return true;
}

function postCard(p) {
  const prof = p.profiles || {};

    ),

        h('b', {}, l.name || 'Ver producto'), h('span', {}, 'Ver en tienda'))))),

          const blob = await compressImage(photo, 480);
          const path = `${state.me.id}/avatar-${Date.now()}.jpg`;
          const up = await sb.storage.from('media').upload(path, blob, { contentType: 'image/jpeg' });
          if (up.error) throw up.error;

    paint();

// ---------- Sundowns (desaparecen en 24 horas) ----------
function openSundowns(groups, gi, onClose) {
  if (!groups.length) return;
  let ii = 0, timer = null, video = null;
  const bars = h('div', { class: 'sd-bars' });
  const head = h('div', { class: 'sd-head' });
  const stage = h('div', { style: 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center' });
  const cap = h('div', { class: 'sd-cap' });
  const inner = h('div', { class: 'sd-in' }, stage,
    h('div', { class: 'sd-top' }, bars, head),
    h('button', { class: 'sd-zone prev', 'aria-label': 'Anterior', onclick: () => prev() }),
    h('button', { class: 'sd-zone next', 'aria-label': 'Siguiente', onclick: () => next() }),
    cap);
  const viewer = h('div', { class: 'sd-viewer', role: 'dialog', 'aria-label': 'Tracks' }, inner);
  const stop = () => { clearTimeout(timer); if (video) { video.pause(); video = null; } };
  const close = () => { stop(); viewer.remove(); document.removeEventListener('keydown', onKey); if (onClose) onClose(); };
  const onKey = (e) => { if (e.key === 'Escape') close(); if (e.key === 'ArrowRight') next(); if (e.key === 'ArrowLeft') prev(); };
  document.addEventListener('keydown', onKey);
  function show() {
    stop();
    const g = groups[gi]; const it = g.items[ii];
    markSeen(it.id);
    bars.replaceChildren(...g.items.map((_, k) => h('div', { class: 'sd-bar' }, h('i', { style: `width:${k < ii ? 100 : 0}%` }))));
    const fill = bars.children[ii].firstChild;
    head.replaceChildren(...[avatar(g.user, 36),
      h('div', {}, h('b', {}, g.user.username || ''), h('br'), h('small', {}, timeAgo(it.created_at))),
      h('div', { class: 'sp' }),
      it.user_id === state.me.id && h('button', { class: 'iconbtn plain', style: 'color:#fff', 'aria-label': 'Borrar track', icon: 'trash', onclick: async () => {
        stop();
        if (await deletePost(it)) { g.items.splice(ii, 1); if (!g.items.length) { groups.splice(gi, 1); if (!groups.length) return close(); gi = Math.min(gi, groups.length - 1); ii = 0; } else ii = Math.min(ii, g.items.length - 1); }
        show();
      } }),
      it.user_id !== state.me.id && h('button', { class: 'iconbtn plain', style: 'color:#fff', 'aria-label': 'Más opciones', icon: 'more', onclick: () => { stop(); postMenu(it, () => close()); } }),
      h('button', { class: 'iconbtn plain', style: 'color:#fff', 'aria-label': 'Cerrar', icon: 'close', onclick: close })].filter(Boolean));
    cap.textContent = it.caption || '';
    cap.style.display = it.caption ? 'block' : 'none';
    if (it.media_type === 'video') {
      video = h('video', { src: it.media_url, playsInline: true, autoplay: true });
      video.addEventListener('timeupdate', () => { if (video && video.duration) fill.style.width = (video.currentTime / video.duration * 100) + '%'; });
      video.addEventListener('ended', () => next());
      video.addEventListener('error', () => { timer = setTimeout(next, 3000); });
      video.play().catch(() => { if (video) { video.muted = true; video.play().catch(() => {}); } });
      stage.replaceChildren(video);
      timer = setTimeout(next, 60000);
    } else {
      stage.replaceChildren(h('img', { src: it.media_url, alt: it.caption || 'Track de ' + (g.user.username || '') }));
      requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.transition = 'width 5s linear'; fill.style.width = '100%'; }));
      timer = setTimeout(next, 5000);
    }
  }
  function next() { const g = groups[gi]; if (ii < g.items.length - 1) ii++; else if (gi < groups.length - 1) { gi++; ii = 0; } else return close(); show(); }
  function prev() { if (ii > 0) ii--; else if (gi > 0) { gi--; ii = groups[gi].items.length - 1; } show(); }
  document.body.append(viewer);
  show();
}

async function renderRides() {
  const wrap = h('div', { class: 'rides' }, h('div', { class: 'spinner', style: 'margin-top:45vh' }));
  $app.append(h('div', { class: 'rides-top' }, h('div', { class: 'logo', style: 'font-size:26px' }, 'Rides'),
    h('button', { class: 'iconbtn', style: 'color:#fff;background:rgba(0,0,0,.35)', 'aria-label': 'Subir un ride', icon: 'plus', onclick: () => { state.uploadKind = 'ride'; go('upload'); } })), wrap);
  let rides = [];
  try { rides = await fetchPosts({ kinds: ['ride'] }); } catch (e) { return wrap.replaceChildren(h('div', { class: 'empty', style: 'margin-top:35vh' }, friendlyError(e))); }
  if (!HAS_KIND) return wrap.replaceChildren(h('div', { class: 'empty', style: 'margin-top:30vh' }, 'Los Rides todavía no están activados en la base de datos. Corre el SQL de actualización en Supabase.'));
  if (!rides.length) return wrap.replaceChildren(h('div', { class: 'empty', style: 'margin-top:30vh' },
    h('span', { class: 'logo', style: 'font-size:34px' }, 'Rides'), 'Videos cortos y verticales del rancho. ¡Sube el primero!',
    h('div', { style: 'margin-top:18px' }, h('button', { class: 'btn small', onclick: () => { state.uploadKind = 'ride'; go('upload'); } }, 'Subir mi ride'))));
  const cards = rides.map(rideCard);
  wrap.replaceChildren(...cards.map(c => c.el));
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      const c = cards.find(x => x.el === en.target); if (!c) return;
      if (en.isIntersecting && en.intersectionRatio > 0.6) c.play(); else c.pause();
    });
  }, { root: wrap, threshold: [0, 0.6, 1] });
  cards.forEach(c => io.observe(c.el));
}

      const { data: pub } = sb.storage.from('media').getPublicUrl(path);
      const fd = new FormData(form);
      const shop_links = kind !== 'sundown' && category === 'Outfits' ? [0, 1, 2].map(i => ({ name: String(fd.get('shop_name_' + i) || '').trim(), url: String(fd.get('shop_url_' + i) || '').trim() })).filter(l => safeUrl(l.url)) : [];
      const row = { user_id: state.me.id, media_url: pub.publicUrl, media_type: isVideo ? 'video' : 'image', caption: caption.value.trim() || null, category: kind === 'sundown' ? null : category, shop_links };
      if (kind !== 'post') row.kind = kind;
      if (animalId) row.animal_id = animalId;
      const ins = await sb.from('posts').insert(row);
      if (ins.error) { sb.storage.from('media').remove([path]); throw ins.error; }
      toast(kind === 'sundown' ? 'Track publicado. Se borra en 24 horas' : kind === 'ride' ? '¡Ride publicado! Yeehaw' : '¡Publicado! Yeehaw');
      state.category = 'Todo'; state.uploadKind = 'post'; go(kind === 'ride' ? 'rides' : 'feed');
    } catch (ex) { err.textContent = friendlyError(ex); btn.disabled = false; paintKind(); }
  } },
    kindBar, hint, fileInput, picker,
    catField,
    animalField,
    shopBox,
    h('div', { class: 'field' }, h('label', { for: 'cap' }, 'Descripción'), caption),
    err, btn);
  paintKind();
  main.append(form);
}

async function renderProfile() {
  const id = state.profileId || state.me.id;
  const isMe = id === state.me.id;
  const main = h('main');
  const top = h('header', { class: 'topbar' },
    !isMe ? h('button', { class: 'iconbtn plain', 'aria-label': 'Regresar', icon: 'back', onclick: () => go('feed') }) : h('div', { class: 'logo', style: 'font-size:24px' }, 'Perfil'),
    h('div'));
  $app.append(top, main);
  main.append(h('div', { class: 'spinner' }));

  const [{ data: prof }, posts, sdGroups, animals] = await Promise.all([
    sb.from('profiles').select('*').eq('id', id).maybeSingle(),
    fetchPosts({ userId: id }).catch(() => []),
    fetchSundownGroups(id),
    fetchAnimals({ ownerId: id }).catch(() => [])
  ]);
  const sd = sdGroups[0];
  if (!prof) return main.replaceChildren(h('div', { class: 'empty' }, 'No encontramos este perfil.'));
  const totalLikes = posts.reduce((s, p) => s + (p.likes || []).length, 0);
  if (!isMe) top.children[1].replaceWith(h('b', { style: 'font-size:17px' }, prof.username), h('div', { style: 'width:44px' }));

  const showAnimals = HAS_ANIMALS && (animals.length || isMe);
  main.replaceChildren(...[
    h('div', { class: 'prof-head' }, h('button', { style: 'border:none;background:none;padding:0', 'aria-label': sd ? 'Ver track' : 'Foto de perfil', onclick: () => { if (sd) openSundowns([sd], 0, () => render()); } },
        h('div', { class: 'ring' + (sd ? (sd.unseen ? ' new' : ' seen') : ''), style: 'width:92px;height:92px' }, h('div', {}, avatar(prof, 80)))),
      h('div', { class: 'stats' },
        h('div', {}, h('b', {}, posts.length), h('span', {}, posts.length === 1 ? 'Publicación' : 'Publicaciones')),
        h('div', {}, h('b', {}, totalLikes.toLocaleString('es-MX')), h('span', {}, 'Yeehaws')))),
    h('div', { class: 'prof-info' }, h('b', {}, prof.full_name || prof.username), h('div', {}, '@' + prof.username + (prof.rancho ? ' · ' + prof.rancho : ''))),
    isMe && h('div', { class: 'prof-btns' },
      h('button', { class: 'btn ghost', onclick: () => editProfile(prof) }, 'Editar perfil'),
      h('button', { class: 'btn ghost', onclick: async () => { await sb.auth.signOut(); } }, 'Cerrar sesión')),
    !isMe && h('div', { class: 'prof-btns' }, (state.blocked && state.blocked.has(id))
      ? h('button', { class: 'btn ghost', onclick: () => unblockUser(id, prof.username) }, 'Desbloquear')
      : h('button', { class: 'btn ghost', onclick: async () => { if (await blockUser(id, prof.username)) go('feed'); } }, 'Bloquear')),
    showAnimals && h('section', { class: 'herd' },
      h('h3', {}, h('span', { icon: 'horseshoe' }), isMe ? 'Mis animales' : 'Sus animales'),
      h('div', { class: 'herd-row' },
        ...animals.map(a => h('button', { class: 'herd-card', onclick: () => go('animal', { animalId: a.id }) },
          animalPic(a, 64), h('b', {}, a.name), h('small', {}, a.species))),
        isMe && h('button', { class: 'herd-card add', onclick: () => editAnimal(null) },
          h('div', { class: 'herd-plus' }, '+'), h('b', {}, 'Agregar'), h('small', {}, 'caballo, vaca…')))),
    gridOf(posts, isMe ? 'Aún no subes nada. Toca el botón + para tu primera publicación.' : 'Todavía no ha subido nada.'),
    isMe && h('div', { style: 'text-align:center;padding:22px 0 8px' }, h('button', { class: 'linkbtn', style: 'font-size:14px;text-decoration:underline', onclick: openRules }, 'Reglas y privacidad'))
  ].filter(Boolean));
}

// ---------- Perfiles de animales ----------
async function renderAnimal() {
  const main = h('main');
  const top = h('header', { class: 'topbar' },
    h('button', { class: 'iconbtn plain', 'aria-label': 'Regresar', icon: 'back', onclick: () => history.length > 1 && state.prevView ? go(state.prevView) : go('feed') }),
    h('b', { style: 'font-size:17px' }, ''), h('div', { style: 'width:44px' }));
  $app.append(top, main);
  main.append(h('div', { class: 'spinner' }));
  const [a] = await fetchAnimals({ id: state.animalId }).catch(() => []);
  if (!a) return main.replaceChildren(h('div', { class: 'empty' }, HAS_ANIMALS ? 'No encontramos este animal.' : 'Los perfiles de animales todavía no están activados. Corre el SQL de animales en Supabase.'));
  top.children[1].textContent = a.name;
  const posts = await fetchPosts({ animalId: a.id }).catch(() => []);
  const isOwner = a.owner_id === state.me.id;
  let following = (a.animal_follows || []).some(f => f.user_id === state.me.id);
  let followers = (a.animal_follows || []).length;
  const totalLikes = posts.reduce((s, p) => s + (p.likes || []).length, 0);
  const folCount = h('b', {});
  const folBtn = h('button', { class: 'btn' });
  const paint = () => {
    folCount.textContent = followers.toLocaleString('es-MX');
    folBtn.textContent = following ? 'Siguiendo' : 'Seguir';
    folBtn.className = following ? 'btn ghost' : 'btn';
  };
  folBtn.addEventListener('click', async () => {
    const want = !following; following = want; followers += want ? 1 : -1; paint();
    const res = want ? await sb.from('animal_follows').insert({ animal_id: a.id, user_id: state.me.id })
                     : await sb.from('animal_follows').delete().eq('animal_id', a.id).eq('user_id', state.me.id);
    if (res.error) { following = !want; followers += want ? -1 : 1; paint(); toast('No se pudo guardar'); }
  });
  paint();
  const details = [a.species, a.breed, animalAge(a)].filter(Boolean).join(' · ');
  main.replaceChildren(...[
    h('div', { class: 'animal-hero' },
      h('div', { class: 'animal-ring' }, animalPic(a, 116)),
      h('h1', {}, a.name),
      h('div', { class: 'animal-meta' }, details),
      a.profiles && h('button', { class: 'animal-owner', onclick: () => go('profile', { profileId: a.owner_id }) }, avatar(a.profiles, 26), h('span', {}, 'de ', h('b', {}, '@' + a.profiles.username))),
      a.bio && h('p', { class: 'animal-bio' }, a.bio)),
    h('div', { class: 'stats', style: 'grid-template-columns:repeat(3,minmax(0,1fr));padding:0 16px 14px' },
      h('div', {}, folCount, h('span', {}, 'Seguidores')),
      h('div', {}, h('b', {}, posts.length), h('span', {}, posts.length === 1 ? 'Publicación' : 'Publicaciones')),
      h('div', {}, h('b', {}, totalLikes.toLocaleString('es-MX')), h('span', {}, 'Yeehaws'))),
    h('div', { class: 'prof-btns' }, isOwner
      ? [h('button', { class: 'btn', onclick: () => { state.uploadKind = 'post'; state.tagAnimal = a.id; go('upload'); } }, 'Subir foto de ' + a.name),
         h('button', { class: 'btn ghost', onclick: () => editAnimal(a) }, 'Editar')]
      : folBtn),
    gridOf(posts, isOwner ? `Todavía no hay fotos de ${a.name}. Al subir una publicación, elígelo en "¿Quién sale?".` : `Todavía no hay fotos de ${a.name}.`)
  ].filter(Boolean));
}

function editAnimal(a) {
  const isNew = !a;
  let photo = null;
  let species = (a && a.species) || 'Caballo';
  const prev = h('div', {}, animalPic(a, 84));
  const fileIn = h('input', { type: 'file', accept: 'image/*', class: 'sr', id: 'anp' });
  fileIn.addEventListener('change', () => {
    photo = fileIn.files[0]; if (!photo) return;
    prev.replaceChildren(h('div', { class: 'avatar animal-pic', style: 'width:84px;height:84px' }, h('img', { src: URL.createObjectURL(photo), alt: '' })));
  });
  const name = h('input', { class: 'input', id: 'an_n', value: (a && a.name) || '', maxlength: '40', required: true, placeholder: 'ej. Lucero' });
  const breed = h('input', { class: 'input', id: 'an_b', value: (a && a.breed) || '', maxlength: '40', placeholder: 'ej. Cuarto de milla, Holstein' });
  const year = h('input', { class: 'input', id: 'an_y', type: 'number', inputmode: 'numeric', min: '1980', max: String(new Date().getFullYear()), value: (a && a.birth_year) || '', placeholder: 'ej. 2019' });
  const bio = h('textarea', { class: 'input', id: 'an_d', maxlength: '300', placeholder: 'Lo que lo hace especial: su carácter, sus premios, su historia…' });
  bio.value = (a && a.bio) || '';
  const spChips = h('div', { class: 'chips', style: 'padding:0 0 14px;flex-wrap:wrap' });
  const paintSp = () => spChips.replaceChildren(...SPECIES.map(sp => h('button', { type: 'button', class: 'chip' + (sp === species ? ' on' : ''), onclick: () => { species = sp; paintSp(); } }, sp)));
  paintSp();
  const err = h('p', { class: 'err', role: 'alert' });
  const save = h('button', { class: 'btn', type: 'submit' }, isNew ? 'Agregar animal' : 'Guardar');
  let close;
  const body = h('form', { class: 'sheet-body', onsubmit: async (e) => {
    e.preventDefault(); err.textContent = '';
    if (!name.value.trim()) return (err.textContent = 'Ponle un nombre.');
    save.disabled = true;
    try {
      const y = parseInt(year.value, 10);
      const row = { name: name.value.trim(), species, breed: breed.value.trim() || null, birth_year: y >= 1980 && y <= new Date().getFullYear() ? y : null, bio: bio.value.trim() || null };
      if (photo) {
        const blob = await compressImage(photo, 900);
        const path = `${state.me.id}/animal-${Date.now()}.jpg`;
        const up = await sb.storage.from('media').upload(path, blob, { contentType: 'image/jpeg' });
        if (up.error) throw up.error;
        row.photo_url = sb.storage.from('media').getPublicUrl(path).data.publicUrl;
      }
      let res;
      if (isNew) res = await sb.from('animals').insert({ ...row, owner_id: state.me.id }).select('id').single();
      else res = await sb.from('animals').update(row).eq('id', a.id).select('id').single();
      if (res.error) throw res.error;
      close(); toast(isNew ? `¡${row.name} ya tiene su perfil!` : 'Guardado');
      go('animal', { animalId: res.data.id });
    } catch (ex) { err.textContent = friendlyError(ex); save.disabled = false; }
  } },
    h('div', { style: 'display:flex;align-items:center;gap:16px;margin-bottom:18px' }, prev,
      fileIn, h('label', { for: 'anp', class: 'btn ghost small', style: 'display:inline-flex;align-items:center;cursor:pointer' }, a && a.photo_url ? 'Cambiar foto' : 'Poner foto')),
    h('div', { class: 'field' }, h('label', { for: 'an_n' }, 'Nombre'), name),
    h('div', { class: 'field' }, h('label', {}, '¿Qué es?')), spChips,
    h('div', { class: 'field' }, h('label', { for: 'an_b' }, 'Raza (opcional)'), breed),
    h('div', { class: 'field' }, h('label', { for: 'an_y' }, 'Año en que nació (opcional)'), year),
    h('div', { class: 'field' }, h('label', { for: 'an_d' }, 'Descripción (opcional)'), bio),
    err, save,
    !isNew && h('button', { type: 'button', class: 'btn ghost', style: 'margin-top:10px;color:#C2183A', onclick: async () => {
      if (!confirm(`¿Borrar el perfil de ${a.name}? Sus fotos se quedan en tus publicaciones.`)) return;
      const { error } = await sb.from('animals').delete().eq('id', a.id);
      if (error) return toast('No se pudo borrar');
      close(); toast('Perfil borrado'); go('profile', { profileId: state.me.id });
    } }, 'Borrar perfil'));
  close = openSheet(isNew ? 'Nuevo animal' : 'Editar ' + a.name, body);
}

function editProfile(prof) {
  let newAvatar = null;
  const prev = h('div', {}, avatar(prof, 84));
  const fileIn = h('input', { type: 'file', accept: 'image/*', class: 'sr', id: 'av' });
  fileIn.addEventListener('change', () => {
    newAvatar = fileIn.files[0]; if (!newAvatar) return;
    const a = h('div', { class: 'avatar', style: 'width:84px;height:84px' }, h('img', { src: URL.createObjectURL(newAvatar), alt: '' }));
    prev.replaceChildren(a);
  });
  const name = h('input', { class: 'input', id: 'pn', value: prof.full_name || '', maxlength: '60' });
  const rancho = h('input', { class: 'input', id: 'pr', value: prof.rancho || '', maxlength: '60', placeholder: 'ej. Rancho Los Álamos, Jalisco' });
  const err = h('p', { class: 'err', role: 'alert' });
  const save = h('button', { class: 'btn', type: 'submit' }, 'Guardar');
  let close;
  const body = h('form', { class: 'sheet-body', onsubmit: async (e) => {
    e.preventDefault(); save.disabled = true; err.textContent = '';
    try {
      const patch = { full_name: name.value.trim() || null, rancho: rancho.value.trim() || null };
      if (newAvatar) {
        const blob = await compressImage(newAvatar, 480);
        const path = `${state.me.id}/avatar-${Date.now()}.jpg`;
        const up = await sb.storage.from('media').upload(path, blob, { contentType: 'image/jpeg' });
        if (up.error) throw up.error;
        patch.avatar_url = sb.storage.from('media').getPublicUrl(path).data.publicUrl;
      }
      const { error } = await sb.from('profiles').update(patch).eq('id', state.me.id);
      if (error) throw error;
      await loadMe(); close(); toast('Perfil actualizado'); render();
    } catch (ex) { err.textContent = friendlyError(ex); save.disabled = false; }
  } },
    h('div', { style: 'display:flex;align-items:center;gap:16px;margin-bottom:18px' }, prev,
      fileIn, h('label', { for: 'av', class: 'btn ghost small', style: 'display:inline-flex;align-items:center;cursor:pointer' }, 'Cambiar foto')),
    h('div', { class: 'field' }, h('label', { for: 'pn' }, 'Nombre'), name),
    h('div', { class: 'field' }, h('label', { for: 'pr' }, 'Rancho o lugar'), rancho),
    err, save);
  close = openSheet('Editar perfil', body);
}

// ---------- arranque ----------
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
let started = false;
sb.auth.onAuthStateChange((_event, session) => {
  const changed = !started || (session && session.user.id) !== (state.session && state.session.user.id);
  started = true;
  state.session = session;
  if (!changed) return;
  state.me = null; state.view = 'feed'; render();
  if (session) setTimeout(async () => { await loadMe(); if (needsWelcome()) { state.view = 'welcome'; state.welcomeStep = 0; } render(); }, 0);
});
</script>
</body>
</html>
